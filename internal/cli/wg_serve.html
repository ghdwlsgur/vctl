<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vctl · WireGuard live</title>
<style>
  /* ==========================================================
     THEME VARIABLES — switch by toggling [data-theme] on <html>
     Structured after the Archify token contract: every colour is
     defined once per theme, and nothing below this block names a
     literal colour. A token missing from one theme is the bug this
     shape exists to make obvious.
     ========================================================== */
  :root,[data-theme="dark"]{
    color-scheme:dark;
    --bg:#090d12; --chrome:#0e141b; --panel:#151c24; --panel2:#111820;
    --line:#202a35; --ring:#344252;
    --ink:#e8edf2; --ink2:#a9b5c2; --muted:#718090; --acc:#f0883e;
    --c0:#4c8dff; --c1:#ef6f53; --c2:#35c07d; --c3:#f2c94c; --c4:#cf6fb8; --c5:#8b97a6;
    --c6:#7bc2e8; --c7:#b8a1ff;
    --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
    --shadow:0 18px 50px rgba(0,0,0,.28);
    --grid-line:rgba(113,128,144,.045);
    --glow:rgba(76,141,255,.055);
    /* Opaque colour painted behind translucent node fills so the routes
       drawn underneath are actually hidden rather than showing through. */
    --mask:#0f172a;

    /* Typed component kinds. A node's colour says what kind of thing it
       is, not which drawing function made it — so gateway, host and VM
       stay distinguishable in both themes without a second palette. */
    --acc-wash:rgba(240,136,62,.08); --acc-line:rgba(240,136,62,.42); --acc-line-strong:rgba(240,136,62,.62);
    --ok-wash:rgba(63,185,80,.09); --warn-wash:rgba(227,179,65,.09);
    --chrome-shadow:0 8px 30px rgba(0,0,0,.16); --node-shadow:rgba(0,0,0,.18);
    --canvas-tag-bg:rgba(9,13,18,.86);
    --crit-ink:#ff9b96; --crit-bg:rgba(39,15,17,.96); --crit-line:rgba(248,81,73,.35);
    --warn-ink:#f0d08a; --warn-bg:rgba(39,31,15,.96); --warn-line:rgba(227,179,65,.35);

    --gateway-fill:rgba(120,53,15,.34);   --gateway-stroke:#f0883e;
    --host-fill:rgba(6,78,59,.34);        --host-stroke:#35c07d;
    --vm-fill:rgba(8,51,68,.36);          --vm-stroke:#7bc2e8;
    --external-fill:rgba(30,41,59,.5);    --external-stroke:#8b97a6;
    --netband-fill:rgba(76,29,149,.3);    --netband-stroke:#b8a1ff;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#f6f8fa; --chrome:#ffffff; --panel:#ffffff; --panel2:#f0f3f6;
    --line:#d8dee6; --ring:#b6c0cc;
    --ink:#111820; --ink2:#3d4b5a; --muted:#5f6d7c; --acc:#bd5b16;
    --c0:#1f5fd0; --c1:#c0432b; --c2:#127a48; --c3:#8a6a00; --c4:#94408a; --c5:#5a6675;
    --c6:#1d6f96; --c7:#6544c4;
    --ok:#1a7f37; --warn:#8a6a00; --crit:#c1352b;
    --shadow:0 14px 34px rgba(15,24,32,.1);
    --grid-line:rgba(60,72,86,.05);
    --glow:rgba(31,95,208,.05);
    --mask:#ffffff;

    --acc-wash:rgba(189,91,22,.09); --acc-line:rgba(189,91,22,.4); --acc-line-strong:rgba(189,91,22,.6);
    --ok-wash:rgba(26,127,55,.11); --warn-wash:rgba(138,106,0,.12);
    --chrome-shadow:0 6px 18px rgba(15,24,32,.07); --node-shadow:rgba(15,24,32,.09);
    --canvas-tag-bg:rgba(255,255,255,.86);
    --crit-ink:#8f2018; --crit-bg:rgba(253,236,234,.97); --crit-line:rgba(193,53,43,.35);
    --warn-ink:#6b5200; --warn-bg:rgba(253,247,229,.97); --warn-line:rgba(138,106,0,.35);

    --gateway-fill:rgba(240,136,62,.16);  --gateway-stroke:#bd5b16;
    --host-fill:rgba(53,192,125,.17);     --host-stroke:#127a48;
    --vm-fill:rgba(123,194,232,.2);       --vm-stroke:#1d6f96;
    --external-fill:rgba(148,163,184,.18);--external-stroke:#5a6675;
    --netband-fill:rgba(184,161,255,.2);  --netband-stroke:#6544c4;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    display:flex;flex-direction:column;overflow:hidden}
  header{position:relative;z-index:5;display:flex;align-items:center;gap:24px;min-height:68px;
    padding:10px 18px;background:var(--chrome);border-bottom:1px solid var(--line);
    box-shadow:var(--chrome-shadow,0 8px 30px rgba(0,0,0,.16))}
  .brand{display:flex;align-items:center;gap:11px;min-width:250px}
  .brandmark{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--acc-line);
    background:var(--acc-wash);color:var(--acc);font-size:14px;font-weight:800;letter-spacing:-.08em;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .eyebrow{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  h1{margin:1px 0 0;font-size:15px;line-height:1.2;letter-spacing:-.02em}
  h1 span{color:var(--ink2);font-weight:500}
  #meta{display:flex;align-items:stretch;gap:6px;min-width:0}
  .metric{min-width:74px;padding:5px 10px;border-left:1px solid var(--line)}
  .metric:first-child{border-left:0}
  .metric strong{display:block;color:var(--ink);font-size:13px;line-height:1.15;font-variant-numeric:tabular-nums}
  /* A stale snapshot is not an error — nothing is broken and no alert is due.
     It is a caveat on everything else on screen, so it is coloured like a
     warning rather than a failure, and it stays legible instead of shouting. */
  .metric strong.stale{color:var(--warn)}
  .metric strong.stale::after{content:" ▲";font-size:9px;vertical-align:1px}
  .metric span{display:block;margin-top:2px;color:var(--muted);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
  .live-summary{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--ink2);font-size:10.5px;white-space:nowrap}
  .live-summary .pulse{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .live-summary.ok .pulse{background:var(--ok);box-shadow:0 0 0 4px var(--ok-wash)}
  .live-summary.warn .pulse{background:var(--warn);box-shadow:0 0 0 4px var(--warn-wash)}
  .health{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;padding:5px 10px;border-radius:4px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
  .health::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
  .health.ok{color:var(--ok)} .health.fail{color:var(--crit)}
  /* Wraps rather than overflows. The keys to the right grew when component
     kinds got their own legend, and a single non-wrapping row pushed the theme
     and zoom controls off the edge — clipped to "LIGH" at 1600px wide. */
  #toolbar{position:relative;z-index:4;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:43px;padding:6px 18px;
    background:var(--chrome);border-bottom:1px solid var(--line);box-shadow:var(--chrome-shadow,0 8px 24px rgba(0,0,0,.12))}
  .tool-label{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
  #legend{display:flex;gap:5px;flex-wrap:wrap;color:var(--ink2);font-size:10.5px;align-items:center}
  #legend .i{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 8px;
    border:1px solid transparent;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer}
  #legend .i:hover{border-color:var(--ring);background:var(--panel)}
  #legend .i:focus-visible,.view-controls button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #legend .i.on{border-color:var(--acc-line-strong);background:var(--acc-wash);color:var(--ink)}
  #legend .dt{width:8px;height:8px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
  .tool-spacer{flex:1}
  #selection{display:none;align-items:center;gap:7px;padding:4px 8px;background:var(--acc-wash);
    border:1px solid var(--acc-line);border-radius:4px;color:var(--ink2);font-size:10px}
  #selection.on{display:inline-flex}
  #selection b{color:var(--acc)}
  #selection button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;padding:0 2px}
  .status-key{display:flex;align-items:center;gap:10px;padding:0 12px;border-left:1px solid var(--line);
    color:var(--muted);font-size:9.5px;white-space:nowrap}
  .status-key:empty{display:none}
  /* The controls stay together and stay last, whichever row they land on. */
  .view-controls{flex:0 0 auto}
  .status-key span{display:inline-flex;align-items:center;gap:5px}
  .status-key i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .status-key .up{color:var(--ok)} .status-key .idle{color:var(--warn)} .status-key .down{color:var(--crit)}
  /* Unobserved is grey on purpose: it is the absence of a reading, not a bad
     one, and colouring it like a fault would invent information. */
  .status-key .unk{color:var(--muted)}
  .status-key .kind{color:var(--ink2)}
  .status-key .kind i{width:8px;height:8px;border-radius:2px;border:1.4px solid currentColor;background:transparent}
  .status-key .kind.k-gateway{color:var(--gateway-stroke)}
  .status-key .kind.k-host{color:var(--host-stroke)}
  .status-key .kind.k-vm{color:var(--vm-stroke)}
  .status-key .kind.k-net{color:var(--netband-stroke)}
  .status-key .kind.k-external{color:var(--external-stroke)}
  .status-key .kind.k-external i{border-style:dashed}
  .status-key .conf{color:var(--ink2)}
  .status-key .conf i{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
  .status-key .conf i.hollow{background:transparent;border:1.6px solid var(--ink2)}
  .view-controls{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .view-controls button{appearance:none;width:30px;height:28px;border:0;border-left:1px solid var(--line);
    background:var(--panel2);color:var(--ink2);font:600 12px/1 inherit;cursor:pointer}
  .view-controls button:first-child{border-left:0;width:auto;padding:0 9px;font-size:9px;letter-spacing:.06em}
  .view-controls button:hover{background:var(--panel);color:var(--ink)}
  main{position:relative;flex:1;overflow:auto;overscroll-behavior:contain;
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),
      radial-gradient(circle at 48% 0,var(--glow),transparent 38%);
    background-size:24px 24px,24px 24px,100% 100%}
  main::before{content:"ARCHITECTURE CANVAS";position:sticky;left:16px;top:12px;z-index:2;display:inline-block;
    padding:4px 7px;border:1px solid var(--line);background:var(--canvas-tag-bg);color:var(--muted);
    font-size:8px;font-weight:700;letter-spacing:.14em;pointer-events:none}
  svg#net{display:block;margin:-18px auto 0;transition:width .18s ease-out,height .18s ease-out}
  #errs{position:absolute;z-index:10;right:16px;bottom:12px;max-width:min(560px,calc(100% - 32px));margin:0;
    color:var(--crit-ink);background:var(--crit-bg);border:1px solid var(--crit-line);border-radius:5px;
    font-size:10.5px;white-space:pre-wrap;padding:8px 10px;box-shadow:var(--shadow)}
  #errs:empty{display:none}
  /* Drift sits above the error panel and is amber, not red: a peer on the wire
     that the snapshot lacks is out-of-date data, not a failure. The action is a
     re-sync, so it reads as a notice with a next step. */
  #drift{position:absolute;z-index:10;right:16px;bottom:12px;max-width:min(560px,calc(100% - 32px));margin:0;
    color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:5px;
    font-size:10.5px;white-space:pre-wrap;padding:8px 10px;box-shadow:var(--shadow)}
  #drift:empty{display:none}
  #errs:not(:empty)~#drift{bottom:calc(12px + 4.6em)}

  .zone{fill:var(--panel);fill-opacity:.34;stroke:var(--ring);stroke-width:1.1;stroke-dasharray:6 5}
  .zlab{fill:var(--ink2);font-size:12px;font-weight:700;letter-spacing:.08em}
  .zsub{fill:var(--muted);font-size:10.5px}
  .lanehead{fill:var(--muted);font-size:9px;font-weight:700;letter-spacing:.14em}
  .lanerule{stroke:var(--line);stroke-width:1}
  .hbox{fill:var(--panel2);fill-opacity:.8;stroke:var(--ring);stroke-width:1.1}
  /* A physical host is a container, so its kind tints the border and leaves the
     fill neutral — the VMs nested inside it are what carry colour, and tinting
     both would make the box compete with its own contents. */
  .hbox.k-host{stroke:var(--host-stroke);stroke-opacity:.72}
  .htit{fill:var(--ink2);font-size:9.5px;font-weight:700;letter-spacing:.03em}
  .nbox{fill:var(--panel);stroke:var(--ring);stroke-width:1.2;filter:drop-shadow(0 5px 10px var(--node-shadow))}
  /* A node's colour is its kind, not the drawing function that made it.
     .hub/.vmb/.band/.ext used to be styling variants that happened to line up
     with kinds most of the time; a gateway drawn by the mesh stack and one
     drawn as a top chip came out different colours for no reason a reader
     could name. These are the kinds the topology actually carries. */
  .nbox.k-gateway{fill:var(--gateway-fill);stroke:var(--gateway-stroke)}
  .nbox.k-host{fill:var(--host-fill);stroke:var(--host-stroke)}
  .nbox.k-vm{fill:var(--vm-fill);stroke:var(--vm-stroke)}
  .nbox.k-external{fill:var(--external-fill);stroke:var(--external-stroke);stroke-dasharray:5 4}
  .nbox.k-net{fill:var(--netband-fill);stroke:var(--netband-stroke)}
  .nbox.hub{stroke-width:1.8}
  .nbox.vmb{stroke-width:1.1}
  .nbox.band{stroke-width:1}
  .nbox.ext{stroke-dasharray:5 4}
  .ntit{fill:var(--ink);font-size:12px;font-weight:700}
  .nsub{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
  .nkind{fill:var(--muted);font-size:7.8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .btit{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .bsub{fill:var(--muted);font-size:9.5px}
  .plab{font-size:9px;font-weight:700}
  .natlab{fill:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em}
  .warnb{fill:var(--warn);font-size:9.5px}

  .tun{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .tun.dash{stroke-dasharray:6 5}
  .reach{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 5;opacity:.85}
  .flow{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:5 16;opacity:0}
  .flow.on{opacity:.95;animation:fl linear infinite}
  @keyframes fl{to{stroke-dashoffset:-42}}
  .grey{fill:none;stroke:var(--ring);stroke-width:1.4;opacity:.9}
  .nat{stroke:var(--ring);stroke-width:2;stroke-dasharray:3 6}
  .pdot{stroke:var(--panel);stroke-width:2}
  .sdot{stroke:var(--panel);stroke-width:1.6}
  .jdot{fill:var(--ring)}
  .hot{cursor:pointer}
  .dim{opacity:.06;transition:opacity .15s}
  @media (prefers-reduced-motion:reduce){.flow{display:none}svg#net{transition:none}}
  #tip{position:fixed;pointer-events:none;z-index:30;background:var(--panel);border:1px solid var(--ring);
    border-radius:5px;padding:9px 11px;font-size:11px;box-shadow:var(--shadow);
    opacity:0;transition:opacity .1s;max-width:340px}
  #tip .t{font-weight:700;margin-bottom:3px;color:var(--ink)} #tip .m{color:var(--ink2);line-height:1.5}
  @media(max-width:980px){
    header{gap:12px;flex-wrap:wrap}.brand{min-width:210px}#meta{order:3;width:100%;border-top:1px solid var(--line);padding-top:7px}
    .live-summary{margin-left:auto}.status-key{display:none}#toolbar{overflow-x:auto}.tool-spacer{min-width:12px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brandmark">V/</div>
    <div><div class="eyebrow">vctl network observability</div><h1>WireGuard <span>/ topology</span></h1></div>
  </div>
  <div id="meta" aria-label="topology summary">
    <div class="metric"><strong id="site-count">–</strong><span>Sites</span></div>
    <div class="metric"><strong id="gateway-count">–</strong><span>Gateways</span></div>
    <div class="metric"><strong id="tunnel-count">–</strong><span>Tunnels</span></div>
    <!-- Two clocks, deliberately. Structure comes from the last `vctl wg sync`;
         only traffic and handshake come from live polling. One "Updated" made a
         six-day-old graph look current, because the page kept animating. -->
    <div class="metric"><strong id="topology-at">–</strong><span>Topology</span></div>
    <div class="metric"><strong id="updated-at">–</strong><span>Telemetry</span></div>
  </div>
  <div class="live-summary" id="live-summary"><i class="pulse"></i><span>waiting for tunnel state</span></div>
  <span class="health" id="health">connecting</span>
</header>
<div id="toolbar">
  <span class="tool-label">INTERFACES</span>
  <div id="legend" aria-label="interface filter"></div>
  <span id="selection"><b></b> selected <button type="button" aria-label="clear selection">×</button></span>
  <span class="tool-spacer"></span>
  <!-- Confidence, kept apart from state. The diagram mixes collected facts with
       presentational inference — a VIP owner matched from label text, an
       inventory host guessed from an endpoint address — and a reader cannot tell
       them apart from the shapes alone. Filled means recorded; hollow means
       inferred, and the tooltip says from what. -->
  <div class="status-key" id="kind-key" aria-label="component kind legend"></div>
  <div class="status-key" aria-label="confidence legend">
    <span class="conf"><i class="solid"></i>recorded</span><span class="conf"><i class="hollow"></i>inferred</span>
  </div>
  <!-- Only the states this fleet is actually in. The key used to list all six
       whatever was on screen, so "poll error" and "never" sat in the legend of a
       healthy fleet and read as categories somebody should go looking for. The
       wording is the same; what changed is that its presence now means
       something. -->
  <div class="status-key" id="state-key" aria-label="tunnel state legend"></div>
  <div class="view-controls" aria-label="theme">
    <button type="button" id="theme-toggle" title="switch between dark and light">DARK</button>
  </div>
  <div class="view-controls" aria-label="zoom">
    <button type="button" id="zoom-fit" title="fit to screen">FIT</button>
    <button type="button" id="zoom-out" aria-label="zoom out">−</button>
    <button type="button" id="zoom-in" aria-label="zoom in">+</button>
  </div>
</div>
<main id="canvas"><svg id="net" role="img" aria-label="WireGuard network architecture"></svg><pre id="errs"></pre><pre id="drift"></pre></main>
<div id="tip"></div>
<script>
"use strict";
// Wiring-diagram renderer: hub iface ports -> NAT -> per-zone endpoints (nested in
// physical hosts) -> reachable-CIDR bands. Band hookups are a grey underlay bus plus
// per-tunnel dashed colour branches (both sides, Seoul like Incheon). Orthogonal
// elbows only; clicking any tunnel focuses that iface and dims the rest.
// Fully driven by /topology + /events; window.WG_BOOT {topology,frames} replays.
const BOOT=window.WG_BOOT||null;
const SVGNS="http://www.w3.org/2000/svg";
const mk=(t,a,p)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PALETTE=["--c0","--c1","--c2","--c3","--c5","--c4","--c6","--c7"];
const ifColMap=new Map();
const ifColor=i=>{if(!ifColMap.has(i))ifColMap.set(i,cssv(PALETTE[ifColMap.size%PALETTE.length]));return ifColMap.get(i)};
const fmtRate=b=>{if(!b||b<1)return"·";const k=1024;return b>=k*k?(b/k/k).toFixed(1)+"M/s":b>=k?(b/k).toFixed(1)+"K/s":b.toFixed(0)+"B/s"};
const hsState=s=>s==null||s<0?"crit":s<=180?"ok":"warn";
const hsLabel=s=>s==null||s<0?"no-handshake":s<=180?`up · ${s}s`:`idle · ${Math.round(s/60)}m`;

// POLL_STALE_SECONDS is how long a tunnel's newest sample may age before it stops
// counting as observed. Pollers run every few seconds, so anything past a minute
// means this tunnel's gateway has gone quiet even if others are reporting.
const POLL_STALE_SECONDS=60;

// Six states, because "down" was answering three different questions at once:
// the tunnel never handshook, or nobody asked it, or the gateway could not be
// reached. Those need different responses and used to look identical.
//
//   active   recent handshake
//   idle     polled, handshake is old
//   never    polled, no handshake has ever completed
//   stale    the newest sample for this tunnel has aged out
//   unknown  no poll has attributed anything here yet
//   error    a gateway on this tunnel failed to poll
const TUNNEL_STATES=["active","idle","never","stale","unknown","error"];
const STATE_CLS={active:"ok",idle:"warn",never:"crit",stale:"warn",unknown:"muted",error:"crit"};

// edgeHosts is the gateways a tunnel runs between. Both ends when the edge
// carries them; otherwise the node ids, which for gateways are the hostnames.
function edgeHosts(e){
  const hs=[];
  if(e.a&&e.a.host)hs.push(e.a.host);
  if(e.b&&e.b.host)hs.push(e.b.host);
  if(!hs.length){for(const id of [e.source,e.target])if(id&&!id.includes("|"))hs.push(id);}
  return hs;
}
function tunnelState(e){
  // A failed poll outranks everything. Whatever the last sample said, we do not
  // currently know — reporting the stale value as fact is how a dead gateway
  // reads as healthy.
  for(const h of edgeHosts(e))if(pollErrors[h])return"error";
  const st=stats[e.id];
  if(!st)return"unknown";
  // Newest sample across both ends. `at` is absent on older payloads, in which
  // case age cannot be judged and the handshake is taken at face value.
  let newest=0;
  for(const k in (st.sides||{})){const a=st.sides[k].at||0;if(a>newest)newest=a;}
  if(newest&&frameAt&&frameAt-newest>POLL_STALE_SECONDS)return"stale";
  if(st.hs==null||st.hs<0)return"never";
  return st.hs<=180?"active":"idle";
}
const zoneKey=dc=>dc?String(dc).split("-")[0]:"etc";
const ifCmp=(a,b)=>{const m=x=>/^(.*?)(\d*)$/.exec(String(x));const A=m(a),B=m(b);
  return A[1]===B[1]?(parseInt(A[2]||"-1")-parseInt(B[2]||"-1")):(A[1]<B[1]?-1:1)};
const kindLabel=k=>({"gateway":"WG HUB","physical-host":"PHYSICAL HOST",vm:"VIRTUAL MACHINE",
  device:"DEVICE",external:"EXTERNAL PEER"}[k]||String(k||"ENDPOINT").replaceAll("-"," ").toUpperCase());
const svg=document.getElementById("net"), tip=document.getElementById("tip"), canvas=document.getElementById("canvas");
let stats={}, tunnels=[], statusDots=new Map(), curTopo=null, focusIf=null;
// Poll outcome, kept beside the samples. "no traffic" and "we could not ask"
// used to arrive as the same absence.
let pollErrors={}, frameAt=0;
let focusIfaces=new Set(),focusNodes=new Set(),focusEdges=new Set(),focusHubIfaces=new Set();
let focusCIDRs=new Set();
let vipFocusNodes=new Map();
let canvasBase={w:800,h:200},zoom=1;

function sizeCanvas(w,h){
  canvasBase={w,h};
  svg.setAttribute("width",Math.round(w*zoom));
  svg.setAttribute("height",Math.round(h*zoom));
}
function setZoom(next){
  zoom=Math.max(.55,Math.min(1.8,next));
  sizeCanvas(canvasBase.w,canvasBase.h);
}
function fitCanvas(){
  const room=Math.max(320,canvas.clientWidth-44);
  setZoom(Math.min(1,room/canvasBase.w));
}

function hot(el,fn){el.classList.add("hot");
  el.addEventListener("mouseenter",ev=>{const[t,m]=fn();tip.innerHTML=`<div class="t">${esc(t)}</div><div class="m">${esc(m)}</div>`;tip.style.opacity=1;mv(ev);});
  el.addEventListener("mousemove",mv); el.addEventListener("mouseleave",()=>tip.style.opacity=0);}
function mv(ev){let x=ev.clientX+12,y=ev.clientY+12;if(x+290>innerWidth)x=ev.clientX-290;tip.style.left=x+"px";tip.style.top=y+"px";}
function clickFocus(el,ifc){el.addEventListener("click",ev=>{ev.stopPropagation();setFocus(focusIf===ifc?null:ifc);});}

// ---------- shared glyphs ----------
// Every box on the canvas is the same card: kind eyebrow, title, address line.
// The hub passes its own sub text because it shows only an underlay address.
// Returns the rect so callers can attach tooltips and focus clicks.
// kindClass maps a collected node kind onto the typed token that colours it.
// Unknown kinds fall through to the external token rather than to a default
// that looks like a known one — a shape nobody has classified should not be
// dressed as a gateway.
const kindClass=k=>({"gateway":"k-gateway","physical-host":"k-host","vm":"k-vm","network":"k-net"})[k]||"k-external";

function nodeCard(p,{x,y,w,h,node,sub,cls=""}){
  const box=mk("rect",{x,y,width:w,height:h,rx:cls.includes("hub")?9:8,
    class:("nbox "+kindClass(node.kind)+" "+cls).trim()},p);
  mk("text",{x:x+12,y:y+14,class:"nkind"},p).textContent=kindLabel(node.kind);
  mk("text",{x:x+12,y:y+30,class:"ntit"},p).textContent=node.label;
  mk("text",{x:x+12,y:y+46,class:"nsub"},p).textContent=
    sub!==undefined?sub:[node.ip,node.tunnelIp].filter(Boolean).join(" · ");
  return box;
}

// A tunnel's live bead: colour by interface, registered for stat updates, and
// captioned with handshake age plus rx/tx. prefix/detail wrap that caption with
// tunnel-specific text (a /32 mesh address, a reverse route), and cls picks the
// bead style — "sdot" for the compact mesh stack, "pdot" everywhere else.
// A drawn tunnel: the static run plus the animated flow twin that rides it,
// registered for stat updates and wired so clicking the run focuses its
// interface. title carries the arrow the calling section uses — "→" for a
// dial-in leg, "↔" for a mesh or hop leg.
function tunnelRun(gt,gf,{d,col,edge,iface,title}){
  const base=mk("path",{d,class:"tun",stroke:col},gt);
  const fl=mk("path",{d,class:"flow",stroke:col},gf);
  tunnels.push({id:edge.id,base,fl});
  hot(base,()=>{const st=stats[edge.id]||{};
    return[title,`allowed ${edge.allowed} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} · tx ${fmtRate(st.tx)} · click to focus`]});
  clickFocus(base,iface);
  return base;
}

function statusDot(p,{cx,cy,r=5.5,eid,col,title,prefix="",detail="",cls="pdot"}){
  const dot=mk("circle",{cx,cy,r,fill:col,class:cls+" hot"},p);
  if(eid)statusDots.set(eid,dot);
  hot(dot,()=>{const st=stats[eid]||{};
    return[title,`${prefix}${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} · tx ${fmtRate(st.tx)}${detail}`];});
  return dot;
}

// ---------- model prep: dedup same-IP gateways, pick hub ----------
function prep(topo){
  const N=new Map(topo.nodes.map(n=>[n.id,{...n}]));
  const alias=new Map(), byIp={};
  for(const n of N.values())if(n.kind==="gateway"&&n.ip)(byIp[n.ip]=byIp[n.ip]||[]).push(n);
  for(const ip in byIp){const g=byIp[ip];if(g.length<2)continue;
    g.sort((a,b)=>a.label.length-b.label.length||(a.id<b.id?-1:1));
    for(const d of g.slice(1)){alias.set(d.id,g[0].id);N.delete(d.id);}}
  const eseen=new Set(), E=[];
  for(const e of topo.edges){
    const s=alias.get(e.source)||e.source, t=alias.get(e.target)||e.target;
    if(s===t)continue;
    const k=[s,t,e.iface,e.allowed].join("~"); if(eseen.has(k))continue; eseen.add(k);
    E.push({...e,source:s,target:t});
  }
  let hub=null;
  for(const n of N.values())if(n.kind==="gateway"&&(n.ifaces||[]).length>((hub&&hub.ifaces||[]).length||0))hub=n;
  return {N,E,hub};
}
const cidrs=a=>String(a||"").split(",").map(s=>s.trim()).filter(s=>s&&!/\/32$|\/128$/.test(s));
const slash32=a=>String(a||"").split(",").map(s=>s.trim()).find(s=>/\/32$/.test(s))||"";

// ---------- wiring model: what the hub sees, before any geometry ----------
// Groups the hub's peers per interface and sorts them into the buckets the layout
// draws differently. A tunnel collected only from the far side is flipped so it
// still reads hub→peer, which is why a reverse-only peer gets promoted here
// rather than in the drawing code.
//   mesh      — an interface with >=4 peers routing nothing wider than /32
//   topSpokes — peers sitting in the hub's own zone
//   farSpokes — peers in another zone
//   hops      — edges that never touch the hub at all
function wiringModel(N,E,hub){
  const touch=new Map();
  const T=id=>{if(!touch.has(id))touch.set(id,{fwd:[],rev:[]});return touch.get(id)};
  // The far end's AllowedIPs used to arrive as a second edge, because one tunnel
  // produced two — the id carried the observing side's interface name. One
  // tunnel is now one edge with both ends on it, so the reverse route is read
  // off e.b instead of from an edge that no longer exists.
  //
  // sideEdge presents one end of an edge in the shape the layout expects: a
  // flat iface/allowed pair, since every consumer below reads those two fields.
  const sideEdge=(e,side,source,target)=>({...e,source,target,
    iface:(side&&side.iface)||e.iface, allowed:(side&&side.allowed)||"", _side:true});
  for(const e of E){
    if(e.source===hub.id){
      T(e.target).fwd.push(e);
      if(e.b)T(e.target).rev.push(sideEdge(e,e.b,e.target,hub.id));
    }
    else if(e.target===hub.id){
      T(e.source).rev.push(e);
      if(e.b)T(e.source).fwd.push(sideEdge(e,e.b,hub.id,e.source));
    }
  }
  const perIface=new Map();
  for(const [oid,g] of touch){
    if(g.fwd.length===0&&g.rev.length>0){for(const e of g.rev)g.fwd.push({...e,source:hub.id,target:oid,_rev:true});g.rev=[];}
    for(const e of g.fwd){if(!perIface.has(e.iface))perIface.set(e.iface,[]);perIface.get(e.iface).push({oid,e,back:g.rev});}
  }
  const meshIf=new Set();
  for(const [ifc,list] of perIface)
    if(list.length>=4&&list.every(s=>cidrs(s.e.allowed).length===0))meshIf.add(ifc);
  const spokes=[],mesh=[];
  for(const [ifc,list] of perIface)
    for(const s of list)(meshIf.has(ifc)?mesh:spokes).push({...s,iface:ifc});
  const hops=E.filter(e=>e.source!==hub.id&&e.target!==hub.id);
  const topSpokes=spokes.filter(s=>{const n=N.get(s.oid);return n&&zoneKey(n.dc)===zoneKey(hub.dc);});
  const farSpokes=spokes.filter(s=>!topSpokes.includes(s));
  return {meshIf,spokes,mesh,hops,topSpokes,farSpokes};
}

// Buckets the far endpoints into the right-hand zone columns, keyed by zone. Hop
// endpoints that no bucket claimed yet join their own zone so a transit node in
// another site still gets drawn; hub-zone and external nodes are left out because
// the hub row and the external column already own them.
function zoneBuckets(N,hub,{farSpokes,spokes,mesh,hops}){
  const zmap=new Map();
  const Z=k=>{if(!zmap.has(k))zmap.set(k,[]);return zmap.get(k)};
  for(const s of farSpokes){const n=N.get(s.oid);Z(n?zoneKey(n.dc):"etc").push(s);}
  const placed=new Set([hub.id,...spokes.map(s=>s.oid),...mesh.map(s=>s.oid)]);
  for(const e of hops)for(const id of[e.source,e.target]){
    const n=N.get(id);
    if(n&&!placed.has(id)&&n.kind!=="external"&&zoneKey(n.dc)!==zoneKey(hub.dc)){
      placed.add(id);Z(zoneKey(n.dc)).push({oid:id,e:null,iface:null,back:[]});}
  }
  return zmap;
}

// Attaches IPAM-ledger VIPs (e.g. o11y DNAT) to the endpoint that owns them, and
// records which node each interface fronts in vipFocusNodes — that map is what
// lets a wg3 selection light its DNAT owner.
//
// Two ways to decide the owner, and the page keeps them apart:
//
//   stated    ip_allocations.owner_public_key names the endpoint. Exact.
//   guessed   the endpoint label's first token appears in the VIP label,
//             longest match winning.
//
// The guess is what this always did, and it is substring matching on two
// human-typed strings: it attaches a VIP to the wrong endpoint when one label
// contains another's prefix, attaches nothing when either side is renamed, and
// the screen could not say which had happened. It stays as the fallback for rows
// nobody has filled in, but it is marked, so a reader can tell a fact from an
// inference without reading this function.
function attachVips(topo,N,spokes){
  const vipsBy=new Map();
  // Endpoint public key → node id, for the stated case.
  const byKey=new Map();
  // Every interface's key, not just the node's first. A gateway has one key per
  // interface — sre-lb runs wg1 and wg-personal with different keys — so
  // indexing the node key alone made a VIP naming the second interface fall
  // through to the label guess and render as an inference.
  for(const s of spokes){
    const n=N.get(s.oid); if(!n)continue;
    if(n.pub)byKey.set(n.pub,s.oid);
    for(const i of (n.ifaces||[]))if(i.pub)byKey.set(i.pub,s.oid);
  }
  for(const v of (topo.vips||[])){
    let oid=null,guessed=false;
    if(v.owner&&byKey.has(v.owner))oid=byKey.get(v.owner);
    if(!oid){
      let best=null;
      for(const s of spokes){const n=N.get(s.oid);if(!n)continue;
        const tok=String(n.label).split(/[\s(]/)[0];
        if(tok&&v.label.includes(tok)&&(!best||tok.length>best.tok))best={oid:s.oid,tok:tok.length};}
      if(!best)continue;
      oid=best.oid; guessed=true;
    }
    // Focus by the interface that actually carries the VIP, not by the name in
    // the ledger's wg_tunnel field.
    //
    // That field is free text and in this fleet it names the *destination* mesh:
    // the o11y VIPs read "wg3", which lives on the incheon hub, while the VIPs
    // are DNAT'd on sre-lb and leave over wg1. Keying on it meant selecting the
    // hub's wg3 lit up sre-lb — a host with no wg3 at all — and selecting sre-lb's
    // wg1, the interface that really carries them, brought no VIP into focus.
    //
    // The owner key resolves it exactly: find which of the owner's interfaces
    // holds that key. Fall back to wg_tunnel only when there is no owner, where
    // it remains a guess like everything else about an unbound VIP.
    const owner=N.get(oid), ifc=vipIface(owner,v);
    if(!vipsBy.has(oid))vipsBy.set(oid,[]);
    vipsBy.get(oid).push({...v,guessed,iface:ifc||v.iface});
    if(ifc){
      if(!vipFocusNodes.has(ifc))vipFocusNodes.set(ifc,new Set());
      vipFocusNodes.get(ifc).add(oid);
    }
  }
  return vipsBy;
}

// vipIface is the interface on the owning endpoint that carries a VIP.
//
// With a recorded owner key this is exact. Without one, wg_tunnel is all there
// is — and it is only trusted when the owner actually has an interface by that
// name, because naming another host's interface is how it is usually wrong.
// hopKey is the focus key for a tunnel that does not touch the hub.
//
// Interface names are chosen per host, so a bare name only addresses a tunnel
// when nothing else uses it. When the hub also runs an interface by that name,
// focusClosure keeps hub-attached edges and drops this one — so clicking it dimmed
// the whole diagram and lit nothing. Scoping to host/iface makes it addressable;
// the plain name is kept everywhere else so the common case reads unchanged.
// hopKey identifies the interface a hop tunnel leaves from.
//
// An interface is (host, name), never a name. wg3 on the hub and wg3 on the
// Seoul gateway are two interfaces on two machines that happen to share a
// word — the operations ledger warns about exactly this and names three
// separate nodes called wireguard-gw-incheon.
//
// This used to qualify a hop only when its name collided with one of the hub's,
// which got both halves wrong. Two hops sharing a name with each other but not
// with the hub merged into one filter chip, so selecting it lit tunnels on
// different machines as though they were one interface. And whether a hop was
// qualified at all depended on how somebody had named an interface on a
// different node, so adding a hub interface silently renamed unrelated filters.
//
// Hub-adjacent edges keep the bare name: there is one hub, so its names cannot
// be ambiguous. Everything else carries its owner. e.iface describes the source
// side, so the owner is e.source.
function hopKey(e,hub){
  const bare=e.iface;
  if(!hub||!bare)return bare;
  if(e.source===hub.id||e.target===hub.id)return bare;
  return e.source+"/"+bare;
}

// ifLabel is what a filter chip says, which is not what it means.
//
// The key is always (host, name); the label drops the host while the bare name
// still picks out one chip, and grows it back the moment two chips would read
// the same. So the common case stays short and the ambiguous case stops lying.
function ifLabel(key,keys){
  const cut=key.lastIndexOf("/");
  if(cut<0)return key;
  const bare=key.slice(cut+1);
  let n=0;
  for(const k of keys)if(k===bare||k.endsWith("/"+bare))n++;
  return n>1?key:bare;
}

function vipIface(owner,v){
  if(!owner)return "";
  const ifs=owner.ifaces||[];
  if(v.owner){
    const hit=ifs.find(i=>i.pub===v.owner);
    if(hit)return hit.name;
  }
  if(v.iface&&ifs.some(i=>i.name===v.iface))return v.iface;
  return "";
}

// ---------- geometry: the layout grid, measured once ----------
// Every column x, the hub's height, and each zone's box are derived from content
// (longest label, peer counts, VIP stacks) rather than fixed, so this computes
// them up front and hands the drawing phases one immutable record. rowH/clH ride
// along because the zone drawing has to measure rows the same way this did.
function wiringGeometry(topo,N,hub,{meshIf,mesh,hops,topSpokes,farSpokes},zmap,vipsBy){
  const HUBX=310, HUBW=Math.max(170,hub.label.length*7.2+26), NATX=HUBX+HUBW+130;
  const epNodes=farSpokes.map(s=>N.get(s.oid)||{});
  const epNeed=Math.max(0,...epNodes.map(n=>String(n.label||"").length*7+kindLabel(n.kind).length*5.2+48));
  const EPW=Math.min(340,Math.max(220,epNeed));
  const hasExt=[...N.values()].some(n=>n.kind==="external");
  const EPX=NATX+50, LANE0=EPX+EPW+34, BANDX=LANE0+150, BANDW=400;
  const EXTX=BANDX+BANDW+28, ZONE_R=EXTX+(hasExt?196:-4)+(hasExt?16:0);
  const hubIfaces=(hub.ifaces||[]).map(i=>i.name).sort(ifCmp);
  const remoteIf=hubIfaces.filter(i=>!meshIf.has(i));
  const hubH=Math.max(110,46+remoteIf.length*38);
  const HUBY=170;
  const ROWH=64,HOSTPAD=34;

  const vipExtra=oid=>{const vs=vipsBy.get(oid);return vs?28+vs.length*17:0;};
  const zones=[...zmap.entries()].sort((a,b)=>b[1].length-a[1].length);
  // cluster same-parent endpoints so one physical host box holds all its VMs
  const clusterize=list=>{
    list.sort((a,b)=>ifCmp(a.iface||"~",b.iface||"~")||String(a.oid).localeCompare(b.oid));
    const out=[],by=new Map();
    for(const s of list){
      const pid=(N.get(s.oid)||{}).parent||null;
      if(pid&&by.has(pid)){by.get(pid).items.push(s);continue;}
      const cl={parent:pid?N.get(pid):null,items:[s]};
      out.push(cl); if(pid)by.set(pid,cl);
    }
    return out;
  };
  const rowH=s=>ROWH-10+vipExtra(s.oid);
  const clH=cl=>(cl.parent?HOSTPAD-6:0)+cl.items.reduce((a,s)=>a+rowH(s)+10,0);
  let zy=topSpokes.length?180:130; const zoneGeo=[];
  for(const [zk,list] of zones){
    const clusters=clusterize(list);
    let rows=0,bandRefs=0;const cs=new Set();
    for(const cl of clusters){rows+=clH(cl)+14;
      for(const s of cl.items)if(s.e)cidrs(s.e.allowed).forEach(c=>{cs.add(c);bandRefs++;});}
    const bandH=[...cs].length?([...cs].length*56+bandRefs*6):0;
    const h=52+Math.max(rows,bandH);
    zoneGeo.push({zk,clusters,y:zy,h}); zy+=h+26;
  }
  const meshHeights=[...meshIf].map(ifc=>48+mesh.filter(s=>s.iface===ifc).length*20+44+180);
  const leftH=HUBY+hubH+84+meshHeights.reduce((a,b)=>a+b,0)+hops.length*180+160;
  const H=Math.max(zy+40,leftH,720), W=ZONE_R+20;
  const drawW=Math.min(W,1560);
  return {HUBX,HUBW,NATX,EPW,EPX,LANE0,BANDX,BANDW,EXTX,ZONE_R,
    remoteIf,hubH,HUBY,ROWH,HOSTPAD,zoneGeo,H,W,drawW,rowH,clH};
}

// Column headings, the hub-zone box, and the NAT divider — the quiet backdrop
// that makes the wiring scannable before anyone traces a coloured route.
function drawChrome({gz},{ZONE_R,HUBX,NATX,EPX,BANDX,H},hub){
  mk("line",{x1:40,y1:64,x2:ZONE_R,y2:64,class:"lanerule"},gz);
  mk("text",{x:64,y:52,class:"lanehead"},gz).textContent="LOCAL FABRIC";
  mk("text",{x:HUBX,y:52,class:"lanehead"},gz).textContent="WIREGUARD HUB";
  mk("text",{x:NATX,y:52,class:"lanehead","text-anchor":"middle"},gz).textContent="EDGE / NAT";
  mk("text",{x:EPX,y:52,class:"lanehead"},gz).textContent="REMOTE ENDPOINTS";
  mk("text",{x:BANDX,y:52,class:"lanehead"},gz).textContent="ROUTED NETWORKS";
  // Exactly two zone labels: the hub zone here, the far zones with their rows.
  mk("rect",{x:40,y:90,width:NATX-90,height:H-140,rx:12,class:"zone"},gz);
  mk("text",{x:56,y:114,class:"zlab"},gz).textContent=zoneKey(hub.dc);
  mk("line",{x1:NATX,y1:100,x2:NATX,y2:H-60,class:"nat"},gz);
  mk("text",{x:NATX,y:90,class:"natlab","text-anchor":"middle"},gz).textContent="NAT / WAN";
}

// The hub site's own networks: inventory /24s as bands on a grey bus into the
// hub, plus the reverse-reach overlay. That overlay deliberately traces the same
// path as the grey bus — it is route state on that wire, not second cabling.
function drawLocalFabric({gg,gn,gd,gt,grp},{HUBX,HUBY},topo,N,hub,spokes){
  const aggm=new Map();
  for(const a of (topo.aggs||[]))if(zoneKey(a.dc)===zoneKey(hub.dc)){
    const c=aggm.get(a.cidr)||{cidr:a.cidr,count:0};c.count+=a.count;aggm.set(a.cidr,c);}
  let ly=150; const localBand=new Map();
  const laggs=[...aggm.values()].sort((a,b)=>b.count-a.count).slice(0,6);
  for(const a of laggs){
    const gb=grp(gn,null,{eids:[]});
    gb.dataset.cidr=a.cidr;
    const r=mk("rect",{x:64,y:ly,width:180,height:42,rx:8,class:"nbox band k-net"},gb);
    mk("text",{x:78,y:ly+18,class:"btit"},gb).textContent=a.cidr;
    mk("text",{x:78,y:ly+32,class:"bsub"},gb).textContent=`inventory ×${a.count}`;
    hot(r,()=>[a.cidr,`hub-site local range · ${a.count} hosts`]);
    mk("path",{d:`M244,${ly+21} H272`,class:"grey"},gg);
    mk("circle",{cx:244,cy:ly+21,r:3,class:"jdot"},gd);
    localBand.set(a.cidr,{x:244,y:ly+21,ref:0,group:gb,eids:new Set()});
    ly+=54;
  }
  if(laggs.length){
    mk("path",{d:`M272,171 V${ly-33}`,class:"grey"},gg);
    mk("path",{d:`M272,${HUBY+40} H${HUBX}`,class:"grey"},gg);
    mk("circle",{cx:HUBX,cy:HUBY+40,r:3,class:"jdot"},gd);
  }
  for(const s of spokes)for(const b of (s.back||[]))for(const c of cidrs(b.allowed)){
    const lb=localBand.get(c); if(!lb)continue;
    const col=ifColor(s.iface);
    const g2=grp(gt,s.iface,{eids:[s.e.id,b.id]}), g2d=grp(gd,s.iface,{eids:[s.e.id,b.id]});
    lb.eids.add(s.e.id);lb.eids.add(b.id);lb.group.dataset.eids=JSON.stringify([...lb.eids]);
    const d=`M${HUBX},${HUBY+40} H272 V${lb.y} H244`;
    const pth=mk("path",{d,class:"reach",stroke:col},g2);
    pth.dataset.overlay="local-bus";pth.dataset.cidr=c;
    mk("circle",{cx:244,cy:lb.y,r:4,fill:col,class:"sdot"},g2d);
    hot(pth,()=>[`${s.iface} → ${c}`,`reverse reachability — AllowedIPs on ${(N.get(s.oid)||{}).label||""} · click to focus`]);
    clickFocus(pth,s.iface);
  }
}

// The hub box and one listen port per remote interface. Returns where each port
// sits so the tunnel phases can start their elbows exactly on it. The box is
// marked keep so a focus never dims the thing everything else hangs off.
function drawHub({gn,gd,grp},{HUBX,HUBW,HUBY,hubH,remoteIf},hub){
  const ghub=mk("g",{},gn); ghub.dataset.keep="1";
  nodeCard(ghub,{x:HUBX,y:HUBY,w:HUBW,h:hubH,node:hub,sub:hub.ip||"",cls:"hub"});
  const hubPort=new Map();
  remoteIf.forEach((ifc,i)=>{
    const y=HUBY+56+i*38, col=ifColor(ifc), port=(hub.ifaces||[]).find(x=>x.name===ifc);
    const g2=grp(gd,ifc,{hubif:ifc});
    const d=mk("circle",{cx:HUBX+HUBW,cy:y,r:5.5,fill:col,class:"pdot hot"},g2);
    hot(d,()=>[`${ifc} :${port?port.port:"?"}`,"hub listen port · click to focus"]); clickFocus(d,ifc);
    const t=mk("text",{x:HUBX+HUBW-10,y:y+3.5,class:"plab","text-anchor":"end"},g2);
    t.textContent=ifc; t.setAttribute("fill",col);
    hubPort.set(ifc,{x:HUBX+HUBW,y});
  });
  return hubPort;
}

// Mesh interfaces collapse into one stacked box each: a /32 fan-out is a count,
// not N separate boxes. Returns each stack's right-edge anchor (a DNAT VIP wire
// lands there) and endY, the vertical cursor the hop chips continue from — the
// left column is one running flow, so that hand-off has to be explicit.
function drawMeshStacks({gn,gd,gt,grp},{HUBX,HUBY,hubH},N,hub,{meshIf,mesh}){
  let my=HUBY+hubH+84; let meshIdx=0; const meshGeo=new Map();
  for(const ifc of meshIf){
    const list=mesh.filter(s=>s.iface===ifc);
    const labels=list.map(s=>((N.get(s.oid)||{}).label||s.oid)+"");
    const mw=Math.min(280,Math.max(200,Math.max(0,...labels.map(l=>l.length))*6.6+52));
    const col=ifColor(ifc), bh=48+list.length*20;
    const meshEids=list.map(s=>s.e.id),meshNodes=list.map(s=>s.oid);
    const g2=grp(gn,ifc,{nodes:meshNodes,eids:meshEids}), g2d=grp(gd,ifc,{nodes:meshNodes,eids:meshEids}),
      g2t=grp(gt,ifc,{eids:meshEids});
    const rset=[...new Set(list.flatMap(x=>(x.back||[]).flatMap(b=>cidrs(b.allowed))))];
    const box=mk("rect",{x:64,y:my,width:mw,height:bh,rx:9,class:"nbox"},g2);
    mk("text",{x:76,y:my+13,class:"nkind"},g2).textContent="LOCAL MESH";
    mk("text",{x:76,y:my+28,class:"ntit"},g2).textContent=`${ifc} mesh ×${list.length}`;
    const port=(hub.ifaces||[]).find(x=>x.name===ifc);
    mk("text",{x:76,y:my+42,class:"nsub"},g2).textContent=":"+(port?port.port:"?");
    hot(box,()=>[`${ifc} mesh`,`hub ↔ local peers, ${list.length} × /32 fan-out`+
      (rset.length?` · peer-side AllowedIPs: ${rset.join(", ")}`:"")+" · click to focus"]); clickFocus(box,ifc);
    const pdx=HUBX+28+meshIdx*22, pdy=HUBY+hubH; meshIdx++;
    const pd=mk("circle",{cx:pdx,cy:pdy,r:5.5,fill:col,class:"pdot hot"},g2d);
    hot(pd,()=>[`${ifc} :${port?port.port:"?"}`,"hub mesh port"]); clickFocus(pd,ifc);
    const pl=mk("text",{x:pdx+10,y:pdy-8,class:"plab"},g2d); pl.textContent=ifc; pl.setAttribute("fill",col);
    list.sort((a,b)=>slash32(a.e.allowed).localeCompare(slash32(b.e.allowed),undefined,{numeric:true}));
    const dotX=64+mw-14, lane=64+mw+14;
    list.forEach((s,i)=>{
      const n=N.get(s.oid), y=my+48+i*20;
      const lbl=mk("text",{x:dotX-12,y:y+3,class:"bsub","text-anchor":"end"},g2d);
      lbl.textContent=(n?n.label:s.oid)||"";
      statusDot(g2d,{cx:dotX,cy:y,r:4.5,cls:"sdot",eid:s.e.id,col,
        title:(n?n.label:s.oid),prefix:slash32(s.e.allowed)+" · "});
      mk("path",{d:`M${dotX+5},${y} H${lane}`,class:"tun",stroke:col,"stroke-width":1.6},g2t);
    });
    const trunk=`M${lane},${my+48+(list.length-1)*20} V${my+20} H${pdx} V${pdy+6}`;
    const p=mk("path",{d:trunk,class:"tun",stroke:col,"stroke-width":2},g2t);
    hot(p,()=>[`${ifc} · mesh ×${list.length}`,"hub ↔ local peer /32 fan-out · click to focus"]); clickFocus(p,ifc);
    meshGeo.set(ifc,{x:64+mw,y:my+bh/2});
    my+=bh+44;
  }
  return {meshGeo,endY:my};
}

// Spokes that live in the hub's own zone sit as a row of chips above the far
// zones — a roaming admin client dialling into its own site, not a remote sub-
// network. Returns their anchors so a chip-to-chip hop leg can find them.
function drawTopChips({gn,gd,gt,gf,grp},{EPX,HUBX,HUBW,remoteIf},N,hub,topSpokes,hubPort){
  const topPos=new Map();
  topSpokes.forEach((s,i)=>{
    const n=N.get(s.oid); if(!n)return;
    const col=ifColor(s.iface), cw=Math.max(200,n.label.length*7+26);
    const cx0=EPX+i*(cw+24), cy=96;
    const g2=grp(gn,s.iface,{nodes:s.oid}), g2d=grp(gd,s.iface,{nodes:s.oid,eids:s.e.id}),
      g2t=grp(gt,s.iface,{eids:s.e.id}), g2f=grp(gf,s.iface,{eids:s.e.id});
    const box=nodeCard(g2,{x:cx0,y:cy,w:cw,h:50,node:n});
    hot(box,()=>[n.label,`${n.kind} · ${hub.dc?zoneKey(hub.dc):""} (dials in to the hub site)`]); clickFocus(box,s.iface);
    topPos.set(s.oid,{x:cx0,y:cy,k:1});
    statusDot(g2d,{cx:cx0,cy:cy+25,eid:s.e.id,col,title:`${s.iface} · ${n.label}`});
    const port=hubPort.get(s.iface);
    if(port){
      const lane=HUBX+HUBW+26+remoteIf.indexOf(s.iface)*16;
      const d=`M${port.x+6},${port.y} H${lane} V${cy+25} H${cx0-6}`;
      tunnelRun(g2t,g2f,{d,col,edge:s.e,iface:s.iface,title:`${s.iface} → ${n.label}`});
    }
  });
  return topPos;
}

// Each far zone: a box, its endpoint rows (VMs nested in their physical host),
// the DNAT VIP stacks, and the reachable-CIDR bands on the right. Bands get a
// grey underlay bus per endpoint lane with the per-tunnel colour dashed on top,
// so one wire can carry several routes without drawing several wires. Returns
// the endpoint anchors and band positions the hop phase attaches to.
function drawZones({gz,gg,gn,gd,gt,gf,grp},geo,N,{vipsBy,meshGeo,hubPort}){
  const {EPX,EPW,ZONE_R,BANDX,BANDW,LANE0,NATX,HUBX,HUBW,ROWH,HOSTPAD,remoteIf,zoneGeo,rowH,clH}=geo;
  const epPos=new Map(), bandPos=new Map();
  for(const zg of zoneGeo){
    const bands={list:[],by:new Map()};
    mk("rect",{x:EPX-24,y:zg.y,width:ZONE_R-(EPX-24)-16,height:zg.h,rx:12,class:"zone"},gz);
    mk("text",{x:EPX-8,y:zg.y+22,class:"zlab"},gz).textContent=zg.zk;
    mk("text",{x:BANDX,y:zg.y+22,class:"zsub"},gz).textContent="reachable ranges";
    let ry=zg.y+40, epIdx=0;
    for(const cl of zg.clusters){
    const parent=cl.parent;
    if(parent){
      const gp=mk("g",{},gn); gp.dataset.ifs=cl.items.map(x=>x.iface||"").filter(Boolean).join("|");
      gp.dataset.nodes=JSON.stringify(cl.items.map(x=>x.oid));
      mk("rect",{x:EPX-10,y:ry,width:EPW+20,height:clH(cl),rx:10,class:"hbox k-host"},gp);
      mk("text",{x:EPX+2,y:ry+16,class:"htit"},gp).textContent="PHYSICAL HOST · "+parent.label+(parent.ip?" · "+parent.ip:"");
    }
    let inY=parent?ry+HOSTPAD-6:ry;
    for(const s of cl.items){
      const n=N.get(s.oid); if(!n)continue;
      const g2=grp(gn,s.iface||undefined,{nodes:s.oid}),
        g2d=grp(gd,s.iface||undefined,{nodes:s.oid,eids:s.e&&s.e.id});
      let by=inY;
      const vips=vipsBy.get(s.oid)||[], vh=vips.length?28+vips.length*17:0;
      const box=nodeCard(g2,{x:EPX,y:by,w:EPW,h:ROWH-10+vh,node:n,cls:n.kind==="vm"?"vmb":""});
      if(n.warnings&&n.warnings.length)mk("text",{x:EPX+EPW-12,y:by+46,class:"warnb","text-anchor":"end"},g2).textContent="WARNING";
      hot(box,()=>[n.label,`${n.kind}${n.dc?" · "+n.dc:""}${n.observed?" · observed "+n.observed:""}${n.warnings?" · "+n.warnings.join("; "):""}`]);
      if(s.iface)clickFocus(box,s.iface);
      if(vips.length){ // ledger DNAT VIPs stacked vertically, beads on a wire
        const vifc=vips[0].iface||s.iface, vcol=ifColor(vifc);
        const gv=grp(gd,vifc), gvt=grp(gt,vifc);
        const t=mk("text",{x:EPX+12,y:by+54,class:"bsub"},gv);
        t.textContent=`DNAT VIP ×${vips.length}${vifc?" · "+vifc:""}`; t.setAttribute("fill",vcol);
        vips.forEach((v,i)=>{
          const vy=by+68+i*17;
          // A guessed owner is drawn hollow. The attachment is an inference from
          // label text, and a filled bead would present it as recorded fact.
          const dd=mk("circle",{cx:EPX+20,cy:vy,r:4.5,
            fill:v.guessed?"none":vcol,stroke:vcol,"stroke-width":v.guessed?1.6:0,
            class:"sdot hot"},gv);
          hot(dd,()=>[v.ip,`${v.label}${v.note?" · "+v.note:""} (IPAM ledger)`+
            (v.guessed?" · owner GUESSED from label text — set ip_allocations.owner_public_key":" · owner recorded")]);
          clickFocus(dd,vifc);
          mk("text",{x:EPX+32,y:vy+3,class:"bsub"},gv).textContent=v.ip+(v.guessed?" ?":"");
        });
        const wire=mk("path",{d:`M${EPX+20},${by+68+(vips.length-1)*17} V${by+58}`,class:"tun",stroke:vcol,"stroke-width":1.6},gvt);
        hot(wire,()=>[`DNAT VIP ×${vips.length}`,"recorded in the IPAM ledger (ip_allocations) — outside WG collection · click to focus"]);
        clickFocus(wire,vifc);
        const mg=meshGeo.get(vifc);
        if(mg){ // DNAT destination = that iface's mesh; the parent tunnel carries it
          const d2=`M${EPX-6},${by+62} H${NATX-44} V${mg.y} H${mg.x+6}`;
          const lp=mk("path",{d:d2,class:"reach",stroke:vcol},gvt);
          hot(lp,()=>[`DNAT → ${vifc} mesh`,"carried by the parent tunnel to the hub, then fanned out over the mesh (individual mappings live in sre-lb iptables)"]);
          clickFocus(lp,vifc);
          mk("circle",{cx:EPX-6,cy:by+62,r:4,fill:vcol,class:"sdot"},gv);
        }
      }
      const cy=by+(ROWH-10)/2;
      epPos.set(s.oid,{inX:EPX,outX:EPX+EPW,rowY:cy});
      if(s.iface&&s.e){
        const col=ifColor(s.iface), port=hubPort.get(s.iface);
        const din=statusDot(g2d,{cx:EPX,cy,eid:s.e.id,col,title:`${s.iface} · ${n.label}`,
          detail:s.back.length?" · reverse "+cidrs(s.back[0].allowed).join(","):""});
        clickFocus(din,s.iface);
        if(port){
          const g2t=grp(gt,s.iface,{eids:s.e.id}), g2f=grp(gf,s.iface,{eids:s.e.id});
          const lane=HUBX+HUBW+26+remoteIf.indexOf(s.iface)*16;
          const d=`M${port.x+6},${port.y} H${lane} V${cy} H${EPX-6}`;
          tunnelRun(g2t,g2f,{d,col,edge:s.e,iface:s.iface,title:`${s.iface} → ${n.label}`});
        }
        const cs=cidrs(s.e.allowed);
        if(cs.length){
          mk("circle",{cx:EPX+EPW,cy:cy,r:5.5,fill:col,class:"pdot"},g2d);
          for(const c of cs){
            let b=bands.by.get(c);
            if(!b){b={cidr:c,refs:[]};bands.by.set(c,b);bands.list.push(b);}
            b.refs.push({iface:s.iface,eid:s.e.id,fromX:EPX+EPW,fromY:cy,lane:LANE0+epIdx*16});
          }
        }
        epIdx++;
      }
      inY+=rowH(s)+10;
    }
    ry+=clH(cl)+14;
    }
    // bands: grey underlay bus per endpoint + dashed per-tunnel colour into each dot
    let byy=zg.y+40;
    for(const b of bands.list){
      const hgt=Math.max(44,20+b.refs.length*17);
      const gb=mk("g",{},gn); gb.dataset.ifs=b.refs.map(r=>r.iface).join("|");
      gb.dataset.eids=JSON.stringify(b.refs.map(r=>r.eid));
      gb.dataset.cidr=b.cidr;
      const r=mk("rect",{x:BANDX,y:byy,width:BANDW,height:hgt,rx:8,class:"nbox band k-net"},gb);
      mk("text",{x:BANDX+14,y:byy+20,class:"btit"},gb).textContent=b.cidr;
      hot(r,()=>[b.cidr,"reachable via: "+b.refs.map(x=>x.iface).join(", ")]);
      if(!bandPos.has(b.cidr))bandPos.set(b.cidr,[]);
      bandPos.get(b.cidr).push({
        y:byy,n:b.refs.length,zoneY:zg.y,zoneH:zg.h,group:gb,
        eids:new Set(b.refs.map(r=>r.eid))
      });
      b.refs.forEach((rf,i)=>{
        const dy=byy+15+i*17, col=ifColor(rf.iface);
        const g2=grp(gt,rf.iface,{eids:rf.eid}), g2d=grp(gd,rf.iface,{eids:rf.eid});
        mk("circle",{cx:BANDX-12,cy:dy,r:5,fill:col,class:"pdot hot"},g2d);
        // grey bus (underlay, one solid line per endpoint lane)
        mk("path",{d:`M${rf.fromX+6},${rf.fromY} H${rf.lane} V${dy} H${BANDX-18}`,class:"grey"},gg);
        // per-tunnel dashed colour on top
        const p=mk("path",{d:`M${rf.fromX+6},${rf.fromY} H${rf.lane} V${dy} H${BANDX-18}`,class:"reach",stroke:col},g2);
        hot(p,()=>{const st=stats[rf.eid]||{};return[`${rf.iface} → ${b.cidr}`,
          `${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)} · click to focus`]});
        clickFocus(p,rf.iface);
      });
      byy+=hgt+12;
    }
  }

  return {epPos,bandPos};
}

// Edges that never touch the hub. Grouped per far node because a pair can be
// collected from both sides, then drawn as chips continuing down the left column
// from where the mesh stacks ended. A hop's reach CIDR lands on the matching zone
// band when one was drawn, otherwise it gets its own chip underneath. The last
// pass handles legs whose both ends are chips (a personal VM to a roaming client).
function drawHops({gn,gd,gt,gf,grp},geo,N,hub,{hops,startY,epPos,bandPos,topPos}){
  const {EPX,NATX,BANDX,EXTX,LANE0,zoneGeo}=geo;
  let hy=startY+8;
  const hopBy=new Map(), extHops=[], rest=[], leftPos=new Map();
  for(const e of hops){
    const sp=epPos.get(e.source)||epPos.get(e.target);
    const other=epPos.get(e.source)?e.target:e.source;
    const tn=N.get(other);
    if(!sp||!tn){rest.push(e);continue;}
    if(tn.kind==="external"){extHops.push({e,sp,tn});continue;}
    if(zoneKey(tn.dc)!==zoneKey(hub.dc))continue;
    if(!hopBy.has(other))hopBy.set(other,{tn,sp,edges:[]});
    hopBy.get(other).edges.push(e);
  }
  let extIdx=0;
  for(const {e,sp,tn} of extHops){
    const col=ifColor(e.iface), fk=hopKey(e,hub);
    const g2=grp(gn,fk,{nodes:tn.id,eids:e.id}), g2t=grp(gt,fk,{eids:e.id});
    const zg=zoneGeo.find(z=>sp.rowY>=z.y&&sp.rowY<=z.y+z.h)||zoneGeo[0];
    const cy=zg.y+52+extIdx*44; extIdx++;
    const r=mk("rect",{x:EXTX,y:cy-15,width:188,height:32,rx:8,class:"nbox ext"},g2);
    mk("text",{x:EXTX+10,y:cy-1,class:"bsub"},g2).textContent=tn.label.slice(0,26);
    mk("text",{x:EXTX,y:zg.y+22,class:"zsub"},g2).textContent=extIdx===1?"external / unknown":"";
    hot(r,()=>[tn.label,`external endpoint (observed during collection) · allowed ${e.allowed}`]);
    mk("circle",{cx:EXTX,cy:cy,r:4.5,fill:col,class:"sdot"},g2);
    const base=mk("path",{d:`M${sp.outX+6},${sp.rowY} H${LANE0+126} V${cy} H${EXTX-6}`,class:"tun dash",stroke:col,"stroke-width":1.7},g2t);
    hot(base,()=>{const st=stats[e.id]||{};return[`${e.iface} → ${tn.label}`,
      `allowed ${e.allowed} · ${hsLabel(st.hs)} · undocumented terminus · click to focus`]});
    clickFocus(base,fk);
  }
  for(const [oid,{tn,sp,edges}] of hopBy){
    const bw2=Math.max(200,tn.label.length*7+26);
    const g2=mk("g",{},gn); g2.dataset.ifs=edges.map(e=>hopKey(e,hub)).join("|");
    g2.dataset.nodes=JSON.stringify([oid]);g2.dataset.eids=JSON.stringify(edges.map(e=>e.id));
    const bx2=nodeCard(g2,{x:64,y:hy,w:bw2,h:52,node:tn,cls:tn.kind==="vm"?"vmb":""});
    hot(bx2,()=>[tn.label,`${tn.kind}${tn.dc?" · "+tn.dc:""}`]);
    leftPos.set(oid,{x:64,y:hy,w:bw2,k:edges.length});
    const chipR=64+bw2;
    let below=0;
    edges.forEach((e,k)=>{
      const col=ifColor(e.iface), hk=hopKey(e,hub), cy2=hy+18+k*16;
      const g2d=grp(gd,hk,{nodes:[oid],eids:e.id}), g2t=grp(gt,hk,{eids:e.id}),
        g2f=grp(gf,hk,{eids:e.id});
      const dd=statusDot(g2d,{cx:chipR,cy:cy2,eid:e.id,col,title:`${e.iface} · ${tn.label}`});
      clickFocus(dd,hk);
      mk("circle",{cx:sp.inX,cy:sp.rowY+16+k*12,r:5,fill:col,class:"pdot"},g2d);
      const d=`M${chipR+6},${cy2} H${EPX-38-k*10} V${sp.rowY+16+k*12} H${sp.inX-6}`;
      tunnelRun(g2t,g2f,{d,col,edge:e,iface:hk,title:`${e.iface} ↔ ${tn.label}`});
      // reach: onto an existing zone band when drawn there, else a chip below
      cidrs(e.allowed).forEach(c=>{
        const positions=bandPos.get(c)||[];
        const bp=positions.find(p=>sp.rowY>=p.zoneY&&sp.rowY<=p.zoneY+p.zoneH)||positions[0];
        if(bp){ // e.g. personal → seoul 201/110/130: dot on the seoul band itself
          bp.eids.add(e.id);bp.group.dataset.eids=JSON.stringify([...bp.eids]);
          const dy=bp.y+15+bp.n*17; bp.n++;
          mk("circle",{cx:BANDX-12,cy:dy,r:5,fill:col,class:"pdot"},g2d);
          const rp=mk("path",{d:`M${chipR+6},${hy+40} H${NATX-96-k*8} V${dy} H${BANDX-18}`,class:"reach",stroke:col},g2t);
          hot(rp,()=>[`${e.iface} → ${c}`,`reachable via ${tn.label} (peer-side AllowedIPs) · click to focus`]);
          clickFocus(rp,e.iface);
        }else{
          const byy=hy+64+below*48; below++;
          const rb=mk("rect",{x:94,y:byy,width:bw2-30,height:40,rx:8,class:"nbox band k-net"},g2);
          mk("text",{x:106,y:byy+18,class:"btit"},g2).textContent=c;
          mk("text",{x:106,y:byy+32,class:"bsub"},g2).textContent=`reachable via ${e.iface}`;
          hot(rb,()=>[c,`ranges the ${e.iface} tunnel carries behind ${tn.label}`]);
          mk("path",{d:`M80,${hy+52} V${byy+20} H88`,class:"reach",stroke:col},g2t);
          mk("circle",{cx:94,cy:byy+20,r:4,fill:col,class:"sdot"},g2d);
        }
      });
    });
    hy+=66+below*48;
  }
  // chip-to-chip legs (both ends are chips, e.g. personal VM ↔ roaming client)
  for(const e of rest){
    const a=leftPos.get(e.source)||leftPos.get(e.target);
    const bId=leftPos.get(e.source)?e.target:e.source;
    const b=topPos.get(bId); if(!a||!b)continue;
    const col=ifColor(e.iface);
    const g2d=grp(gd,e.iface,{nodes:[e.source,e.target],eids:e.id}), g2t=grp(gt,e.iface,{eids:e.id}),
      g2f=grp(gf,e.iface,{eids:e.id});
    const ay=a.y+18+a.k*16; a.k++;
    const byy=b.y+25+b.k*12; b.k++;
    statusDot(g2d,{cx:a.x+a.w,cy:ay,eid:e.id,col,
      title:`${e.iface} · ${(N.get(bId)||{}).label||""}`});
    mk("circle",{cx:b.x,cy:byy,r:5,fill:col,class:"pdot"},g2d);
    const d=`M${a.x+a.w+6},${ay} H${b.x-34} V${byy} H${b.x-6}`;
    tunnelRun(g2t,g2f,{d,col,edge:e,iface:e.iface,
      title:`${e.iface} · ${(N.get(e.source)||{}).label||e.source} ↔ ${(N.get(e.target)||{}).label||e.target}`});
  }
}

// ---------- render ----------
function render(topo){
  curTopo=topo; svg.innerHTML=""; tunnels=[]; statusDots=new Map();vipFocusNodes=new Map();
  const {N,E,hub}=prep(topo);
  const gz=mk("g",{},svg),gg=mk("g",{},svg),gt=mk("g",{},svg),gf=mk("g",{},svg),gn=mk("g",{},svg),gd=mk("g",{},svg);
  if(!hub){svg.setAttribute("viewBox","0 0 800 200");svg.setAttribute("width",800);svg.setAttribute("height",200);
    mk("text",{x:40,y:60,class:"ntit"},gn).textContent="no gateways — run `vctl wg sync` first";return;}
  const grp=(parent,ifc,meta={})=>{
    const g=mk("g",{},parent);
    if(ifc)g.dataset.ifc=ifc;
    if(meta.nodes)g.dataset.nodes=JSON.stringify([].concat(meta.nodes).filter(Boolean));
    if(meta.eids)g.dataset.eids=JSON.stringify([].concat(meta.eids).filter(Boolean));
    if(meta.hubif)g.dataset.hubif=meta.hubif;
    return g;
  };
  // Paint targets, in z-order: zone chrome, grey bus, tunnels, flow animation,
  // node boxes, dots. Each drawing phase appends to these, so their creation
  // order here is what fixes what covers what.
  const L={gz,gg,gt,gf,gn,gd,grp};

  // Measure first, then draw. Each phase below returns the anchors the later ones
  // need — hub ports, mesh anchors, endpoint rows, band slots — so the couplings
  // between them are the arguments rather than a shared pool of locals.
  const model=wiringModel(N,E,hub);
  const {spokes,mesh,hops,topSpokes,farSpokes}=model;
  const zmap=zoneBuckets(N,hub,{farSpokes,spokes,mesh,hops});
  const vipsBy=attachVips(topo,N,spokes);
  const geo=wiringGeometry(topo,N,hub,model,zmap,vipsBy);
  const {H,W,drawW}=geo;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  sizeCanvas(drawW,Math.round(drawW*H/W));

  drawChrome(L,geo,hub);
  drawLocalFabric(L,geo,topo,N,hub,spokes);
  const hubPort=drawHub(L,geo,hub);
  const {meshGeo,endY:meshEndY}=drawMeshStacks(L,geo,N,hub,model);
  const topPos=drawTopChips(L,geo,N,hub,topSpokes,hubPort);
  const {epPos,bandPos}=drawZones(L,geo,N,{vipsBy,meshGeo,hubPort});
  drawHops(L,geo,N,hub,{hops,startY:meshEndY,epPos,bandPos,topPos});

  buildLegend(); buildKindKey(); applyStats(); setFocus(focusIf);
  try{const bb=svg.getBBox();const H2=Math.min(H,bb.y+bb.height+30);
    svg.setAttribute("viewBox",`0 0 ${W} ${H2}`);
    sizeCanvas(drawW,Math.round(drawW*H2/W));
    if(drawW>canvas.clientWidth-44)requestAnimationFrame(fitCanvas);}catch(_){}
}

// ---------- tunnel focus: the selected tunnel and nothing else ----------
// Selecting an interface isolates that tunnel: its own edges, the nodes they
// land on, the networks routed over them, and any DNAT VIP the interface owns.
// It deliberately does not follow the branch onward through transit nodes — a
// wg1 selection must not also light up wg9 on the far side of a relay.
function focusClosure(seed){
  const result={ifaces:new Set(seed?[seed]:[]),nodes:new Set(),edges:new Set(),hubIfaces:new Set(),cidrs:new Set()};
  if(!seed||!curTopo)return result;
  const {E,hub}=prep(curTopo);
  if(!hub)return result;
  // A hub iface name such as wg0 can also exist on unrelated remote hosts. Keep
  // only the edges attached to this topology's hub, so the selection stays one
  // tunnel instead of every tunnel that happens to share the name.
  // A seed may be scoped as "host/iface". Interface names are chosen per host, so
  // a bare name cannot address a tunnel between two remote hosts when the hub
  // happens to use the same name: the guard below drops it, and nothing else
  // selects it, leaving the tunnel unreachable by any filter. Two of this
  // fleet's nineteen edges were in that state.
  const slash=seed.lastIndexOf("/");
  const scopeHost=slash>0?seed.slice(0,slash):"";
  const seedIf=scopeHost?seed.slice(slash+1):seed;

  const hubOwns=!scopeHost&&(hub.ifaces||[]).some(i=>i.name===seedIf);
  for(const e of E){
    if(e.iface!==seedIf)continue;
    if(scopeHost&&e.source!==scopeHost&&e.target!==scopeHost)continue;
    if(hubOwns&&e.source!==hub.id&&e.target!==hub.id)continue;
    result.edges.add(e.id);
    result.nodes.add(e.source);result.nodes.add(e.target);
    for(const c of cidrs(e.allowed))result.cidrs.add(c);
    if(e.source===hub.id||e.target===hub.id)result.hubIfaces.add(e.iface);
  }
  // A VIP is labelled with the interface that fronts it, so it belongs to this
  // tunnel's picture even though no edge carries it.
  for(const id of (vipFocusNodes.get(seed)||[]))result.nodes.add(id);
  return result;
}
function setFocus(f){
  focusIf=f;
  const closure=focusClosure(f);
  focusIfaces=closure.ifaces;focusNodes=closure.nodes;focusEdges=closure.edges;focusHubIfaces=closure.hubIfaces;
  focusCIDRs=closure.cidrs;
  for(const el of svg.querySelectorAll("g,path,rect,circle,text,line")){
    if(el.tagName==="g"&&!el.dataset)continue;
    const data=el.dataset||{},own=data.ifc,ifs=data.ifs,keep=data.keep;
    const precise=data.eids!==undefined||data.nodes!==undefined||data.hubif!==undefined||data.cidr!==undefined;
    if(own===undefined&&ifs===undefined&&keep===undefined&&!precise)continue;
    let matched=false;
    // Explicit interface ownership wins over shared node metadata. Otherwise a
    // wg3 glyph on a node also reached by wg0 remains bright during exact wg0
    // focus even though wg3 is not part of the selected route.
    if(own!==undefined)matched=focusIfaces.has(own);
    // A routed-network band is semantic, not owned by the first interface that
    // happened to create it. The same CIDR can later receive wg-seoul/wg1
    // routes, so CIDR focus must beat the band's initial data-ifs value.
    else if(data.cidr!==undefined)matched=focusCIDRs.has(data.cidr);
    else if(ifs!==undefined)matched=ifs.split("|").some(i=>focusIfaces.has(i));
    else{
      if(data.eids!==undefined)matched=matched||JSON.parse(data.eids).some(id=>focusEdges.has(id));
      if(data.nodes!==undefined)matched=matched||JSON.parse(data.nodes).some(id=>focusNodes.has(id));
      if(data.hubif!==undefined)matched=matched||focusHubIfaces.has(data.hubif);
    }
    const onIt=!f||keep!=null||matched;
    el.classList.toggle("dim",!!f&&!onIt);
  }
  document.querySelectorAll("#legend .i[data-if]").forEach(ch=>{
    ch.classList.toggle("on",ch.dataset.if===f);
  });
  const all=document.querySelector("#legend .i[data-all]");
  if(all)all.classList.toggle("on",!f);
  const sel=document.getElementById("selection");
  sel.classList.toggle("on",!!f);
  sel.querySelector("b").textContent=f||"";
}
svg.addEventListener("click",e=>{if(e.target===svg||e.target.classList.contains("zone"))setFocus(null);});

// buildKindKey names the typed colours, and only the ones on screen.
//
// It reads the drawn boxes rather than the topology, for the same reason the
// interface chips do: a kind the layout never draws would be a legend entry
// pointing at nothing.
const KIND_KEY=[["k-gateway","gateway"],["k-host","physical host"],["k-vm","VM"],
  ["k-net","routed network"],["k-external","unresolved endpoint"]];
function buildKindKey(){
  const on=new Set();
  for(const el of svg.querySelectorAll("rect.nbox"))
    for(const c of el.classList)if(c.startsWith("k-"))on.add(c);
  document.getElementById("kind-key").innerHTML=KIND_KEY.filter(([c])=>on.has(c))
    .map(([c,label])=>`<span class="kind ${c}"><i></i>${esc(label)}</span>`).join("");
}

function buildLegend(){
  // Build from the drawn canvas, not from every topology edge. The wiring layout
  // only draws hub-adjacent geometry, so an interface whose tunnels never reach
  // the hub has nothing to highlight — offering it a chip would dim the whole
  // diagram and light nothing. Runs after render(), so the geometry is in place.
  const ifs=new Set();
  for(const el of svg.querySelectorAll("[data-ifc],[data-ifs]")){
    if(el.dataset.ifc)ifs.add(el.dataset.ifc);
    for(const i of (el.dataset.ifs||"").split("|"))if(i)ifs.add(i);
  }
  const el=document.getElementById("legend");
  const keys=[...ifs].sort(ifCmp);
  el.innerHTML=`<button type="button" class="i on" data-all>all</button>`+keys.map(i=>
    `<button type="button" class="i" data-if="${esc(i)}" title="${esc(i)}">` +
    `<span class="dt" style="background:${ifColor(i)}"></span>${esc(ifLabel(i,keys))}</button>`).join("");
  el.querySelector("[data-all]").addEventListener("click",()=>setFocus(null));
  el.querySelectorAll(".i[data-if]").forEach(ch=>ch.addEventListener("click",()=>setFocus(focusIf===ch.dataset.if?null:ch.dataset.if)));
}
// buildStateKey shows the states the fleet is in, with how many tunnels are in
// each. A count beside the word turns the key from a list of words into a
// reading of the fleet, and an absent state is absent rather than zero.
const STATE_WORD={active:"active",idle:"idle",never:"never",stale:"stale",
  unknown:"unobserved",error:"poll error"};
const STATE_KEY_CLS={ok:"up",warn:"idle",crit:"down",muted:"unk"};
function buildStateKey(counts){
  document.getElementById("state-key").innerHTML=TUNNEL_STATES.filter(s=>counts[s]>0)
    .map(s=>`<span class="${STATE_KEY_CLS[STATE_CLS[s]]||"unk"}"><i></i>${esc(STATE_WORD[s])} ${counts[s]}</span>`)
    .join("");
}

function applyStats(){
  for(const t of tunnels){
    const st=stats[t.id];
    if(st&&(st.rx>0||st.tx>0)){
      const r=st.rx+st.tx;
      t.fl.classList.add("on");
      t.fl.style.animationDuration=Math.max(.5,2.6-Math.log10(r+1)*.38)+"s";
      t.base.setAttribute("stroke-width",Math.min(4.6,2+Math.log10(r+1)*.5));
    }else t.fl.classList.remove("on");
  }
  const stateOf=new Map();
  for(const e of ((curTopo&&curTopo.edges)||[]))stateOf.set(e.id,tunnelState(e));
  for(const [eid,dot] of statusDots){
    // Draw every dot, including tunnels nothing reported. Skipping them left the
    // previous frame's colour on screen, so an unobserved tunnel kept whatever
    // it last looked like — which is the opposite of saying "we do not know".
    const c=cssv("--"+(STATE_CLS[stateOf.get(eid)||"unknown"]||"muted"));
    dot.setAttribute("stroke",c);
    dot.style.filter=`drop-shadow(0 0 3px ${c})`;
  }
  // Count over every tunnel in the topology, not over the samples that arrived.
  //
  // This used to read Object.values(stats), which holds only tunnels a poll has
  // reached. A fleet where 12 of 30 tunnels were observed and all 12 looked fine
  // rendered as "12 active" — the other 18 were missing from the numerator and
  // from the denominator, so the screen was silent about them. Absence was the
  // one thing it could not say.
  const edges=(curTopo&&curTopo.edges)||[];
  const n={}; for(const s of TUNNEL_STATES)n[s]=0;
  for(const e of edges)n[tunnelState(e)]++;
  buildStateKey(n);

  const live=document.getElementById("live-summary");
  const observed=n.active+n.idle+n.never;
  // Order the parts by what a reader needs first: what is wrong, then what is
  // unknown, then what is fine.
  const parts=[];
  if(n.error)parts.push(`${n.error} poll error`);
  if(n.stale)parts.push(`${n.stale} stale`);
  if(n.unknown)parts.push(`${n.unknown} unobserved`);
  if(n.never)parts.push(`${n.never} never`);
  if(n.idle)parts.push(`${n.idle} idle`);
  if(n.active)parts.push(`${n.active} active`);
  live.className="live-summary "+(n.error?"warn":(n.stale||n.unknown)?"warn":n.active?"ok":"");
  live.querySelector("span").textContent=edges.length
    // The coverage fraction is the honest headline: how much of the graph this
    // reading actually covers.
    ? `observed ${observed}/${edges.length} · ${parts.join(" · ")}`
    : "waiting for tunnel state";
  live.title=TUNNEL_STATES.map(s=>`${s}: ${n[s]}`).join("\n");
}
// renderDrift lists peers the pollers see that the drawn snapshot does not have.
//
// They are not added to the graph: the layout comes from the snapshot, and
// re-deriving it every two seconds would shift the diagram under the reader's
// cursor for what is really a prompt to re-sync. Naming them, and saying what to
// run, is the part that was missing — until now they were dropped in silence.
function renderDrift(list){
  const el=document.getElementById("drift");
  if(!list.length){el.textContent="";return;}
  const lines=list.slice(0,8).map(p=>{
    const where=`${p.host}/${p.iface}`;
    const via=p.endpoint?` via ${p.endpoint}`:"";
    const routes=(p.allowed||[]).length?` allowed ${p.allowed.join(", ")}`:"";
    return `  + ${where} ${String(p.pub||"").slice(0,12)}…${via}${routes}`;
  });
  if(list.length>8)lines.push(`  … and ${list.length-8} more`);
  el.textContent=[`${list.length} peer(s) on the wire are not in this snapshot`,
    ...lines, "run `vctl wg sync` to draw them"].join("\n");
}

// TOPOLOGY_STALE_SECONDS is when a snapshot stops describing the network well
// enough to trust. `vctl wg sync` runs on no timer, so this is not a missed
// schedule — it is the point past which peers may have come or gone without the
// graph knowing.
const TOPOLOGY_STALE_SECONDS=24*3600;

// ago renders a coarse age. Precision is not the point: the reader needs to know
// whether this is minutes or days, and a seconds-accurate "6d 3h 12m" invites
// them to read a snapshot as a live figure.
function ago(sec){
  if(sec<90)return"just now";
  if(sec<5400)return`${Math.round(sec/60)}m ago`;
  if(sec<172800)return`${Math.round(sec/3600)}h ago`;
  return`${Math.round(sec/86400)}d ago`;
}
function updateMeta(topo,at){
  const zones=new Set(topo.nodes.filter(n=>n.dc).map(n=>zoneKey(n.dc)));
  document.getElementById("site-count").textContent=zones.size;
  document.getElementById("gateway-count").textContent=topo.nodes.filter(n=>n.kind==="gateway").length;
  document.getElementById("tunnel-count").textContent=topo.edges.length;
  document.getElementById("updated-at").textContent=new Date(at*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});

  // The structural clock. Everything drawn here — nodes, tunnels, AllowedIPs,
  // endpoints — is as old as this, however fast the traffic animates.
  const el=document.getElementById("topology-at");
  const t=topo.collectedAt?Date.parse(topo.collectedAt):NaN;
  if(!t||isNaN(t)){
    el.textContent="never";
    el.title="no WireGuard rows in the database — run `vctl wg sync`";
    el.className="stale";
    return;
  }
  const age=(Date.now()-t)/1000;
  el.textContent=ago(age);
  el.title=new Date(t).toLocaleString()+" — last `vctl wg sync`";
  el.className=age>TOPOLOGY_STALE_SECONDS?"stale":"";
}

// ---------- theme ----------
// The palette is resolved from CSS variables and then written onto SVG
// attributes, so a theme switch is not a repaint — the interface colours are
// already baked into the drawn elements. The cache is dropped and the diagram
// redrawn from the topology that is already in hand, which is also why the
// current focus and zoom are restored around it: a reader who switched themes
// asked about the light, not about which interface they had selected.
let lastTopo=null;
function applyTheme(name){
  document.documentElement.setAttribute("data-theme",name);
  document.getElementById("theme-toggle").textContent=name.toUpperCase();
  try{localStorage.setItem("vctl-wg-theme",name);}catch(e){}
  if(!lastTopo)return;
  const keepFocus=focusIf,keepZoom=zoom;
  ifColMap.clear();
  render(lastTopo);
  setZoom(keepZoom);
  if(keepFocus)setFocus(keepFocus);
  applyStats();
}
(function initTheme(){
  let saved=null;
  try{saved=localStorage.getItem("vctl-wg-theme");}catch(e){}
  // No stored answer means follow the desktop, the way the rest of the tooling
  // does. An explicit choice outranks it and survives a reload.
  const want=saved||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",want);
  document.getElementById("theme-toggle").textContent=want.toUpperCase();
})();
document.getElementById("theme-toggle").addEventListener("click",()=>
  applyTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light"));

document.getElementById("zoom-in").addEventListener("click",()=>setZoom(zoom+.15));
document.getElementById("zoom-out").addEventListener("click",()=>setZoom(zoom-.15));
document.getElementById("zoom-fit").addEventListener("click",fitCanvas);
document.querySelector("#selection button").addEventListener("click",()=>setFocus(null));
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape")setFocus(null);
  if((ev.ctrlKey||ev.metaKey)&&ev.key==="="){ev.preventDefault();setZoom(zoom+.15);}
  if((ev.ctrlKey||ev.metaKey)&&ev.key==="-"){ev.preventDefault();setZoom(zoom-.15);}
  if((ev.ctrlKey||ev.metaKey)&&ev.key==="0"){ev.preventDefault();fitCanvas();}
});

// ---------- wiring: injected BOOT replay (demo) or live fetch + SSE ----------
if(BOOT){
  lastTopo=BOOT.topology;
  render(BOOT.topology);
  const frames=BOOT.frames||[]; let fi=0;
  const ap=()=>{stats=frames.length?frames[fi%frames.length]:{};pollErrors={};frameAt=Date.now()/1000;
    updateMeta(BOOT.topology,frameAt);applyStats();fi++;};
  ap(); if(frames.length>1)setInterval(ap,2000);
  document.getElementById("health").textContent="demo replay";
}else{
  fetch("topology").then(r=>r.json()).then(topo=>{
    lastTopo=topo;
    render(topo);
    const es=new EventSource("events");
    es.onmessage=ev=>{
      // Errors and the frame time are inputs to tunnelState, so they have to be
      // in place before applyStats runs — otherwise a failed gateway's tunnels
      // keep rendering their last sample as if it were current.
      const d=JSON.parse(ev.data); stats=d.edges||{};
      pollErrors=d.errors||{}; frameAt=d.at||0;
      updateMeta(topo,d.at); applyStats();
      const errN=Object.keys(d.errors||{}).length, h=document.getElementById("health");
      h.className="health "+(errN?"fail":"ok");
      h.textContent=errN?`${errN} poll failures`:"live polling ok";
      document.getElementById("errs").textContent=Object.entries(d.errors||{}).map(([k,v])=>`! ${k}: ${v}`).join("\n");
      renderDrift(d.drift||[]);
    };
  }).catch(err=>{
    const h=document.getElementById("health");
    h.className="health fail";h.textContent="topology connection failed";
    document.getElementById("errs").textContent=`! topology: ${err.message}`;
  });
}
</script>
