<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>vctl · WireGuard live</title>
<style>
  :root{
    --bg:#1a1a19; --panel:#232322; --line:#3a3a38; --zone:#1f2320;
    --ink:#e8e8e6; --ink2:#a8a8a4; --muted:#6e6e6a;
    --wg0:#3987e5; --wg1:#d95926; --wg2:#199e70; --wg3:#c98500; --wg100:#6e6e6a; --pers:#d55181;
    --ok:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:14px;margin:0;font-weight:600}
  header .sub{color:var(--ink2)}
  .demo{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 6px}
  .layers{display:flex;gap:4px}
  .layers button{font:inherit;font-size:11px;color:var(--ink2);background:#1f1f1e;border:1px solid var(--line);
                 padding:3px 9px;border-radius:5px;cursor:pointer}
  .layers button.on{color:var(--ink);background:#2e2e2c;border-color:#555}
  .legend{display:flex;gap:12px;margin-left:auto;color:var(--ink2);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dotv{width:14px;height:3px;border-radius:2px;display:inline-block}
  .dotv.box{width:11px;height:9px;border-radius:2px}
  .dotv.dash{width:11px;height:9px;border-radius:2px;background:transparent;border:1px dashed var(--muted)}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;min-width:0}
  svg{display:block;width:100%;height:100%}
  aside{width:340px;border-left:1px solid var(--line);background:var(--panel);
        overflow-y:auto;padding:10px 12px}
  aside h2{font-size:12px;color:var(--ink2);margin:6px 0 8px;font-weight:600;
           text-transform:uppercase;letter-spacing:.06em}
  table{width:100%;border-collapse:collapse}
  td,th{padding:3px 4px;text-align:left;font-size:12px;white-space:nowrap}
  th{color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.sel td{background:#2e2e2c}
  .hs-ok{color:var(--ok)} .hs-warn{color:var(--warn)} .hs-crit{color:var(--crit)}
  .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  #tip{position:fixed;pointer-events:none;background:#111;border:1px solid var(--line);
       padding:7px 9px;border-radius:6px;font-size:12px;display:none;z-index:10;max-width:360px}
  #tip .t{color:var(--ink2)}
  .err{color:var(--crit);font-size:12px;margin-top:8px;white-space:pre-wrap}
  /* graph — base (host/network) layer */
  .zone rect{fill:var(--zone);stroke:var(--line);stroke-width:1}
  .zone text{fill:var(--muted);font-size:11px;letter-spacing:.04em}
  .wanlab{fill:var(--muted);font-size:10px;opacity:.35;letter-spacing:.12em}
  .link{stroke:var(--muted);stroke-width:1;fill:none;opacity:.5}
  .node rect{fill:#26303c;stroke:#41546b;stroke-width:1.5}
  .node.external rect{fill:#2c2c2a;stroke:var(--line)}
  .node.agg rect{fill:#242422;stroke:#4a4a47;stroke-width:1;stroke-dasharray:4 3}
  .node .nm{fill:var(--ink);font-size:12px}
  .node .sub2{fill:var(--muted);font-size:9px}
  .node.external .nm{fill:var(--ink2);font-size:11px}
  .node.agg .nm{fill:var(--ink2);font-size:11px}
  .port .plab{font-size:9px}
  /* graph — WireGuard overlay */
  .edge{fill:none;stroke-linecap:round}
  .edge-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
  .iflab{font-size:10px;font-weight:600}
  .iflab.sub{fill:var(--muted);font-size:8.5px;font-weight:400}
  .mode-host .wg-only{display:none}
  @media (prefers-reduced-motion:reduce){ .pkt{display:none} }
</style>
</head>
<body>
<header>
  <h1>WireGuard <span class="sub">live traffic · site zones</span></h1>
  <span class="sub" id="meta">connecting…</span>
  <div class="layers">
    <button id="lb-host">호스트</button>
    <button id="lb-full" class="on">호스트+WireGuard</button>
  </div>
  <div class="legend">
    <span><span class="dotv box"></span>gateway</span>
    <span><span class="dotv dash"></span>hosts /24</span>
    <span class="wg-only"><span class="dotv" style="background:var(--wg0)"></span>wg0</span>
    <span class="wg-only"><span class="dotv" style="background:var(--wg1)"></span>wg1</span>
    <span class="wg-only"><span class="dotv" style="background:var(--wg2)"></span>wg2</span>
    <span class="wg-only"><span class="dotv" style="background:var(--wg3)"></span>wg3</span>
    <span class="wg-only"><span class="dotv" style="background:var(--wg100)"></span>wg100</span>
    <span class="wg-only"><span class="dotv" style="background:var(--pers)"></span>personal</span>
    <span class="wg-only"><span class="dotv" style="background:var(--crit)"></span>stale</span>
  </div>
</header>
<main>
  <div id="stage"><svg id="svg"></svg></div>
  <aside>
    <h2>tunnels</h2>
    <table id="tbl"><thead>
      <tr><th>tunnel</th><th class="num">rx/s</th><th class="num">tx/s</th><th>hs</th></tr>
    </thead><tbody></tbody></table>
    <div class="err" id="errs"></div>
  </aside>
</main>
<div id="tip"></div>
<script>
"use strict";
// Single branch between demo and live page: an injected BOOT (window.WG_BOOT)
// replays a topology + synthetic stat frames; otherwise fetch /topology + SSE.
const BOOT = window.WG_BOOT || null;

const SVGNS="http://www.w3.org/2000/svg";
const el=(n,at,parent)=>{const e=document.createElementNS(SVGNS,n);for(const k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e};
const fmtRate=b=>{if(!b||b<1)return"·";const k=1024;return b>=k*k*k?(b/k/k/k).toFixed(1)+"G/s":b>=k*k?(b/k/k).toFixed(1)+"M/s":b>=k?(b/k).toFixed(1)+"K/s":b.toFixed(0)+"B/s"};
const fmtHS=s=>{if(s==null||s<0)return["no-hs","hs-crit"];if(s<=180)return["up","hs-ok"];const m=Math.round(s/60);return[m<120?"idle "+m+"m":"idle "+Math.round(m/60)+"h","hs-warn"]};

// tunnel identity == line colour (iface -> colour); unknown ifaces fall back to grey.
const IFCOL={wg0:"#3987e5",wg1:"#d95926",wg2:"#199e70",wg3:"#c98500",wg100:"#6e6e6a","wg-personal":"#d55181"};
const ifColor=i=>IFCOL[i]||"#8888884d";
// zone key = dc prefix before the first "-" ("incheon-idc" -> "incheon"); "" -> "other".
const zoneKey=dc=>dc?String(dc).split("-")[0]:"other";

const nodes=new Map(), aggMap=new Map(), edges=new Map();
let stats={}, selected=null, dots=[], hostMode=false, curTopo=null;
const svg=document.getElementById("svg"), tip=document.getElementById("tip");

function kindOf(topo,id){const n=topo.nodes.find(n=>n.id===id);return n?n.kind:"external"}
const NSIZE={gateway:[156,44],agg:[150,38],external:[140,32]};

// where the segment from a box centre toward `to` exits the box edge.
function boundary(n,to){
  const dx=to.x-n.x,dy=to.y-n.y,hw=n.w/2,hh=n.h/2;
  const sx=Math.abs(dx)<1e-6?Infinity:hw/Math.abs(dx);
  const sy=Math.abs(dy)<1e-6?Infinity:hh/Math.abs(dy);
  const s=Math.min(sx,sy);
  return {x:n.x+dx*s,y:n.y+dy*s};
}
// tunnel anchor: gateway ports (WAN-gap edge) when the iface exists, else box edge.
function anchor(n,iface,to){
  if(n.kind==="gateway"&&n.ports&&n.ports[iface])return n.ports[iface];
  return boundary(n,to);
}
function posById(id){return nodes.get(id)||aggMap.get(id)||null}

// ---- layout: gateways + aggregates grouped into per-dc zone boxes side by side;
//              externals hang just outside their gateway's zone box. ----
function layout(topo,W,H){
  const gws=topo.nodes.filter(n=>n.kind==="gateway");
  const aggs=topo.aggs||[];
  const zmap=new Map();
  const add=(k,kind,ref)=>{if(!zmap.has(k))zmap.set(k,{key:k,members:[],hosts:0});const z=zmap.get(k);z.members.push({kind,ref});z.hosts+=kind==="gw"?1:(ref.count||0)};
  gws.forEach(g=>add(zoneKey(g.dc),"gw",g));
  aggs.forEach(a=>add(zoneKey(a.dc),"agg",a));
  const zones=[...zmap.values()].sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0);
  const NZ=Math.max(zones.length,1), M=Math.min(150,W*0.13), bandW=(W-2*M)/NZ;
  const gwZone=new Map();
  zones.forEach((z,zi)=>{
    const cx=M+bandW*(zi+0.5);
    z.cx=cx; z.idx=zi; z.portRight=cx<W/2; z.outerLeft=zi<NZ/2;
    z.x0=cx-bandW*0.32; z.x1=cx+bandW*0.32; z.y0=H*0.11; z.y1=H*0.82;
    const m=z.members.length;
    z.members.forEach((mem,i)=>{
      const o=mem.ref,[w,h]=mem.kind==="gw"?NSIZE.gateway:NSIZE.agg;
      o.x=cx; o.y=H*0.16+(H*0.62)*((i+0.5)/Math.max(m,1)); o.w=w; o.h=h;
      if(mem.kind==="gw"){
        gwZone.set(o.id,z);
        const ifs=o.ifaces||[]; o.ports={}; o.portRight=z.portRight;
        const edgeX=z.portRight?o.x+o.w/2:o.x-o.w/2;
        ifs.forEach((f,k)=>{o.ports[f.name]={x:edgeX,y:o.y-o.h/2+o.h*(k+0.5)/Math.max(ifs.length,1)}});
      }
    });
  });
  // externals -> the zone of the gateway they connect to, stacked in an outer column.
  const perZone=new Map(); zones.forEach(z=>perZone.set(z,[]));
  topo.nodes.filter(n=>n.kind==="external").forEach(n=>{
    const e=topo.edges.find(e=>e.target===n.id||e.source===n.id);
    let gwId=null; if(e)gwId=(kindOf(topo,e.source)==="gateway")?e.source:e.target;
    const z=(gwId&&gwZone.get(gwId))||zones[0];
    const[w,h]=NSIZE.external; n.w=w; n.h=h;
    if(z)perZone.get(z).push(n); else {n.x=W*0.08;n.y=H*0.5;}
  });
  perZone.forEach((list,z)=>{
    const colX=z.outerLeft?Math.max(60,z.x0-bandW*0.16):Math.min(W-60,z.x1+bandW*0.16);
    const m=list.length;
    list.forEach((node,i)=>{node.x=colX;node.y=H*0.13+(H*0.74)*((i+0.5)/Math.max(m,1))});
  });
  topo._zones=zones;
}

function render(topo){
  curTopo=topo;
  const W=svg.clientWidth||1100,H=svg.clientHeight||660;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  nodes.clear(); aggMap.clear(); edges.clear();
  topo.nodes.forEach(n=>nodes.set(n.id,n));
  (topo.aggs||[]).forEach(a=>aggMap.set(a.id,a));
  layout(topo,W,H);
  svg.innerHTML=""; dots=[];
  const gZ=el("g",{},svg), gL=el("g",{},svg), gE=el("g",{},svg), gD=el("g",{class:"wg-only"},svg), gN=el("g",{},svg);

  // zone boxes (label = "<dc> · N hosts")
  (topo._zones||[]).forEach(z=>{
    const g=el("g",{class:"zone"},gZ);
    el("rect",{x:z.x0,y:z.y0,width:z.x1-z.x0,height:z.y1-z.y0,rx:12,ry:12},g);
    el("text",{x:z.x0+12,y:z.y0+18},g).textContent=`${z.key} · ${z.hosts} hosts`;
  });
  // WAN gap label between the first two zones
  if((topo._zones||[]).length>=2){
    const zs=topo._zones,gx=(zs[0].x1+zs[1].x0)/2,gy=H*0.42;
    el("text",{class:"wanlab wg-only",x:gx,y:gy,"text-anchor":"middle",transform:`rotate(-90 ${gx} ${gy})`},gZ)
      .textContent="public internet · NAT / WAN";
  }

  // management links (jump_via), thin muted, under the tunnels
  (topo.links||[]).forEach(lk=>{
    const s=posById(lk.source),t=posById(lk.target); if(!s||!t)return;
    const a=boundary(s,{x:t.x,y:t.y}),b=boundary(t,{x:s.x,y:s.y});
    el("path",{class:"link",d:`M ${a.x} ${a.y} L ${b.x} ${b.y}`},gL);
  });

  // WireGuard tunnels
  topo.edges.forEach(e=>{
    const s=nodes.get(e.source),t=nodes.get(e.target);
    if(!s||!t)return;
    const src=anchor(s,e.iface,{x:t.x,y:t.y}), tgt=anchor(t,e.iface,{x:s.x,y:s.y});
    const mx=(src.x+tgt.x)/2,my=(src.y+tgt.y)/2,dx=tgt.x-src.x,dy=tgt.y-src.y,L=Math.hypot(dx,dy)||1,off=Math.min(28,L*0.12);
    const cxp=mx-dy/L*off,cyp=my+dx/L*off,d=`M ${src.x} ${src.y} Q ${cxp} ${cyp} ${tgt.x} ${tgt.y}`;
    e.color=ifColor(e.iface); e.width=e.iface==="wg2"?2.5:1.6;
    e.path=el("path",{class:"edge wg-only",d,stroke:e.color,"stroke-width":e.width},gE);
    e.hit=el("path",{class:"edge-hit wg-only",d},gE);
    el("text",{class:"iflab wg-only",x:cxp,y:cyp-5,"text-anchor":"middle",fill:e.color},gE).textContent=e.iface;
    if(e.allowed)el("text",{class:"iflab sub wg-only",x:cxp,y:cyp+6,"text-anchor":"middle"},gE).textContent=e.allowed.length>34?e.allowed.slice(0,33)+"…":e.allowed;
    e.len=e.path.getTotalLength();
    const show=(ev)=>{const st=stats[e.id]||{};const[hs]=fmtHS(st.hs);
      tip.innerHTML=`<b style="color:${e.color}">${e.iface}</b> ${s.label} ⇄ ${t.label}`+
        `<br><span style="color:var(--ink2)">rx ${fmtRate(st.rx)}</span> · <span style="color:var(--ink)">tx ${fmtRate(st.tx)}</span> · ${hs}`+
        (e.allowed?`<br><span class="t">${e.allowed}</span>`:"");
      tip.style.display="block";tip.style.left=(ev.clientX+14)+"px";tip.style.top=(ev.clientY+10)+"px";
      selected=e.id;syncTable()};
    e.hit.addEventListener("mousemove",show);
    e.hit.addEventListener("mouseleave",()=>{tip.style.display="none";selected=null;syncTable()});
    edges.set(e.id,e);
  });

  // gateway + aggregate + external boxes
  const drawBox=(o,cls,name,sub)=>{
    const g=el("g",{class:"node "+cls,transform:`translate(${o.x},${o.y})`},gN);
    el("rect",{x:-o.w/2,y:-o.h/2,width:o.w,height:o.h,rx:8,ry:8},g);
    const lab=name.length>22?name.slice(0,21)+"…":name;
    el("text",{class:"nm",y:sub?-2:4,"text-anchor":"middle"},g).textContent=lab;
    if(sub)el("text",{class:"sub2",y:11,"text-anchor":"middle"},g).textContent=sub;
    return g;
  };
  topo.nodes.filter(n=>n.kind==="gateway").forEach(n=>{
    const g=drawBox(n,"gateway",n.label,n.ip||"");
    (n.ifaces||[]).forEach(f=>{const p=n.ports[f.name],c=ifColor(f.name),pg=el("g",{class:"port wg-only"},g);
      el("circle",{cx:p.x-n.x,cy:p.y-n.y,r:3,fill:c},pg);
      const inside=n.portRight?-6:6;
      el("text",{class:"plab",x:p.x-n.x+inside,y:p.y-n.y+3,"text-anchor":n.portRight?"end":"start",fill:c},pg).textContent=f.name;
    });
  });
  (topo.aggs||[]).forEach(a=>drawBox(a,"agg",`${a.cidr} ×${a.count}`,a.dc));
  topo.nodes.filter(n=>n.kind==="external").forEach(n=>{const g=drawBox(n,"external wg-only",n.label,"")});
  svg._gD=gD;
}

// ---- packet-flow animation ----
// dot spawn rate & speed follow log10(rate); direction: tx source→target, rx reverse;
// dot colour == tunnel colour; a stale tunnel turns red-dashed and freezes.
let acc={},last=performance.now();
function step(dt){
  const gD=svg._gD; if(!gD)return;
  if(hostMode){ if(dots.length){dots=[];gD.innerHTML=""} return; }
  edges.forEach(e=>{
    const st=stats[e.id]; if(!st)return;
    const stale=st.hs!=null&&(st.hs<0||st.hs>600);
    e.path.setAttribute("stroke",stale?"#d03b3b":e.color);
    e.path.setAttribute("stroke-dasharray",stale?"6 5":"none");
    if(stale)return;
    [["tx",+1],["rx",-1]].forEach(([k,dir])=>{
      const r=st[k]||0; if(r<1)return;
      const per=Math.min(9,0.6+Math.log10(r+1)), key=e.id+k;
      acc[key]=(acc[key]||0)+per*dt;
      while(acc[key]>=1){acc[key]-=1;dots.push({e,dir,t:dir>0?0:1,sp:0.12+0.05*Math.log10(r+1),k})}
    });
  });
  dots.forEach(d=>d.t+=d.dir*d.sp*dt);
  dots=dots.filter(d=>d.t>=0&&d.t<=1);
  gD.innerHTML="";
  dots.forEach(d=>{const p=d.e.path.getPointAtLength(d.t*d.e.len);
    el("circle",{class:"pkt",cx:p.x,cy:p.y,r:2.6,fill:d.e.color},gD)});
}
(function loop(now){const dt=Math.min(0.1,(now-last)/1000);last=now;step(dt);requestAnimationFrame(loop)})(last);

// ---- side table ----
function syncTable(){
  const tb=document.querySelector("#tbl tbody"); tb.innerHTML="";
  [...edges.values()].sort((a,b)=>{
    const ra=(stats[a.id]?.rx||0)+(stats[a.id]?.tx||0), rb=(stats[b.id]?.rx||0)+(stats[b.id]?.tx||0);
    return rb-ra;
  }).forEach(e=>{
    const st=stats[e.id]||{}, [hs,cls]=fmtHS(st.hs);
    const tr=document.createElement("tr"); if(e.id===selected)tr.className="sel";
    tr.innerHTML=`<td><span class="tdot" style="background:${e.color}"></span>${e.iface} · ${nodes.get(e.target).label.slice(0,16)}</td>`+
      `<td class="num">${fmtRate(st.rx)}</td><td class="num">${fmtRate(st.tx)}</td>`+
      `<td class="${cls}">${hs}</td>`;
    tb.appendChild(tr);
  });
}

function updateMeta(topo,at){
  const gwN=topo.nodes.filter(n=>n.kind==="gateway").length;
  const keys=new Set(topo.nodes.filter(n=>n.kind==="gateway").map(n=>zoneKey(n.dc)));
  (topo.aggs||[]).forEach(a=>keys.add(zoneKey(a.dc)));
  document.getElementById("meta").textContent=
    `${keys.size} sites · ${gwN} gateways · ${(topo.edges||[]).length} tunnels · ${new Date(at*1000).toLocaleTimeString()}`;
}

// ---- layer toggle ----
function setMode(host){
  hostMode=host;
  document.documentElement.classList.toggle("mode-host",host);
  document.getElementById("lb-host").classList.toggle("on",host);
  document.getElementById("lb-full").classList.toggle("on",!host);
}
document.getElementById("lb-host").addEventListener("click",()=>setMode(true));
document.getElementById("lb-full").addEventListener("click",()=>setMode(false));

// ---- wiring: injected BOOT (demo) or live fetch + SSE ----
if(BOOT){
  const topo=BOOT.topology; render(topo);
  const frames=BOOT.frames||[]; let fi=0;
  const apply=()=>{stats=frames.length?frames[fi%frames.length]:{};updateMeta(topo,Date.now()/1000);syncTable();fi++};
  apply(); if(frames.length>1)setInterval(apply,2000);
  window.addEventListener("resize",()=>render(topo));
}else{
  fetch("topology").then(r=>r.json()).then(topo=>{
    render(topo);
    const es=new EventSource("events");
    es.onmessage=ev=>{
      const d=JSON.parse(ev.data); stats=d.edges||{};
      updateMeta(topo,d.at);
      document.getElementById("errs").textContent=
        Object.entries(d.errors||{}).map(([h,e])=>`! ${h}: ${e}`).join("\n");
      syncTable();
    };
    window.addEventListener("resize",()=>render(topo));
  });
}
</script>
</body>
</html>
