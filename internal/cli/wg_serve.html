<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vctl · WireGuard live</title>
<style>
  /* ==========================================================
     THEME VARIABLES — switch by toggling [data-theme] on <html>
     Structured after the Archify token contract: every colour is
     defined once per theme, and nothing below this block names a
     literal colour. A token missing from one theme is the bug this
     shape exists to make obvious.
     ========================================================== */
  :root,[data-theme="dark"]{
    color-scheme:dark;
    --bg:#090d12; --chrome:#0e141b; --panel:#151c24; --panel2:#111820;
    --line:#202a35; --ring:#344252;
    --ink:#e8edf2; --ink2:#a9b5c2; --muted:#718090; --acc:#f0883e;
    --c0:#4c8dff; --c1:#ef6f53; --c2:#35c07d; --c3:#f2c94c; --c4:#cf6fb8; --c5:#8b97a6;
    --c6:#7bc2e8; --c7:#b8a1ff;
    --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
    --shadow:0 18px 50px rgba(0,0,0,.28);
    --grid-line:rgba(113,128,144,.045);
    --glow:rgba(76,141,255,.055);
    /* Opaque colour painted behind translucent node fills so the routes
       drawn underneath are actually hidden rather than showing through. */
    --mask:#0f172a;

    /* Typed component kinds. A node's colour says what kind of thing it
       is, not which drawing function made it — so gateway, host and VM
       stay distinguishable in both themes without a second palette. */
    --acc-wash:rgba(240,136,62,.08); --acc-line:rgba(240,136,62,.42); --acc-line-strong:rgba(240,136,62,.62);
    --ok-wash:rgba(63,185,80,.09); --warn-wash:rgba(227,179,65,.09);
    --chrome-shadow:0 8px 30px rgba(0,0,0,.16); --node-shadow:rgba(0,0,0,.18);
    --canvas-tag-bg:rgba(9,13,18,.86);
    --crit-ink:#ff9b96; --crit-bg:rgba(39,15,17,.96); --crit-line:rgba(248,81,73,.35);
    --warn-ink:#f0d08a; --warn-bg:rgba(39,31,15,.96); --warn-line:rgba(227,179,65,.35);

    --gateway-fill:rgba(120,53,15,.34);   --gateway-stroke:#f0883e;
    --host-fill:rgba(6,78,59,.34);        --host-stroke:#35c07d;
    --vm-fill:rgba(8,51,68,.36);          --vm-stroke:#7bc2e8;
    --external-fill:rgba(30,41,59,.5);    --external-stroke:#8b97a6;
    --netband-fill:rgba(76,29,149,.3);    --netband-stroke:#b8a1ff;
  }
  [data-theme="light"]{
    color-scheme:light;
    --bg:#f6f8fa; --chrome:#ffffff; --panel:#ffffff; --panel2:#f0f3f6;
    --line:#d8dee6; --ring:#b6c0cc;
    --ink:#111820; --ink2:#3d4b5a; --muted:#5f6d7c; --acc:#bd5b16;
    --c0:#1f5fd0; --c1:#c0432b; --c2:#127a48; --c3:#8a6a00; --c4:#94408a; --c5:#5a6675;
    --c6:#1d6f96; --c7:#6544c4;
    --ok:#1a7f37; --warn:#8a6a00; --crit:#c1352b;
    --shadow:0 14px 34px rgba(15,24,32,.1);
    --grid-line:rgba(60,72,86,.05);
    --glow:rgba(31,95,208,.05);
    --mask:#ffffff;

    --acc-wash:rgba(189,91,22,.09); --acc-line:rgba(189,91,22,.4); --acc-line-strong:rgba(189,91,22,.6);
    --ok-wash:rgba(26,127,55,.11); --warn-wash:rgba(138,106,0,.12);
    --chrome-shadow:0 6px 18px rgba(15,24,32,.07); --node-shadow:rgba(15,24,32,.09);
    --canvas-tag-bg:rgba(255,255,255,.86);
    --crit-ink:#8f2018; --crit-bg:rgba(253,236,234,.97); --crit-line:rgba(193,53,43,.35);
    --warn-ink:#6b5200; --warn-bg:rgba(253,247,229,.97); --warn-line:rgba(138,106,0,.35);

    --gateway-fill:rgba(240,136,62,.16);  --gateway-stroke:#bd5b16;
    --host-fill:rgba(53,192,125,.17);     --host-stroke:#127a48;
    --vm-fill:rgba(123,194,232,.2);       --vm-stroke:#1d6f96;
    --external-fill:rgba(148,163,184,.18);--external-stroke:#5a6675;
    --netband-fill:rgba(184,161,255,.2);  --netband-stroke:#6544c4;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    display:flex;flex-direction:column;overflow:hidden}
  header{position:relative;z-index:5;display:flex;align-items:center;gap:24px;min-height:68px;
    padding:10px 18px;background:var(--chrome);border-bottom:1px solid var(--line);
    box-shadow:var(--chrome-shadow,0 8px 30px rgba(0,0,0,.16))}
  .brand{display:flex;align-items:center;gap:11px;min-width:250px}
  .brandmark{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--acc-line);
    background:var(--acc-wash);color:var(--acc);font-size:14px;font-weight:800;letter-spacing:-.08em;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .eyebrow{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  h1{margin:1px 0 0;font-size:15px;line-height:1.2;letter-spacing:-.02em}
  h1 span{color:var(--ink2);font-weight:500}
  #meta{display:flex;align-items:stretch;gap:6px;min-width:0}
  .metric{min-width:74px;padding:5px 10px;border-left:1px solid var(--line)}
  .metric:first-child{border-left:0}
  .metric strong{display:block;color:var(--ink);font-size:13px;line-height:1.15;font-variant-numeric:tabular-nums}
  /* A stale snapshot is not an error — nothing is broken and no alert is due.
     It is a caveat on everything else on screen, so it is coloured like a
     warning rather than a failure, and it stays legible instead of shouting. */
  .metric strong.stale{color:var(--warn)}
  .metric strong.stale::after{content:" ▲";font-size:9px;vertical-align:1px}
  .metric span{display:block;margin-top:2px;color:var(--muted);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
  .live-summary{display:flex;align-items:center;gap:7px;margin-left:auto;color:var(--ink2);font-size:10.5px;white-space:nowrap}
  .live-summary .pulse{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .live-summary.ok .pulse{background:var(--ok);box-shadow:0 0 0 4px var(--ok-wash)}
  .live-summary.warn .pulse{background:var(--warn);box-shadow:0 0 0 4px var(--warn-wash)}
  .health{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;padding:5px 10px;border-radius:4px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
  .health::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor}
  .health.ok{color:var(--ok)} .health.fail{color:var(--crit)}
  /* Wraps rather than overflows. The keys to the right grew when component
     kinds got their own legend, and a single non-wrapping row pushed the theme
     and zoom controls off the edge — clipped to "LIGH" at 1600px wide. */
  #toolbar{position:relative;z-index:4;display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:43px;padding:6px 18px;
    background:var(--chrome);border-bottom:1px solid var(--line);box-shadow:var(--chrome-shadow,0 8px 24px rgba(0,0,0,.12))}
  .tool-label{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
  #legend{display:flex;gap:5px;flex-wrap:wrap;color:var(--ink2);font-size:10.5px;align-items:center}
  #legend .i{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 8px;
    border:1px solid transparent;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer}
  #legend .i:hover{border-color:var(--ring);background:var(--panel)}
  #legend .i:focus-visible,.view-controls button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #legend .i.on{border-color:var(--acc-line-strong);background:var(--acc-wash);color:var(--ink)}
  #legend .dt{width:8px;height:8px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
  .tool-spacer{flex:1}
  #selection{display:none;align-items:center;gap:7px;padding:4px 8px;background:var(--acc-wash);
    border:1px solid var(--acc-line);border-radius:4px;color:var(--ink2);font-size:10px}
  #selection.on{display:inline-flex}
  #selection b{color:var(--acc)}
  #selection button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;padding:0 2px}
  .status-key{display:flex;align-items:center;gap:10px;padding:0 12px;border-left:1px solid var(--line);
    color:var(--muted);font-size:9.5px;white-space:nowrap}
  .status-key:empty{display:none}
  /* The controls stay together and stay last, whichever row they land on. */
  .view-controls{flex:0 0 auto}
  .status-key span{display:inline-flex;align-items:center;gap:5px}
  .status-key i{width:6px;height:6px;border-radius:50%;background:currentColor}
  .status-key .up{color:var(--ok)} .status-key .idle{color:var(--warn)} .status-key .down{color:var(--crit)}
  /* Unobserved is grey on purpose: it is the absence of a reading, not a bad
     one, and colouring it like a fault would invent information. */
  .status-key .unk{color:var(--muted)}
  .status-key .kind{color:var(--ink2)}
  .status-key .kind i{width:8px;height:8px;border-radius:2px;border:1.4px solid currentColor;background:transparent}
  .status-key .kind.k-gateway{color:var(--gateway-stroke)}
  .status-key .kind.k-host{color:var(--host-stroke)}
  .status-key .kind.k-vm{color:var(--vm-stroke)}
  .status-key .kind.k-net{color:var(--netband-stroke)}
  .status-key .kind.k-external{color:var(--external-stroke)}
  .status-key .kind.k-external i{border-style:dashed}
  .status-key .conf{color:var(--ink2)}
  .status-key .conf i{width:8px;height:8px;border-radius:50%;background:var(--ink2)}
  .status-key .conf i.hollow{background:transparent;border:1.6px solid var(--ink2)}
  .view-controls{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .view-controls button{appearance:none;width:30px;height:28px;border:0;border-left:1px solid var(--line);
    background:var(--panel2);color:var(--ink2);font:600 12px/1 inherit;cursor:pointer}
  .view-controls button:first-child{border-left:0;width:auto;padding:0 9px;font-size:9px;letter-spacing:.06em}
  .view-controls button:hover{background:var(--panel);color:var(--ink)}
  main{position:relative;flex:1;overflow:auto;overscroll-behavior:contain;
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),
      radial-gradient(circle at 48% 0,var(--glow),transparent 38%);
    background-size:24px 24px,24px 24px,100% 100%}
  main::before{content:"ARCHITECTURE CANVAS";position:sticky;left:16px;top:12px;z-index:2;display:inline-block;
    padding:4px 7px;border:1px solid var(--line);background:var(--canvas-tag-bg);color:var(--muted);
    font-size:8px;font-weight:700;letter-spacing:.14em;pointer-events:none}
  svg#net{display:block;margin:-18px auto 0;transition:width .18s ease-out,height .18s ease-out}
  #errs{position:absolute;z-index:10;right:16px;bottom:12px;max-width:min(560px,calc(100% - 32px));margin:0;
    color:var(--crit-ink);background:var(--crit-bg);border:1px solid var(--crit-line);border-radius:5px;
    font-size:10.5px;white-space:pre-wrap;padding:8px 10px;box-shadow:var(--shadow)}
  #errs:empty{display:none}
  /* Drift sits above the error panel and is amber, not red: a peer on the wire
     that the snapshot lacks is out-of-date data, not a failure. The action is a
     re-sync, so it reads as a notice with a next step. */
  #drift{position:absolute;z-index:10;right:16px;bottom:12px;max-width:min(560px,calc(100% - 32px));margin:0;
    color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:5px;
    font-size:10.5px;white-space:pre-wrap;padding:8px 10px;box-shadow:var(--shadow)}
  #drift:empty{display:none}
  #errs:not(:empty)~#drift{bottom:calc(12px + 4.6em)}

  .zone{fill:var(--panel);fill-opacity:.34;stroke:var(--ring);stroke-width:1.1;stroke-dasharray:6 5}
  .zlab{fill:var(--ink2);font-size:12px;font-weight:700;letter-spacing:.08em}
  .zsub{fill:var(--muted);font-size:10.5px}
  .lanehead{fill:var(--muted);font-size:9px;font-weight:700;letter-spacing:.14em}
  .lanerule{stroke:var(--line);stroke-width:1}
  .hbox{fill:var(--panel2);fill-opacity:.8;stroke:var(--ring);stroke-width:1.1}
  /* A physical host is a container, so its kind tints the border and leaves the
     fill neutral — the VMs nested inside it are what carry colour, and tinting
     both would make the box compete with its own contents. */
  .hbox.k-host{stroke:var(--host-stroke);stroke-opacity:.72}
  .htit{fill:var(--ink2);font-size:9.5px;font-weight:700;letter-spacing:.03em}
  .nbox{fill:var(--panel);stroke:var(--ring);stroke-width:1.2;filter:drop-shadow(0 5px 10px var(--node-shadow))}
  /* A node's colour is its kind, not the drawing function that made it.
     .hub/.vmb/.band/.ext used to be styling variants that happened to line up
     with kinds most of the time; a gateway drawn by the mesh stack and one
     drawn as a top chip came out different colours for no reason a reader
     could name. These are the kinds the topology actually carries. */
  .nbox.k-gateway{fill:var(--gateway-fill);stroke:var(--gateway-stroke)}
  .nbox.k-host{fill:var(--host-fill);stroke:var(--host-stroke)}
  .nbox.k-vm{fill:var(--vm-fill);stroke:var(--vm-stroke)}
  .nbox.k-external{fill:var(--external-fill);stroke:var(--external-stroke);stroke-dasharray:5 4}
  .nbox.k-net{fill:var(--netband-fill);stroke:var(--netband-stroke)}
  .nbox.hub{stroke-width:1.8}
  .nbox.vmb{stroke-width:1.1}
  .nbox.band{stroke-width:1}
  .nbox.ext{stroke-dasharray:5 4}
  .ntit{fill:var(--ink);font-size:12px;font-weight:700}
  .nsub{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
  .nkind{fill:var(--muted);font-size:7.8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .btit{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .bsub{fill:var(--muted);font-size:9.5px}
  .plab{font-size:9px;font-weight:700}
  .natlab{fill:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em}
  .warnb{fill:var(--warn);font-size:9.5px}

  .tun{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .tun.dash{stroke-dasharray:6 5}
  .reach{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 5;opacity:.85}
  .flow{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:5 16;opacity:0}
  .flow.on{opacity:.95;animation:fl linear infinite}
  @keyframes fl{to{stroke-dashoffset:-42}}
  .grey{fill:none;stroke:var(--ring);stroke-width:1.4;opacity:.9}
  .nat{stroke:var(--ring);stroke-width:2;stroke-dasharray:3 6}
  /* The glow lives here so that .dim can turn it off. As an inline style it
     outranked the dim rule and a filtered-out bead kept burning. */
  .pdot,.sdot{filter:drop-shadow(0 0 3px var(--glow,transparent))}
  .dim .pdot,.dim .sdot,.pdot.dim,.sdot.dim{filter:none}
  .pdot{stroke:var(--panel);stroke-width:2}
  .sdot{stroke:var(--panel);stroke-width:1.6}
  .jdot{fill:var(--ring)}
  .hot{cursor:pointer}
  .dim{opacity:.06;filter:none;transition:opacity .15s}
  .flow.on.dim,.dim .flow.on{opacity:.06;animation:none;transition:none}
  @media (prefers-reduced-motion:reduce){.flow{display:none}svg#net{transition:none}}
  #tip{position:fixed;pointer-events:none;z-index:30;background:var(--panel);border:1px solid var(--ring);
    border-radius:5px;padding:9px 11px;font-size:11px;box-shadow:var(--shadow);
    opacity:0;transition:opacity .1s;max-width:340px}
  #tip .t{font-weight:700;margin-bottom:3px;color:var(--ink)} #tip .m{color:var(--ink2);line-height:1.5;white-space:pre-line}
  /* layers view — underlay boxes, overlay lines; every colour is a theme token */
  .ly-site{fill:var(--panel2);stroke:var(--line)}
  .ly-sitelab{fill:var(--muted);font-size:10px;letter-spacing:.14em;font-weight:700}
  .ly-farm{fill:var(--panel);stroke:var(--ring);stroke-dasharray:4 3}
  .ly-farmlab{fill:var(--ink2);font-size:10px;letter-spacing:.1em;font-weight:700}
  .ly-host>rect{fill:var(--host-fill);stroke:var(--host-stroke);stroke-width:1.2}
  .ly-hostlab{fill:var(--ink);font-size:11px;font-weight:700}
  .ly-hostip{fill:var(--muted);font-size:9.5px;font-variant-numeric:tabular-nums}
  .ly-row rect{fill:var(--vm-fill);stroke:var(--vm-stroke);stroke-width:.8}
  .ly-row.ly-gateway rect{fill:var(--gateway-fill);stroke:var(--gateway-stroke)}
  .ly-row.ly-physical-host rect{fill:var(--host-fill);stroke:var(--host-stroke)}
  .ly-row.ly-unsynced rect{stroke-dasharray:3 2;fill:var(--external-fill)}
  .ly-rowlab{fill:var(--ink);font-size:10px}
  .ly-rowtag{fill:var(--muted);font-size:8.5px;letter-spacing:.06em}
  .ly-net line{stroke:var(--netband-stroke);stroke-width:3;stroke-linecap:round;opacity:.85}
  .ly-netlab{fill:var(--ink2);font-size:9.5px}
  .ly-chip rect{fill:var(--external-fill);stroke:var(--external-stroke)}
  .ly-chip.ly-edge rect{stroke:var(--acc)} .ly-chip.ly-egress rect{stroke:var(--c3)}
  .ly-chip.ly-tray rect{stroke-dasharray:2 2}
  .ly-chiplab{fill:var(--ink2);font-size:9.5px}
  .ly-wire{fill:none;stroke-width:2;opacity:.75}
  .ly-carry path{fill:none;stroke-width:1.6;stroke-dasharray:6 4;opacity:.8}
  .ly-carry.ly-unsynced path{stroke-dasharray:2 3;opacity:.55}
  .ly-snat{fill:var(--panel);stroke-width:2}
  .ly-transit{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:1.5 3;opacity:.7}
  #derived{position:absolute;z-index:9;right:16px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;
    background:var(--canvas-tag-bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--ink2)}
  #derived h2{margin:6px 0 4px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  #derived h2 span{font-weight:400;margin-left:6px;letter-spacing:0;text-transform:none}
  #derived ol,#derived ul{margin:0;padding-left:16px} #derived li{margin:4px 0;color:var(--ink)} #derived .tk{color:var(--muted);font-size:10px}
  #derived .ly-legend{display:grid;gap:3px} #derived .ly-legend i{display:inline-block;width:10px;height:3px;margin:0 6px 0 0;vertical-align:middle;border-radius:2px}
  #derived .ly-snat-key{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink2);background:transparent}
  @media(max-width:980px){
    header{gap:12px;flex-wrap:wrap}.brand{min-width:210px}#meta{order:3;width:100%;border-top:1px solid var(--line);padding-top:7px}
    .live-summary{margin-left:auto}.status-key{display:none}#toolbar{overflow-x:auto}.tool-spacer{min-width:12px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brandmark">V/</div>
    <div><div class="eyebrow">vctl network observability</div><h1>WireGuard <span>/ topology</span></h1></div>
  </div>
  <div id="meta" aria-label="topology summary">
    <div class="metric"><strong id="site-count">–</strong><span>Sites</span></div>
    <div class="metric"><strong id="gateway-count">–</strong><span>Gateways</span></div>
    <div class="metric"><strong id="tunnel-count">–</strong><span>Tunnels</span></div>
    <!-- Two clocks, deliberately. Structure comes from the last `vctl wg sync`;
         only traffic and handshake come from live polling. One "Updated" made a
         six-day-old graph look current, because the page kept animating. -->
    <div class="metric"><strong id="topology-at">–</strong><span>Topology</span></div>
    <div class="metric"><strong id="updated-at">–</strong><span>Telemetry</span></div>
  </div>
  <div class="live-summary" id="live-summary"><i class="pulse"></i><span>waiting for tunnel state</span></div>
  <span class="health" id="health">connecting</span>
</header>
<div id="toolbar">
  <span class="tool-label">INTERFACES</span>
  <div id="legend" aria-label="interface filter"></div>
  <span id="selection"><b></b> selected <button type="button" aria-label="clear selection">×</button></span>
  <span class="tool-spacer"></span>
  <!-- Confidence, kept apart from state. The diagram mixes collected facts with
       presentational inference — a VIP owner matched from label text, an
       inventory host guessed from an endpoint address — and a reader cannot tell
       them apart from the shapes alone. Filled means recorded; hollow means
       inferred, and the tooltip says from what. -->
  <div class="status-key" id="kind-key" aria-label="component kind legend"></div>
  <div class="status-key" aria-label="confidence legend">
    <span class="conf"><i class="solid"></i>recorded</span><span class="conf"><i class="hollow"></i>inferred</span>
  </div>
  <!-- Only the states this fleet is actually in. The key used to list all six
       whatever was on screen, so "poll error" and "never" sat in the legend of a
       healthy fleet and read as categories somebody should go looking for. The
       wording is the same; what changed is that its presence now means
       something. -->
  <div class="status-key" id="state-key" aria-label="tunnel state legend"></div>
  <div class="view-controls" aria-label="view">
    <button type="button" id="view-toggle" title="switch between the hub wiring and the layered architecture (underlay + overlay)">LAYERS</button>
  </div>
  <div class="view-controls" aria-label="theme">
    <button type="button" id="theme-toggle" title="switch between dark and light">DARK</button>
  </div>
  <div class="view-controls" aria-label="zoom">
    <button type="button" id="zoom-fit" title="fit to screen">FIT</button>
    <button type="button" id="zoom-out" aria-label="zoom out">−</button>
    <button type="button" id="zoom-in" aria-label="zoom in">+</button>
  </div>
</div>

<div id="tip"></div>
<!-- The model first, then the view: wg_view.js reads wg_model.js's declarations
     off the global scope, so the order is not cosmetic.

     These are classic scripts, not modules, and that is also deliberate. The
     dashboard is opened two ways — served by `vctl wg serve`, where Go inlines
     both files into this page so it arrives as one document, and opened straight
     off disk with a window.WG_BOOT topology spliced in, which is how the layout
     gets driven without a database or SSH. A module script would not load over
     file:// and would take that second way away. -->
<script src="wg_model.js"></script>
<script src="wg_layers.js"></script>
<script src="wg_view.js"></script>
