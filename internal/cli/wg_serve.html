<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>vctl · WireGuard live</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232b36; --ring:#2d3745;
    --ink:#e6edf3; --ink2:#9aa7b4; --muted:#5c6773; --acc:#f0883e;
    --c0:#4c8dff; --c1:#ef6f53; --c2:#35c07d; --c3:#f2c94c; --c4:#cf6fb8; --c5:#8b97a6;
    --c6:#7bc2e8; --c7:#b8a1ff;
    --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header b{color:var(--acc)}
  #meta{color:var(--ink2);font-size:12px}
  .health{margin-left:auto;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .health.ok{color:var(--ok)} .health.fail{color:var(--crit)}
  #legend{display:flex;gap:10px;flex-wrap:wrap;padding:7px 16px;border-bottom:1px solid var(--line);
    color:var(--ink2);font-size:11.5px;align-items:center}
  #legend .i{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid transparent;border-radius:999px;cursor:pointer}
  #legend .i:hover{border-color:var(--ring)}
  #legend .i.on{border-color:var(--acc);color:var(--ink)}
  #legend .dt{width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
  main{flex:1;overflow:auto}
  svg#net{display:block;margin:0 auto}
  #errs{color:var(--crit);font-size:11px;white-space:pre-wrap;padding:0 16px 8px}

  .zone{fill:var(--panel);fill-opacity:.28;stroke:var(--ring);stroke-width:1.3;stroke-dasharray:6 5}
  .zlab{fill:var(--ink2);font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .zsub{fill:var(--muted);font-size:10.5px}
  .hbox{fill:var(--panel);fill-opacity:.6;stroke:var(--ring);stroke-width:1.2}
  .htit{fill:var(--ink2);font-size:10.5px;font-weight:700}
  .nbox{fill:var(--panel);stroke:var(--ring);stroke-width:1.3}
  .nbox.hub{stroke:var(--acc);stroke-width:1.8}
  .nbox.vmb{stroke:var(--acc);stroke-width:1.1}
  .nbox.band{stroke-width:1}
  .nbox.ext{stroke-dasharray:5 4}
  .ntit{fill:var(--ink);font-size:12px;font-weight:700}
  .nsub{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
  .btit{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .bsub{fill:var(--muted);font-size:9.5px}
  .plab{font-size:9px;font-weight:700}
  .natlab{fill:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em}
  .warnb{fill:var(--warn);font-size:9.5px}

  .tun{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .tun.dash{stroke-dasharray:6 5}
  .reach{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 5;opacity:.85}
  .flow{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:5 16;opacity:0}
  .flow.on{opacity:.95;animation:fl linear infinite}
  @keyframes fl{to{stroke-dashoffset:-42}}
  .grey{fill:none;stroke:var(--ring);stroke-width:1.4;opacity:.9}
  .nat{stroke:var(--ring);stroke-width:2;stroke-dasharray:3 6}
  .pdot{stroke:var(--panel);stroke-width:2}
  .sdot{stroke:var(--panel);stroke-width:1.6}
  .jdot{fill:var(--ring)}
  .hot{cursor:pointer}
  .dim{opacity:.06;transition:opacity .15s}
  @media (prefers-reduced-motion:reduce){.flow{display:none}}
  #tip{position:fixed;pointer-events:none;z-index:30;background:var(--panel);border:1px solid var(--ring);
    border-radius:8px;padding:7px 10px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transition:opacity .1s;max-width:300px}
  #tip .t{font-weight:700;margin-bottom:2px} #tip .m{color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>WireGuard</b> <span>배선도 · live</span>
  <span id="meta">loading…</span>
  <span class="health" id="health">connecting…</span>
</header>
<div id="legend"></div>
<main><svg id="net"></svg></main>
<pre id="errs"></pre>
<div id="tip"></div>
<script>
"use strict";
// Wiring-diagram renderer: hub iface ports -> NAT -> per-zone endpoints (nested in
// physical hosts) -> reachable-CIDR bands. Band hookups are a grey underlay bus plus
// per-tunnel dashed colour branches (both sides, Seoul like Incheon). Orthogonal
// elbows only; clicking any tunnel focuses that iface and dims the rest.
// Fully driven by /topology + /events; window.WG_BOOT {topology,frames} replays.
const BOOT=window.WG_BOOT||null;
const SVGNS="http://www.w3.org/2000/svg";
const mk=(t,a,p)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PALETTE=["--c0","--c1","--c2","--c3","--c5","--c4","--c6","--c7"];
const ifColMap=new Map();
const ifColor=i=>{if(!ifColMap.has(i))ifColMap.set(i,cssv(PALETTE[ifColMap.size%PALETTE.length]));return ifColMap.get(i)};
const fmtRate=b=>{if(!b||b<1)return"·";const k=1024;return b>=k*k?(b/k/k).toFixed(1)+"M/s":b>=k?(b/k).toFixed(1)+"K/s":b.toFixed(0)+"B/s"};
const hsState=s=>s==null||s<0?"crit":s<=180?"ok":"warn";
const hsLabel=s=>s==null||s<0?"no-handshake":s<=180?`up · ${s}s`:`idle · ${Math.round(s/60)}m`;
const zoneKey=dc=>dc?String(dc).split("-")[0]:"etc";
const svg=document.getElementById("net"), tip=document.getElementById("tip");
let stats={}, tunnels=[], statusDots=new Map(), curTopo=null, focusIf=null;

function hot(el,fn){el.classList.add("hot");
  el.addEventListener("mouseenter",ev=>{const[t,m]=fn();tip.innerHTML=`<div class="t">${esc(t)}</div><div class="m">${esc(m)}</div>`;tip.style.opacity=1;mv(ev);});
  el.addEventListener("mousemove",mv); el.addEventListener("mouseleave",()=>tip.style.opacity=0);}
function mv(ev){let x=ev.clientX+12,y=ev.clientY+12;if(x+290>innerWidth)x=ev.clientX-290;tip.style.left=x+"px";tip.style.top=y+"px";}
function clickFocus(el,ifc){el.addEventListener("click",ev=>{ev.stopPropagation();setFocus(focusIf===ifc?null:ifc);});}

// ---------- model prep: dedup same-IP gateways, pick hub ----------
function prep(topo){
  const N=new Map(topo.nodes.map(n=>[n.id,{...n}]));
  const alias=new Map(), byIp={};
  for(const n of N.values())if(n.kind==="gateway"&&n.ip)(byIp[n.ip]=byIp[n.ip]||[]).push(n);
  for(const ip in byIp){const g=byIp[ip];if(g.length<2)continue;
    g.sort((a,b)=>a.label.length-b.label.length||(a.id<b.id?-1:1));
    for(const d of g.slice(1)){alias.set(d.id,g[0].id);N.delete(d.id);}}
  const eseen=new Set(), E=[];
  for(const e of topo.edges){
    const s=alias.get(e.source)||e.source, t=alias.get(e.target)||e.target;
    if(s===t)continue;
    const k=[s,t,e.iface,e.allowed].join("~"); if(eseen.has(k))continue; eseen.add(k);
    E.push({...e,source:s,target:t});
  }
  let hub=null;
  for(const n of N.values())if(n.kind==="gateway"&&(n.ifaces||[]).length>((hub&&hub.ifaces||[]).length||0))hub=n;
  return {N,E,hub};
}
const cidrs=a=>String(a||"").split(",").map(s=>s.trim()).filter(s=>s&&!/\/32$|\/128$/.test(s));
const slash32=a=>String(a||"").split(",").map(s=>s.trim()).find(s=>/\/32$/.test(s))||"";

// ---------- render ----------
function render(topo){
  curTopo=topo; svg.innerHTML=""; tunnels=[]; statusDots=new Map();
  const {N,E,hub}=prep(topo);
  const gz=mk("g",{},svg),gg=mk("g",{},svg),gt=mk("g",{},svg),gf=mk("g",{},svg),gn=mk("g",{},svg),gd=mk("g",{},svg);
  if(!hub){svg.setAttribute("viewBox","0 0 800 200");svg.setAttribute("width",800);svg.setAttribute("height",200);
    mk("text",{x:40,y:60,class:"ntit"},gn).textContent="게이트웨이 없음 — 먼저 vctl wg sync 실행";return;}
  const grp=(parent,ifc)=>{const g=mk("g",{},parent);if(ifc)g.dataset.ifc=ifc;return g};

  // hub spokes / mesh classification
  const touch=new Map();
  const T=id=>{if(!touch.has(id))touch.set(id,{fwd:[],rev:[]});return touch.get(id)};
  for(const e of E){
    if(e.source===hub.id)T(e.target).fwd.push(e);
    else if(e.target===hub.id)T(e.source).rev.push(e);
  }
  const perIface=new Map();
  for(const [oid,g] of touch){
    if(g.fwd.length===0&&g.rev.length>0){for(const e of g.rev)g.fwd.push({...e,source:hub.id,target:oid,_rev:true});g.rev=[];}
    for(const e of g.fwd){if(!perIface.has(e.iface))perIface.set(e.iface,[]);perIface.get(e.iface).push({oid,e,back:g.rev});}
  }
  const meshIf=new Set();
  for(const [ifc,list] of perIface)
    if(list.length>=4&&list.every(s=>cidrs(s.e.allowed).length===0))meshIf.add(ifc);
  const spokes=[],mesh=[];
  for(const [ifc,list] of perIface)
    for(const s of list)(meshIf.has(ifc)?mesh:spokes).push({...s,iface:ifc});
  const hops=E.filter(e=>e.source!==hub.id&&e.target!==hub.id);

  // hub-zone spokes become top chips; the rest go to right-hand zones
  const topSpokes=spokes.filter(s=>{const n=N.get(s.oid);return n&&zoneKey(n.dc)===zoneKey(hub.dc);});
  const farSpokes=spokes.filter(s=>!topSpokes.includes(s));

  // dynamic widths so full labels are visible
  const HUBX=310, HUBW=Math.max(170,hub.label.length*7.2+26), NATX=HUBX+HUBW+130;
  const epLabels=farSpokes.map(s=>(N.get(s.oid)||{}).label||"");
  const EPW=Math.min(320,Math.max(210,Math.max(0,...epLabels.map(l=>l.length))*7+26));
  const EPX=NATX+50, LANE0=EPX+EPW+34, BANDX=LANE0+150, BANDW=400, ZONE_R=BANDX+BANDW+24;
  const hubIfaces=(hub.ifaces||[]).map(i=>i.name).sort();
  const remoteIf=hubIfaces.filter(i=>!meshIf.has(i));
  const hubH=Math.max(110,46+remoteIf.length*38);
  const HUBY=170;
  const ROWH=64,HOSTPAD=34;

  const zmap=new Map();
  const Z=k=>{if(!zmap.has(k))zmap.set(k,[]);return zmap.get(k)};
  for(const s of farSpokes){const n=N.get(s.oid);Z(n?zoneKey(n.dc):"etc").push(s);}
  const placed=new Set([hub.id,...spokes.map(s=>s.oid),...mesh.map(s=>s.oid)]);
  for(const e of hops)for(const id of[e.source,e.target]){
    const n=N.get(id);
    if(n&&!placed.has(id)&&n.kind!=="external"&&zoneKey(n.dc)!==zoneKey(hub.dc)){
      placed.add(id);Z(zoneKey(n.dc)).push({oid:id,e:null,iface:null,back:[]});}
  }
  // IPAM-ledger VIPs (e.g. o11y DNAT) attach to the endpoint whose label's
  // first token appears in the VIP label ("sre-lb 터널 DNAT (wg3)" -> sre-lb).
  const vipsBy=new Map();
  for(const v of (topo.vips||[])){
    let best=null;
    for(const s of spokes){const n=N.get(s.oid);if(!n)continue;
      const tok=String(n.label).split(/[\s(]/)[0];
      if(tok&&v.label.includes(tok)&&(!best||tok.length>best.tok))best={oid:s.oid,tok:tok.length};}
    if(best){if(!vipsBy.has(best.oid))vipsBy.set(best.oid,[]);vipsBy.get(best.oid).push(v);}
  }
  const vipExtra=oid=>{const vs=vipsBy.get(oid);return vs?28+vs.length*17:0;};

  const zones=[...zmap.entries()].sort((a,b)=>b[1].length-a[1].length);
  let zy=topSpokes.length?180:130; const zoneGeo=[];
  for(const [zk,list] of zones){
    list.sort((a,b)=>String(a.iface||"~").localeCompare(String(b.iface||"~"))||String(a.oid).localeCompare(b.oid));
    let rows=0,bandRefs=0;const cs=new Set();
    for(const s of list){rows+=(N.get(s.oid)?.parent?ROWH+HOSTPAD:ROWH)+vipExtra(s.oid)+14;
      if(s.e)cidrs(s.e.allowed).forEach(c=>{cs.add(c);bandRefs++;});}
    const bandH=[...cs].length?([...cs].length*56+bandRefs*6):0;
    const h=52+Math.max(rows,bandH);
    zoneGeo.push({zk,list,y:zy,h}); zy+=h+26;
  }
  const meshHeights=[...meshIf].map(ifc=>48+mesh.filter(s=>s.iface===ifc).length*20+44+180);
  const leftH=HUBY+hubH+84+meshHeights.reduce((a,b)=>a+b,0)+hops.length*180+160;
  const H=Math.max(zy+40,leftH,720), W=ZONE_R+20;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const drawW=Math.min(W,1560);
  svg.setAttribute("width",drawW); svg.setAttribute("height",Math.round(drawW*H/W));

  // zones: exactly two labels — hub zone (left) and far zones (right).
  // heights are fixed up after drawing, once actual content extents are known.
  const leftZoneRect=mk("rect",{x:40,y:90,width:NATX-90,height:H-140,rx:12,class:"zone"},gz);
  mk("text",{x:56,y:114,class:"zlab"},gz).textContent=zoneKey(hub.dc);
  const natLine=mk("line",{x1:NATX,y1:100,x2:NATX,y2:H-60,class:"nat"},gz);
  mk("text",{x:NATX,y:90,class:"natlab","text-anchor":"middle"},gz).textContent="NAT / WAN";

  // local aggregate bands + grey bus into hub
  const aggm=new Map();
  for(const a of (topo.aggs||[]))if(zoneKey(a.dc)===zoneKey(hub.dc)){
    const c=aggm.get(a.cidr)||{cidr:a.cidr,count:0};c.count+=a.count;aggm.set(a.cidr,c);}
  let ly=150; const localBand=new Map();
  const laggs=[...aggm.values()].sort((a,b)=>b.count-a.count).slice(0,6);
  for(const a of laggs){
    const r=mk("rect",{x:64,y:ly,width:180,height:42,rx:8,class:"nbox band"},gn);
    mk("text",{x:78,y:ly+18,class:"btit"},gn).textContent=a.cidr;
    mk("text",{x:78,y:ly+32,class:"bsub"},gn).textContent=`인벤토리 ×${a.count}`;
    hot(r,()=>[a.cidr,`허브 사이트 로컬 대역 · 호스트 ${a.count}대`]);
    mk("path",{d:`M244,${ly+21} H272`,class:"grey"},gg);
    mk("circle",{cx:244,cy:ly+21,r:3,class:"jdot"},gd);
    localBand.set(a.cidr,{x:244,y:ly+21,ref:0});
    ly+=54;
  }
  if(laggs.length){
    mk("path",{d:`M272,171 V${ly-33}`,class:"grey"},gg);
    mk("path",{d:`M272,${HUBY+40} H${HUBX}`,class:"grey"},gg);
    mk("circle",{cx:HUBX,cy:HUBY+40,r:3,class:"jdot"},gd);
  }
  // reverse-reach onto local bands: dashed colour elbow from the hub's left edge
  // down to a dot on the band — "seoul 쪽이 이 터널로 이 대역에 도달"
  {
    const rif=new Map();
    for(const s of spokes)for(const b of (s.back||[]))for(const c of cidrs(b.allowed)){
      const lb=localBand.get(c); if(!lb)continue;
      if(!rif.has(s.iface))rif.set(s.iface,rif.size);
      const idx=rif.get(s.iface), col=ifColor(s.iface);
      const lane=282+idx*10, hy2=HUBY+62+idx*14, k=lb.ref++;
      const doty=lb.y-8+k*14, dotx=256;
      const g2=grp(gt,s.iface), g2d=grp(gd,s.iface);
      const d=`M${HUBX-6},${hy2} H${lane} V${doty} H${dotx+5}`;
      const pth=mk("path",{d,class:"reach",stroke:col},g2);
      mk("circle",{cx:dotx,cy:doty,r:4,fill:col,class:"sdot"},g2d);
      hot(pth,()=>[`${s.iface} → ${c}`,`역방향 도달 — ${(N.get(s.oid)||{}).label||""} 측 AllowedIPs · 클릭=포커스`]);
      clickFocus(pth,s.iface);
    }
  }

  // hub box + ports (full label)
  const ghub=mk("g",{},gn); ghub.dataset.keep="1";
  mk("rect",{x:HUBX,y:HUBY,width:HUBW,height:hubH,rx:9,class:"nbox hub"},ghub);
  mk("text",{x:HUBX+12,y:HUBY+20,class:"ntit"},ghub).textContent=hub.label;
  mk("text",{x:HUBX+12,y:HUBY+35,class:"nsub"},ghub).textContent=hub.ip||"";
  const hubPort=new Map();
  remoteIf.forEach((ifc,i)=>{
    const y=HUBY+56+i*38, col=ifColor(ifc), port=(hub.ifaces||[]).find(x=>x.name===ifc);
    const g2=grp(gd,ifc);
    const d=mk("circle",{cx:HUBX+HUBW,cy:y,r:5.5,fill:col,class:"pdot hot"},g2);
    hot(d,()=>[`${ifc} :${port?port.port:"?"}`,"허브 리슨 포트 · 클릭=포커스"]); clickFocus(d,ifc);
    const t=mk("text",{x:HUBX+HUBW-10,y:y+3.5,class:"plab","text-anchor":"end"},g2);
    t.textContent=ifc; t.setAttribute("fill",col);
    hubPort.set(ifc,{x:HUBX+HUBW,y});
  });

  // mesh stacks: full labels, dynamic width, generous spacing
  let my=HUBY+hubH+84; let meshIdx=0; const meshGeo=new Map();
  for(const ifc of meshIf){
    const list=mesh.filter(s=>s.iface===ifc);
    const labels=list.map(s=>((N.get(s.oid)||{}).label||s.oid)+"");
    const mw=Math.min(280,Math.max(200,Math.max(0,...labels.map(l=>l.length))*6.6+52));
    const col=ifColor(ifc), bh=48+list.length*20;
    const g2=grp(gn,ifc), g2d=grp(gd,ifc), g2t=grp(gt,ifc);
    const rset=[...new Set(list.flatMap(x=>(x.back||[]).flatMap(b=>cidrs(b.allowed))))];
    const box=mk("rect",{x:64,y:my,width:mw,height:bh,rx:9,class:"nbox"},g2);
    mk("text",{x:76,y:my+18,class:"ntit"},g2).textContent=`${ifc} 메시 ×${list.length}`;
    const port=(hub.ifaces||[]).find(x=>x.name===ifc);
    mk("text",{x:76,y:my+32,class:"nsub"},g2).textContent=":"+(port?port.port:"?");
    hot(box,()=>[`${ifc} 메시`,`허브 ↔ 로컬 피어 ${list.length}대 /32 팬아웃`+
      (rset.length?` · 피어측 AllowedIPs: ${rset.join(", ")}`:"")+" · 클릭=포커스"]); clickFocus(box,ifc);
    const pdx=HUBX+28+meshIdx*22, pdy=HUBY+hubH; meshIdx++;
    const pd=mk("circle",{cx:pdx,cy:pdy,r:5.5,fill:col,class:"pdot hot"},g2d);
    hot(pd,()=>[`${ifc} :${port?port.port:"?"}`,"허브 메시 포트"]); clickFocus(pd,ifc);
    const pl=mk("text",{x:pdx+10,y:pdy-8,class:"plab"},g2d); pl.textContent=ifc; pl.setAttribute("fill",col);
    list.sort((a,b)=>slash32(a.e.allowed).localeCompare(slash32(b.e.allowed),undefined,{numeric:true}));
    const dotX=64+mw-14, lane=64+mw+14;
    list.forEach((s,i)=>{
      const n=N.get(s.oid), y=my+48+i*20;
      const lbl=mk("text",{x:dotX-12,y:y+3,class:"bsub","text-anchor":"end"},g2d);
      lbl.textContent=(n?n.label:s.oid)||"";
      const dd=mk("circle",{cx:dotX,cy:y,r:4.5,fill:col,class:"sdot hot"},g2d);
      statusDots.set(s.e.id,dd);
      hot(dd,()=>{const st=stats[s.e.id]||{};return[(n?n.label:s.oid),
        `${slash32(s.e.allowed)} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
      mk("path",{d:`M${dotX+5},${y} H${lane}`,class:"tun",stroke:col,"stroke-width":1.6},g2t);
    });
    const trunk=`M${lane},${my+48+(list.length-1)*20} V${my+20} H${pdx} V${pdy+6}`;
    const p=mk("path",{d:trunk,class:"tun",stroke:col,"stroke-width":2},g2t);
    hot(p,()=>[`${ifc} · 메시 ×${list.length}`,"허브 ↔ 로컬 피어 /32 팬아웃 · 클릭=포커스"]); clickFocus(p,ifc);
    meshGeo.set(ifc,{x:64+mw,y:my+bh/2});
    my+=bh+44;
  }

  // top chips: spokes living in the hub zone (e.g. roaming admin client)
  topSpokes.forEach((s,i)=>{
    const n=N.get(s.oid); if(!n)return;
    const col=ifColor(s.iface), cw=Math.max(200,n.label.length*7+26);
    const cx0=EPX+i*(cw+24), cy=96;
    const g2=grp(gn,s.iface), g2d=grp(gd,s.iface), g2t=grp(gt,s.iface), g2f=grp(gf,s.iface);
    const box=mk("rect",{x:cx0,y:cy,width:cw,height:50,rx:8,class:"nbox"},g2);
    mk("text",{x:cx0+12,y:cy+20,class:"ntit"},g2).textContent=n.label;
    mk("text",{x:cx0+12,y:cy+36,class:"nsub"},g2).textContent=[n.ip,n.tunnelIp].filter(Boolean).join(" · ");
    hot(box,()=>[n.label,`${n.kind} · ${hub.dc?zoneKey(hub.dc):""} (허브 사이트로 다이얼인)`]); clickFocus(box,s.iface);
    const dd=mk("circle",{cx:cx0,cy:cy+25,r:5.5,fill:col,class:"pdot hot"},g2d);
    statusDots.set(s.e.id,dd);
    hot(dd,()=>{const st=stats[s.e.id]||{};return[`${s.iface} · ${n.label}`,`${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
    const port=hubPort.get(s.iface);
    if(port){
      const lane=HUBX+HUBW+26+remoteIf.indexOf(s.iface)*16;
      const d=`M${port.x+6},${port.y} H${lane} V${cy+25} H${cx0-6}`;
      const base=mk("path",{d,class:"tun",stroke:col},g2t);
      const fl=mk("path",{d,class:"flow",stroke:col},g2f);
      tunnels.push({id:s.e.id,base,fl});
      hot(base,()=>{const st=stats[s.e.id]||{};return[`${s.iface} → ${n.label}`,
        `allowed ${s.e.allowed} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)} · 클릭=포커스`]});
      clickFocus(base,s.iface);
    }
  });

  // right zones: endpoint rows + bands (grey bus + per-tunnel dashed colour)
  const epPos=new Map(), bandPos=new Map();
  for(const zg of zoneGeo){
    const bands={list:[],by:new Map()};
    mk("rect",{x:EPX-24,y:zg.y,width:ZONE_R-(EPX-24)-16,height:zg.h,rx:12,class:"zone"},gz);
    mk("text",{x:EPX-8,y:zg.y+22,class:"zlab"},gz).textContent=zg.zk;
    mk("text",{x:BANDX,y:zg.y+22,class:"zsub"},gz).textContent="도달 대역";
    let ry=zg.y+40, epIdx=0;
    for(const s of zg.list){
      const n=N.get(s.oid); if(!n)continue;
      const parent=n.parent&&N.get(n.parent);
      const g2=grp(gn,s.iface||undefined), g2d=grp(gd,s.iface||undefined);
      let by=ry;
      if(parent){
        mk("rect",{x:EPX-10,y:ry,width:EPW+20,height:ROWH+HOSTPAD+(vipsBy.get(s.oid)?28+vipsBy.get(s.oid).length*17:0),rx:10,class:"hbox"},g2);
        mk("text",{x:EPX+2,y:ry+16,class:"htit"},g2).textContent=parent.label+(parent.ip?" · "+parent.ip:"");
        by=ry+HOSTPAD-8;
      }
      const vips=vipsBy.get(s.oid)||[], vh=vips.length?28+vips.length*17:0;
      const box=mk("rect",{x:EPX,y:by,width:EPW,height:ROWH-10+vh,rx:8,class:"nbox"+(n.kind==="vm"?" vmb":"")},g2);
      mk("text",{x:EPX+12,y:by+20,class:"ntit"},g2).textContent=n.label;
      mk("text",{x:EPX+12,y:by+36,class:"nsub"},g2).textContent=[n.ip,n.tunnelIp].filter(Boolean).join(" · ");
      if(n.warnings&&n.warnings.length)mk("text",{x:EPX+EPW-10,y:by+16,class:"warnb","text-anchor":"end"},g2).textContent="⚠";
      hot(box,()=>[n.label,`${n.kind}${n.dc?" · "+n.dc:""}${n.observed?" · 관측 "+n.observed:""}${n.warnings?" · "+n.warnings.join("; "):""}`]);
      if(s.iface)clickFocus(box,s.iface);
      if(vips.length){ // ledger DNAT VIPs stacked vertically, beads on a wire
        const vifc=vips[0].iface||s.iface, vcol=ifColor(vifc);
        const gv=grp(gd,vifc), gvt=grp(gt,vifc);
        const t=mk("text",{x:EPX+12,y:by+54,class:"bsub"},gv);
        t.textContent=`DNAT VIP ×${vips.length}${vifc?" · "+vifc:""}`; t.setAttribute("fill",vcol);
        vips.forEach((v,i)=>{
          const vy=by+68+i*17;
          const dd=mk("circle",{cx:EPX+20,cy:vy,r:4.5,fill:vcol,class:"sdot hot"},gv);
          hot(dd,()=>[v.ip,`${v.label}${v.note?" · "+v.note:""} (IPAM 대장)`]);
          clickFocus(dd,vifc);
          mk("text",{x:EPX+32,y:vy+3,class:"bsub"},gv).textContent=v.ip;
        });
        const wire=mk("path",{d:`M${EPX+20},${by+68+(vips.length-1)*17} V${by+58}`,class:"tun",stroke:vcol,"stroke-width":1.6},gvt);
        hot(wire,()=>[`DNAT VIP ×${vips.length}`,"IPAM 대장(ip_allocations) 기재 — WG 수집 밖 · 클릭=포커스"]);
        clickFocus(wire,vifc);
        const mg=meshGeo.get(vifc);
        if(mg){ // DNAT 목적지 = 해당 iface 메시 (수송은 상위 터널)
          const d2=`M${EPX-6},${by+62} H${NATX-44} V${mg.y} H${mg.x+6}`;
          const lp=mk("path",{d:d2,class:"reach",stroke:vcol},gvt);
          hot(lp,()=>[`DNAT → ${vifc} 메시`,"상위 터널에 실려 허브 도착 후 메시로 팬아웃 (개별 매핑은 sre-lb iptables)"]);
          clickFocus(lp,vifc);
          mk("circle",{cx:EPX-6,cy:by+62,r:4,fill:vcol,class:"sdot"},gv);
        }
      }
      const cy=by+(ROWH-10)/2;
      epPos.set(s.oid,{inX:EPX,outX:EPX+EPW,rowY:cy});
      if(s.iface&&s.e){
        const col=ifColor(s.iface), port=hubPort.get(s.iface);
        const din=mk("circle",{cx:EPX,cy:cy,r:5.5,fill:col,class:"pdot hot"},g2d);
        statusDots.set(s.e.id,din);
        hot(din,()=>{const st=stats[s.e.id]||{};return[`${s.iface} · ${n.label}`,
          `${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} · tx ${fmtRate(st.tx)}${s.back.length?" · 역방향 "+cidrs(s.back[0].allowed).join(","):""}`];});
        clickFocus(din,s.iface);
        if(port){
          const g2t=grp(gt,s.iface), g2f=grp(gf,s.iface);
          const lane=HUBX+HUBW+26+remoteIf.indexOf(s.iface)*16;
          const d=`M${port.x+6},${port.y} H${lane} V${cy} H${EPX-6}`;
          const base=mk("path",{d,class:"tun",stroke:col},g2t);
          const fl=mk("path",{d,class:"flow",stroke:col},g2f);
          tunnels.push({id:s.e.id,base,fl});
          hot(base,()=>{const st=stats[s.e.id]||{};return[`${s.iface} → ${n.label}`,
            `allowed ${s.e.allowed} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)} · 클릭=포커스`]});
          clickFocus(base,s.iface);
        }
        const cs=cidrs(s.e.allowed);
        if(cs.length){
          mk("circle",{cx:EPX+EPW,cy:cy,r:5.5,fill:col,class:"pdot"},g2d);
          for(const c of cs){
            let b=bands.by.get(c);
            if(!b){b={cidr:c,refs:[]};bands.by.set(c,b);bands.list.push(b);}
            b.refs.push({iface:s.iface,eid:s.e.id,fromX:EPX+EPW,fromY:cy,lane:LANE0+epIdx*16});
          }
        }
        epIdx++;
      }
      ry+=(parent?ROWH+HOSTPAD:ROWH)+vh+14;
    }
    // bands: grey underlay bus per endpoint + dashed per-tunnel colour into each dot
    let byy=zg.y+40;
    for(const b of bands.list){
      const hgt=Math.max(44,20+b.refs.length*17);
      const gb=mk("g",{},gn); gb.dataset.ifs=b.refs.map(r=>r.iface).join("|");
      const r=mk("rect",{x:BANDX,y:byy,width:BANDW,height:hgt,rx:8,class:"nbox band"},gb);
      mk("text",{x:BANDX+14,y:byy+20,class:"btit"},gb).textContent=b.cidr;
      hot(r,()=>[b.cidr,"도달: "+b.refs.map(x=>x.iface).join(", ")]);
      bandPos.set(b.cidr,{y:byy,n:b.refs.length});
      b.refs.forEach((rf,i)=>{
        const dy=byy+15+i*17, col=ifColor(rf.iface);
        const g2=grp(gt,rf.iface), g2d=grp(gd,rf.iface);
        mk("circle",{cx:BANDX-12,cy:dy,r:5,fill:col,class:"pdot hot"},g2d);
        // grey bus (underlay, one solid line per endpoint lane)
        mk("path",{d:`M${rf.fromX+6},${rf.fromY} H${rf.lane} V${dy} H${BANDX-18}`,class:"grey"},gg);
        // per-tunnel dashed colour on top
        const p=mk("path",{d:`M${rf.fromX+6},${rf.fromY} H${rf.lane} V${dy} H${BANDX-18}`,class:"reach",stroke:col},g2);
        hot(p,()=>{const st=stats[rf.eid]||{};return[`${rf.iface} → ${b.cidr}`,
          `${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)} · 클릭=포커스`]});
        clickFocus(p,rf.iface);
      });
      byy+=hgt+12;
    }
  }

  // second-hop edges: grouped per far node (a pair may have one edge per side),
  // reach CIDRs land on the matching zone band when it exists, else chips below.
  let hy=my+8;
  const hopBy=new Map(); const extHops=[];
  for(const e of hops){
    const sp=epPos.get(e.source)||epPos.get(e.target);
    const other=epPos.get(e.source)?e.target:e.source;
    const tn=N.get(other); if(!sp||!tn)continue;
    if(tn.kind==="external"){extHops.push({e,sp,tn});continue;}
    if(zoneKey(tn.dc)!==zoneKey(hub.dc))continue;
    if(!hopBy.has(other))hopBy.set(other,{tn,sp,edges:[]});
    hopBy.get(other).edges.push(e);
  }
  for(const {e,sp,tn} of extHops){
    const col=ifColor(e.iface);
    const g2=grp(gn,e.iface), g2t=grp(gt,e.iface);
    const cxx=BANDX+BANDW-170, cy=sp.rowY+30;
    const r=mk("rect",{x:cxx,y:cy-14,width:170,height:30,rx:8,class:"nbox ext"},g2);
    mk("text",{x:cxx+10,y:cy+4,class:"bsub"},g2).textContent=tn.label.slice(0,24);
    hot(r,()=>[tn.label,`외부 endpoint (수집 관측) · allowed ${e.allowed}`]);
    const base=mk("path",{d:`M${sp.outX+6},${sp.rowY} H${LANE0+112} V${cy} H${cxx-4}`,class:"tun dash",stroke:col,"stroke-width":1.7},g2t);
    hot(base,()=>{const st=stats[e.id]||{};return[`${e.iface} → ${tn.label}`,
      `allowed ${e.allowed} · ${hsLabel(st.hs)} · 문서 미기재 종단 · 클릭=포커스`]});
    clickFocus(base,e.iface);
  }
  for(const [oid,{tn,sp,edges}] of hopBy){
    const bw2=Math.max(200,tn.label.length*7+26);
    const g2=mk("g",{},gn); g2.dataset.ifs=edges.map(e=>e.iface).join("|");
    const bx2=mk("rect",{x:64,y:hy,width:bw2,height:52,rx:8,class:"nbox"+(tn.kind==="vm"?" vmb":"")},g2);
    mk("text",{x:76,y:hy+20,class:"ntit"},g2).textContent=tn.label;
    mk("text",{x:76,y:hy+36,class:"nsub"},g2).textContent=[tn.ip,tn.tunnelIp].filter(Boolean).join(" · ");
    hot(bx2,()=>[tn.label,`${tn.kind}${tn.dc?" · "+tn.dc:""}`]);
    const chipR=64+bw2;
    let below=0;
    edges.forEach((e,k)=>{
      const col=ifColor(e.iface), cy2=hy+18+k*16;
      const g2d=grp(gd,e.iface), g2t=grp(gt,e.iface), g2f=grp(gf,e.iface);
      const dd=mk("circle",{cx:chipR,cy:cy2,r:5.5,fill:col,class:"pdot hot"},g2d);
      statusDots.set(e.id,dd);
      hot(dd,()=>{const st=stats[e.id]||{};return[`${e.iface} · ${tn.label}`,`${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
      clickFocus(dd,e.iface);
      mk("circle",{cx:sp.inX,cy:sp.rowY+16+k*12,r:5,fill:col,class:"pdot"},g2d);
      const d=`M${chipR+6},${cy2} H${EPX-38-k*10} V${sp.rowY+16+k*12} H${sp.inX-6}`;
      const base=mk("path",{d,class:"tun",stroke:col},g2t);
      const fl=mk("path",{d,class:"flow",stroke:col},g2f);
      tunnels.push({id:e.id,base,fl});
      hot(base,()=>{const st=stats[e.id]||{};return[`${e.iface} ↔ ${tn.label}`,
        `allowed ${e.allowed} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)} · 클릭=포커스`]});
      clickFocus(base,e.iface);
      // reach: onto an existing zone band when drawn there, else a chip below
      cidrs(e.allowed).forEach(c=>{
        const bp=bandPos.get(c);
        if(bp){ // e.g. personal → seoul 201/110/130: dot on the seoul band itself
          const dy=bp.y+15+bp.n*17; bp.n++;
          mk("circle",{cx:BANDX-12,cy:dy,r:5,fill:col,class:"pdot"},g2d);
          const rp=mk("path",{d:`M${chipR+6},${hy+40} H${NATX-56-k*8} V${dy} H${BANDX-18}`,class:"reach",stroke:col},g2t);
          hot(rp,()=>[`${e.iface} → ${c}`,`${tn.label} 경유 도달 (피어측 AllowedIPs) · 클릭=포커스`]);
          clickFocus(rp,e.iface);
        }else{
          const byy=hy+64+below*48; below++;
          const rb=mk("rect",{x:94,y:byy,width:bw2-30,height:40,rx:8,class:"nbox band"},g2);
          mk("text",{x:106,y:byy+18,class:"btit"},g2).textContent=c;
          mk("text",{x:106,y:byy+32,class:"bsub"},g2).textContent=`${e.iface} 경유 도달`;
          hot(rb,()=>[c,`${tn.label} 뒤로 ${e.iface} 터널이 실어 나르는 대역`]);
          mk("path",{d:`M80,${hy+52} V${byy+20} H88`,class:"reach",stroke:col},g2t);
          mk("circle",{cx:94,cy:byy+20,r:4,fill:col,class:"sdot"},g2d);
        }
      });
    });
    hy+=66+below*48;
  }
  buildLegend(); applyStats(); setFocus(focusIf);
  try{const bb=svg.getBBox();const H2=Math.min(H,bb.y+bb.height+30);
    svg.setAttribute("viewBox",`0 0 ${W} ${H2}`);
    svg.setAttribute("height",Math.round(drawW*H2/W));}catch(_){}
}

// ---------- tunnel focus: dim everything not on the clicked iface ----------
function setFocus(f){
  focusIf=f;
  for(const el of svg.querySelectorAll("g,path,rect,circle,text,line")){
    if(el.tagName==="g"&&!el.dataset)continue;
    const own=el.dataset&&el.dataset.ifc, ifs=el.dataset&&el.dataset.ifs, keep=el.dataset&&el.dataset.keep;
    if(own===undefined&&ifs===undefined&&keep===undefined)continue;
    const onIt=!f||keep!=null||own===f||(ifs&&ifs.split("|").includes(f));
    el.classList.toggle("dim",!!f&&!onIt);
  }
  document.querySelectorAll("#legend .i[data-if]").forEach(ch=>ch.classList.toggle("on",ch.dataset.if===f));
}
svg.addEventListener("click",e=>{if(e.target===svg||e.target.classList.contains("zone"))setFocus(null);});

function buildLegend(){
  const ifs=new Set(); (curTopo.edges||[]).forEach(e=>ifs.add(e.iface));
  const el=document.getElementById("legend");
  el.innerHTML=[...ifs].sort().map(i=>
    `<span class="i" data-if="${esc(i)}"><span class="dt" style="background:${ifColor(i)}"></span>${esc(i)}</span>`).join("");
  el.querySelectorAll(".i[data-if]").forEach(ch=>ch.addEventListener("click",()=>setFocus(focusIf===ch.dataset.if?null:ch.dataset.if)));
}
function applyStats(){
  for(const t of tunnels){
    const st=stats[t.id];
    if(st&&(st.rx>0||st.tx>0)){
      const r=st.rx+st.tx;
      t.fl.classList.add("on");
      t.fl.style.animationDuration=Math.max(.5,2.6-Math.log10(r+1)*.38)+"s";
      t.base.setAttribute("stroke-width",Math.min(4.6,2+Math.log10(r+1)*.5));
    }else t.fl.classList.remove("on");
  }
  for(const [eid,dot] of statusDots){
    const st=stats[eid]; if(!st)continue;
    const c=cssv("--"+hsState(st.hs));
    dot.setAttribute("stroke",c);
    dot.style.filter=`drop-shadow(0 0 3px ${c})`;
  }
}
function updateMeta(topo,at){
  const zones=new Set(topo.nodes.filter(n=>n.dc).map(n=>zoneKey(n.dc)));
  document.getElementById("meta").textContent=
    `${zones.size} sites · ${topo.nodes.filter(n=>n.kind==="gateway").length} gateways · ${topo.edges.length} tunnels · ${new Date(at*1000).toLocaleTimeString()}`;
}

// ---------- wiring: injected BOOT replay (demo) or live fetch + SSE ----------
if(BOOT){
  render(BOOT.topology);
  const frames=BOOT.frames||[]; let fi=0;
  const ap=()=>{stats=frames.length?frames[fi%frames.length]:{};updateMeta(BOOT.topology,Date.now()/1000);applyStats();fi++;};
  ap(); if(frames.length>1)setInterval(ap,2000);
  document.getElementById("health").textContent="demo replay";
}else{
  fetch("topology").then(r=>r.json()).then(topo=>{
    render(topo);
    const es=new EventSource("events");
    es.onmessage=ev=>{
      const d=JSON.parse(ev.data); stats=d.edges||{};
      updateMeta(topo,d.at); applyStats();
      const errN=Object.keys(d.errors||{}).length, h=document.getElementById("health");
      h.className="health "+(errN?"fail":"ok");
      h.textContent=errN?`${errN} poll failures`:"live polling healthy";
      document.getElementById("errs").textContent=Object.entries(d.errors||{}).map(([k,v])=>`! ${k}: ${v}`).join("\n");
    };
  });
}
</script>
