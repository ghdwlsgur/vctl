<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>vctl · WireGuard live</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232b36; --ring:#2d3745;
    --ink:#e6edf3; --ink2:#9aa7b4; --muted:#5c6773; --acc:#f0883e;
    --c0:#4c8dff; --c1:#ef6f53; --c2:#35c07d; --c3:#f2c94c; --c4:#cf6fb8; --c5:#8b97a6;
    --c6:#7bc2e8; --c7:#b8a1ff;
    --ok:#3fb950; --warn:#e3b341; --crit:#f85149;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header b{color:var(--acc)}
  #meta{color:var(--ink2);font-size:12px}
  .health{margin-left:auto;font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .health.ok{color:var(--ok)} .health.fail{color:var(--crit)}
  #legend{display:flex;gap:13px;flex-wrap:wrap;padding:7px 16px;border-bottom:1px solid var(--line);
    color:var(--ink2);font-size:11.5px;align-items:center}
  #legend .i{display:inline-flex;align-items:center;gap:6px}
  #legend .dt{width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
  main{flex:1;overflow:auto}
  svg#net{display:block;margin:0 auto}
  #errs{color:var(--crit);font-size:11px;white-space:pre-wrap;padding:0 16px 8px}

  .zone{fill:var(--panel);fill-opacity:.28;stroke:var(--ring);stroke-width:1.3;stroke-dasharray:6 5}
  .zlab{fill:var(--ink2);font-size:12.5px;font-weight:700;letter-spacing:.06em}
  .zsub{fill:var(--muted);font-size:10.5px}
  .hbox{fill:var(--panel);fill-opacity:.6;stroke:var(--ring);stroke-width:1.2}
  .htit{fill:var(--ink2);font-size:10.5px;font-weight:700}
  .nbox{fill:var(--panel);stroke:var(--ring);stroke-width:1.3}
  .nbox.hub{stroke:var(--acc);stroke-width:1.8}
  .nbox.vmb{stroke:var(--acc);stroke-width:1.1}
  .nbox.band{stroke-width:1}
  .nbox.ext{stroke-dasharray:5 4}
  .ntit{fill:var(--ink);font-size:12px;font-weight:700}
  .nsub{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
  .btit{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .bsub{fill:var(--muted);font-size:9.5px}
  .plab{font-size:9px;font-weight:700}
  .natlab{fill:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em}
  .warnb{fill:var(--warn);font-size:9.5px}

  .tun{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
  .tun.dash{stroke-dasharray:6 5}
  .flow{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:5 16;opacity:0}
  .flow.on{opacity:.95;animation:fl linear infinite}
  @keyframes fl{to{stroke-dashoffset:-42}}
  .grey{fill:none;stroke:var(--ring);stroke-width:1.4;opacity:.9}
  .nat{stroke:var(--ring);stroke-width:2;stroke-dasharray:3 6}
  .pdot{stroke:var(--panel);stroke-width:2}
  .sdot{stroke:var(--panel);stroke-width:1.6}
  .jdot{fill:var(--ring)}
  .hot{cursor:pointer}
  @media (prefers-reduced-motion:reduce){.flow{display:none}}
  #tip{position:fixed;pointer-events:none;z-index:30;background:var(--panel);border:1px solid var(--ring);
    border-radius:8px;padding:7px 10px;font-size:11.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transition:opacity .1s;max-width:300px}
  #tip .t{font-weight:700;margin-bottom:2px} #tip .m{color:var(--muted)}
</style>
</head>
<body>
<header>
  <b>WireGuard</b> <span>배선도 · live</span>
  <span id="meta">loading…</span>
  <span class="health" id="health">connecting…</span>
</header>
<div id="legend"></div>
<main><svg id="net"></svg></main>
<pre id="errs"></pre>
<div id="tip"></div>
<script>
"use strict";
// Wiring-diagram renderer: hub iface ports -> NAT -> per-zone endpoints (nested in
// physical hosts) -> reachable-CIDR bands with per-iface dots. Orthogonal elbows,
// per-iface colours, live flow/handshake from SSE. Fully driven by /topology+/events;
// an injected window.WG_BOOT ({topology, frames}) replays a snapshot instead.
const BOOT=window.WG_BOOT||null;
const SVGNS="http://www.w3.org/2000/svg";
const mk=(t,a,p)=>{const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const PALETTE=["--c0","--c1","--c2","--c3","--c5","--c4","--c6","--c7"];
const ifColMap=new Map();
const ifColor=i=>{if(!ifColMap.has(i))ifColMap.set(i,cssv(PALETTE[ifColMap.size%PALETTE.length]));return ifColMap.get(i)};
const fmtRate=b=>{if(!b||b<1)return"·";const k=1024;return b>=k*k?(b/k/k).toFixed(1)+"M/s":b>=k?(b/k).toFixed(1)+"K/s":b.toFixed(0)+"B/s"};
const hsState=s=>s==null||s<0?"crit":s<=180?"ok":"warn";
const hsLabel=s=>s==null||s<0?"no-handshake":s<=180?`up · ${s}s`:`idle · ${Math.round(s/60)}m`;
const zoneKey=dc=>dc?String(dc).split("-")[0]:"etc";
const svg=document.getElementById("net"), tip=document.getElementById("tip");
let stats={}, tunnels=[], statusDots=new Map(), curTopo=null;

function hot(el,fn){el.classList.add("hot");
  el.addEventListener("mouseenter",ev=>{const[t,m]=fn();tip.innerHTML=`<div class="t">${esc(t)}</div><div class="m">${esc(m)}</div>`;tip.style.opacity=1;mv(ev);});
  el.addEventListener("mousemove",mv); el.addEventListener("mouseleave",()=>tip.style.opacity=0);}
function mv(ev){let x=ev.clientX+12,y=ev.clientY+12;if(x+290>innerWidth)x=ev.clientX-290;tip.style.left=x+"px";tip.style.top=y+"px";}

// ---------- model prep: dedup same-IP gateways, pick hub ----------
function prep(topo){
  const N=new Map(topo.nodes.map(n=>[n.id,{...n}]));
  const alias=new Map(), byIp={};
  for(const n of N.values())if(n.kind==="gateway"&&n.ip)(byIp[n.ip]=byIp[n.ip]||[]).push(n);
  for(const ip in byIp){const g=byIp[ip];if(g.length<2)continue;
    g.sort((a,b)=>a.label.length-b.label.length||(a.id<b.id?-1:1));
    for(const d of g.slice(1)){alias.set(d.id,g[0].id);N.delete(d.id);}}
  const eseen=new Set(), E=[];
  for(const e of topo.edges){
    const s=alias.get(e.source)||e.source, t=alias.get(e.target)||e.target;
    if(s===t)continue;
    const k=[s,t,e.iface,e.allowed].join("~"); if(eseen.has(k))continue; eseen.add(k);
    E.push({...e,source:s,target:t});
  }
  let hub=null;
  for(const n of N.values())if(n.kind==="gateway"&&(n.ifaces||[]).length>((hub&&hub.ifaces||[]).length||0))hub=n;
  return {N,E,hub};
}
const cidrs=a=>String(a||"").split(",").map(s=>s.trim()).filter(s=>s&&!/\/32$|\/128$/.test(s));
const slash32=a=>String(a||"").split(",").map(s=>s.trim()).find(s=>/\/32$/.test(s))||"";

// ---------- render ----------
function render(topo){
  curTopo=topo; svg.innerHTML=""; tunnels=[]; statusDots=new Map();
  const {N,E,hub}=prep(topo);
  const gz=mk("g",{},svg),gg=mk("g",{},svg),gt=mk("g",{},svg),gf=mk("g",{},svg),gn=mk("g",{},svg),gd=mk("g",{},svg);
  if(!hub){svg.setAttribute("viewBox","0 0 800 200");svg.setAttribute("width",800);svg.setAttribute("height",200);
    mk("text",{x:40,y:60,class:"ntit"},gn).textContent="게이트웨이 없음 — 먼저 vctl wg sync 실행";return;}

  // hub spokes / mesh classification
  const touch=new Map();
  const T=id=>{if(!touch.has(id))touch.set(id,{fwd:[],rev:[]});return touch.get(id)};
  for(const e of E){
    if(e.source===hub.id)T(e.target).fwd.push(e);
    else if(e.target===hub.id)T(e.source).rev.push(e);
  }
  const perIface=new Map();
  for(const [oid,g] of touch){
    if(g.fwd.length===0&&g.rev.length>0){ // only reverse view collected — synthesize
      for(const e of g.rev)g.fwd.push({...e,source:hub.id,target:oid,_rev:true});
      g.rev=[];
    }
    for(const e of g.fwd){if(!perIface.has(e.iface))perIface.set(e.iface,[]);perIface.get(e.iface).push({oid,e,back:g.rev});}
  }
  const meshIf=new Set();
  for(const [ifc,list] of perIface)
    if(list.length>=4&&list.every(s=>cidrs(s.e.allowed).length===0))meshIf.add(ifc);
  const spokes=[],mesh=[];
  for(const [ifc,list] of perIface)
    for(const s of list)(meshIf.has(ifc)?mesh:spokes).push({...s,iface:ifc});
  const hops=E.filter(e=>e.source!==hub.id&&e.target!==hub.id);

  // geometry
  const HUBX=310,HUBW=170,NATX=610;
  const EPX=660,EPW=210,LANE0=900,BANDX=1010,BANDW=400,ZONE_R=BANDX+BANDW+24;
  const hubIfaces=(hub.ifaces||[]).map(i=>i.name).sort();
  const remoteIf=hubIfaces.filter(i=>!meshIf.has(i));
  const hubH=Math.max(110,46+remoteIf.length*38);
  const HUBY=150;
  const ROWH=64,HOSTPAD=34;

  // zone grouping on the right
  const zmap=new Map();
  const Z=k=>{if(!zmap.has(k))zmap.set(k,[]);return zmap.get(k)};
  for(const s of spokes){const n=N.get(s.oid);Z(n?zoneKey(n.dc):"etc").push(s);}
  const placed=new Set([hub.id,...spokes.map(s=>s.oid),...mesh.map(s=>s.oid)]);
  for(const e of hops)for(const id of[e.source,e.target]){
    const n=N.get(id);
    if(n&&!placed.has(id)&&n.kind!=="external"&&zoneKey(n.dc)!==zoneKey(hub.dc)){
      placed.add(id);Z(zoneKey(n.dc)).push({oid:id,e:null,iface:null,back:[]});}
  }
  const zones=[...zmap.entries()].sort((a,b)=>b[1].length-a[1].length);
  let zy=110; const zoneGeo=[];
  for(const [zk,list] of zones){
    list.sort((a,b)=>String(a.iface||"~").localeCompare(String(b.iface||"~"))||String(a.oid).localeCompare(b.oid));
    // rows + rough band space
    let rows=0,bandRefs=0;const cs=new Set();
    for(const s of list){rows+=(N.get(s.oid)?.parent?ROWH+HOSTPAD:ROWH)+14;
      if(s.e)cidrs(s.e.allowed).forEach(c=>{cs.add(c);bandRefs++;});}
    const bandH=[...cs].length?([...cs].length*56+bandRefs*6):0;
    const h=52+Math.max(rows,bandH);
    zoneGeo.push({zk,list,y:zy,h}); zy+=h+26;
  }
  const meshHeights=[...meshIf].map(ifc=>44+mesh.filter(s=>s.iface===ifc).length*19+26);
  const leftH=HUBY+hubH+50+meshHeights.reduce((a,b)=>a+b,0)+hops.length*66+120;
  const H=Math.max(zy+40,leftH,720), W=ZONE_R+20;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const drawW=Math.min(W,1500);
  svg.setAttribute("width",drawW); svg.setAttribute("height",Math.round(drawW*H/W));

  // hub zone + NAT
  mk("rect",{x:40,y:70,width:520,height:H-120,rx:12,class:"zone"},gz);
  mk("text",{x:56,y:94,class:"zlab"},gz).textContent=zoneKey(hub.dc)+" · hub";
  mk("text",{x:56,y:109,class:"zsub"},gz).textContent=hub.dc||"";
  mk("line",{x1:NATX,y1:80,x2:NATX,y2:H-60,class:"nat"},gz);
  mk("text",{x:NATX,y:70,class:"natlab","text-anchor":"middle"},gz).textContent="NAT / WAN";

  // local aggregate bands (inventory context) -> grey bus into hub
  const aggm=new Map();
  for(const a of (topo.aggs||[]))if(zoneKey(a.dc)===zoneKey(hub.dc)){
    const c=aggm.get(a.cidr)||{cidr:a.cidr,count:0};c.count+=a.count;aggm.set(a.cidr,c);}
  let ly=140;
  const laggs=[...aggm.values()].sort((a,b)=>b.count-a.count).slice(0,6);
  for(const a of laggs){
    const r=mk("rect",{x:64,y:ly,width:180,height:42,rx:8,class:"nbox band"},gn);
    mk("text",{x:78,y:ly+18,class:"btit"},gn).textContent=a.cidr;
    mk("text",{x:78,y:ly+32,class:"bsub"},gn).textContent=`인벤토리 ×${a.count}`;
    hot(r,()=>[a.cidr,`허브 사이트 로컬 대역 · 호스트 ${a.count}대`]);
    mk("path",{d:`M244,${ly+21} H272`,class:"grey"},gg);
    mk("circle",{cx:244,cy:ly+21,r:3,class:"jdot"},gd);
    ly+=54;
  }
  if(laggs.length){
    mk("path",{d:`M272,161 V${ly-33}`,class:"grey"},gg);
    mk("path",{d:`M272,${HUBY+40} H${HUBX}`,class:"grey"},gg);
    mk("circle",{cx:HUBX,cy:HUBY+40,r:3,class:"jdot"},gd);
  }

  // hub box + ports
  mk("rect",{x:HUBX,y:HUBY,width:HUBW,height:hubH,rx:9,class:"nbox hub"},gn);
  mk("text",{x:HUBX+12,y:HUBY+20,class:"ntit"},gn).textContent=hub.label.length>21?hub.label.slice(0,20)+"…":hub.label;
  mk("text",{x:HUBX+12,y:HUBY+35,class:"nsub"},gn).textContent=hub.ip||"";
  const hubPort=new Map();
  remoteIf.forEach((ifc,i)=>{
    const y=HUBY+56+i*38, col=ifColor(ifc), port=(hub.ifaces||[]).find(x=>x.name===ifc);
    const d=mk("circle",{cx:HUBX+HUBW,cy:y,r:5.5,fill:col,class:"pdot hot"},gd);
    hot(d,()=>[`${ifc} :${port?port.port:"?"}`,"허브 리슨 포트"]);
    const t=mk("text",{x:HUBX+HUBW-10,y:y+3.5,class:"plab","text-anchor":"end"},gd);
    t.textContent=ifc; t.setAttribute("fill",col);
    hubPort.set(ifc,{x:HUBX+HUBW,y});
  });

  // mesh stacks (hub-local /32 fan) on the left, vertical dots + single trunk
  let my=HUBY+hubH+50;
  for(const ifc of meshIf){
    const list=mesh.filter(s=>s.iface===ifc);
    const col=ifColor(ifc), bh=44+list.length*19;
    const box=mk("rect",{x:64,y:my,width:200,height:bh,rx:9,class:"nbox"},gn);
    mk("text",{x:76,y:my+18,class:"ntit"},gn).textContent=`${ifc} 메시 ×${list.length}`;
    const port=(hub.ifaces||[]).find(x=>x.name===ifc);
    mk("text",{x:76,y:my+32,class:"nsub"},gn).textContent=":"+(port?port.port:"?");
    hot(box,()=>[`${ifc} 메시`,`허브 ↔ 로컬 피어 ${list.length}대 /32 팬아웃`]);
    const pdx=HUBX+28+[...meshIf].indexOf(ifc)*22, pdy=HUBY+hubH;
    const pd=mk("circle",{cx:pdx,cy:pdy,r:5.5,fill:col,class:"pdot hot"},gd);
    hot(pd,()=>[`${ifc} :${port?port.port:"?"}`,"허브 메시 포트"]);
    const pl=mk("text",{x:pdx+10,y:pdy-8,class:"plab"},gd); pl.textContent=ifc; pl.setAttribute("fill",col);
    list.sort((a,b)=>slash32(a.e.allowed).localeCompare(slash32(b.e.allowed),undefined,{numeric:true}));
    list.forEach((s,i)=>{
      const n=N.get(s.oid), y=my+44+i*19;
      const lbl=mk("text",{x:250,y:y+3,class:"bsub","text-anchor":"end"},gd);
      lbl.textContent=((n?n.label:s.oid)||"").slice(0,24);
      const dd=mk("circle",{cx:264,cy:y,r:4.5,fill:col,class:"sdot hot"},gd);
      statusDots.set(s.e.id,dd);
      hot(dd,()=>{const st=stats[s.e.id]||{};return[(n?n.label:s.oid),
        `${slash32(s.e.allowed)} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
      mk("path",{d:`M269,${y} H278`,class:"tun",stroke:col,"stroke-width":1.6},gt);
    });
    const trunk=`M278,${my+44+(list.length-1)*19} V${my+20} H${pdx} V${pdy+6}`;
    const p=mk("path",{d:trunk,class:"tun",stroke:col,"stroke-width":2},gt);
    hot(p,()=>[`${ifc} · 메시 ×${list.length}`,"허브 ↔ 로컬 피어 /32 팬아웃 — 점 hover로 개별 상태"]);
    my+=bh+26;
  }

  // right zones: endpoint rows (nested host boxes) + reachable bands
  const epPos=new Map();
  for(const zg of zoneGeo){
    const bands={list:[],by:new Map()};
    mk("rect",{x:EPX-24,y:zg.y,width:ZONE_R-(EPX-24)-16,height:zg.h,rx:12,class:"zone"},gz);
    mk("text",{x:EPX-8,y:zg.y+22,class:"zlab"},gz).textContent=zg.zk;
    mk("text",{x:BANDX,y:zg.y+22,class:"zsub"},gz).textContent="도달 대역";
    let ry=zg.y+40, laneN=0;
    for(const s of zg.list){
      const n=N.get(s.oid); if(!n)continue;
      const parent=n.parent&&N.get(n.parent);
      let by=ry;
      if(parent){
        mk("rect",{x:EPX-10,y:ry,width:EPW+20,height:ROWH+HOSTPAD,rx:10,class:"hbox"},gn);
        mk("text",{x:EPX+2,y:ry+16,class:"htit"},gn).textContent=(parent.label+(parent.ip?" · "+parent.ip:"")).slice(0,30);
        by=ry+HOSTPAD-8;
      }
      const box=mk("rect",{x:EPX,y:by,width:EPW,height:ROWH-10,rx:8,class:"nbox"+(n.kind==="vm"?" vmb":"")},gn);
      mk("text",{x:EPX+12,y:by+20,class:"ntit"},gn).textContent=n.label.length>23?n.label.slice(0,22)+"…":n.label;
      mk("text",{x:EPX+12,y:by+36,class:"nsub"},gn).textContent=[n.ip,n.tunnelIp].filter(Boolean).join(" · ").slice(0,30);
      if(n.warnings&&n.warnings.length)mk("text",{x:EPX+EPW-10,y:by+16,class:"warnb","text-anchor":"end"},gn).textContent="⚠";
      hot(box,()=>[n.label,`${n.kind}${n.dc?" · "+n.dc:""}${n.observed?" · 관측 "+n.observed:""}${n.warnings?" · "+n.warnings.join("; "):""}`]);
      const cy=by+(ROWH-10)/2;
      epPos.set(s.oid,{inX:EPX,outX:EPX+EPW,rowY:cy});
      if(s.iface&&s.e){
        const col=ifColor(s.iface), port=hubPort.get(s.iface);
        const din=mk("circle",{cx:EPX,cy:cy,r:5.5,fill:col,class:"pdot hot"},gd);
        statusDots.set(s.e.id,din);
        hot(din,()=>{const st=stats[s.e.id]||{};return[`${s.iface} · ${n.label}`,
          `${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} · tx ${fmtRate(st.tx)}${s.back.length?" · 역방향 "+cidrs(s.back[0].allowed).join(","):""}`];});
        if(port){
          const lane=HUBX+HUBW+26+remoteIf.indexOf(s.iface)*16;
          const d=`M${port.x+6},${port.y} H${lane} V${cy} H${EPX-6}`;
          const base=mk("path",{d,class:"tun",stroke:col},gt);
          const fl=mk("path",{d,class:"flow",stroke:col},gf);
          tunnels.push({id:s.e.id,base,fl});
          hot(base,()=>{const st=stats[s.e.id]||{};return[`${s.iface} → ${n.label}`,
            `allowed ${s.e.allowed} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
        }
        const cs=cidrs(s.e.allowed);
        if(cs.length){
          mk("circle",{cx:EPX+EPW,cy:cy,r:5.5,fill:col,class:"pdot"},gd);
          for(const c of cs){
            let b=bands.by.get(c);
            if(!b){b={cidr:c,refs:[]};bands.by.set(c,b);bands.list.push(b);}
            b.refs.push({iface:s.iface,eid:s.e.id,fromX:EPX+EPW,fromY:cy,lane:LANE0+(laneN++%6)*15});
          }
        }
      }
      ry+=(parent?ROWH+HOSTPAD:ROWH)+14;
    }
    let byy=zg.y+40;
    for(const b of bands.list){
      const hgt=Math.max(44,20+b.refs.length*17);
      const r=mk("rect",{x:BANDX,y:byy,width:BANDW,height:hgt,rx:8,class:"nbox band"},gn);
      mk("text",{x:BANDX+14,y:byy+20,class:"btit"},gn).textContent=b.cidr;
      hot(r,()=>[b.cidr,"도달: "+b.refs.map(r=>r.iface).join(", ")]);
      b.refs.forEach((rf,i)=>{
        const dy=byy+15+i*17, col=ifColor(rf.iface);
        mk("circle",{cx:BANDX-12,cy:dy,r:5,fill:col,class:"pdot"},gd);
        const d=`M${rf.fromX+6},${rf.fromY} H${rf.lane} V${dy} H${BANDX-18}`;
        const base=mk("path",{d,class:"tun",stroke:col,"stroke-width":1.9},gt);
        const fl=mk("path",{d,class:"flow",stroke:col},gf);
        tunnels.push({id:rf.eid,base,fl});
        hot(base,()=>{const st=stats[rf.eid]||{};return[`${rf.iface} → ${b.cidr}`,
          `${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
      });
      byy+=hgt+12;
    }
  }

  // second-hop edges: endpoint -> hub-zone node (left chip) or external (dashed chip)
  let hy=my+8;
  for(const e of hops){
    const sp=epPos.get(e.source)||epPos.get(e.target);
    const other=epPos.get(e.source)?e.target:e.source;
    const tn=N.get(other), col=ifColor(e.iface);
    if(!sp||!tn)continue;
    if(tn.kind==="external"){
      const cxx=BANDX+BANDW-170, cy=sp.rowY+30;
      const r=mk("rect",{x:cxx,y:cy-14,width:170,height:30,rx:8,class:"nbox ext"},gn);
      mk("text",{x:cxx+10,y:cy+4,class:"bsub"},gn).textContent=tn.label.slice(0,24);
      hot(r,()=>[tn.label,`외부 endpoint (수집 관측) · allowed ${e.allowed}`]);
      const d=`M${sp.outX+6},${sp.rowY} H${LANE0+96} V${cy} H${cxx-4}`;
      const base=mk("path",{d,class:"tun dash",stroke:col,"stroke-width":1.7},gt);
      hot(base,()=>{const st=stats[e.id]||{};return[`${e.iface} → ${tn.label}`,
        `allowed ${e.allowed} · ${hsLabel(st.hs)} · 문서 미기재 종단`];});
    }else if(zoneKey(tn.dc)===zoneKey(hub.dc)){
      const bw2=200;
      const bx2=mk("rect",{x:64,y:hy,width:bw2,height:52,rx:8,class:"nbox"+(tn.kind==="vm"?" vmb":"")},gn);
      mk("text",{x:76,y:hy+20,class:"ntit"},gn).textContent=tn.label.length>20?tn.label.slice(0,19)+"…":tn.label;
      mk("text",{x:76,y:hy+36,class:"nsub"},gn).textContent=[tn.ip,tn.tunnelIp].filter(Boolean).join(" · ");
      hot(bx2,()=>[tn.label,`${tn.kind}${tn.dc?" · "+tn.dc:""}`]);
      const cy2=hy+26;
      const dd=mk("circle",{cx:64+bw2,cy:cy2,r:5.5,fill:col,class:"pdot hot"},gd);
      statusDots.set(e.id,dd);
      hot(dd,()=>{const st=stats[e.id]||{};return[`${e.iface} · ${tn.label}`,`${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
      mk("circle",{cx:sp.inX,cy:sp.rowY+16,r:5,fill:col,class:"pdot"},gd);
      const d=`M${64+bw2+6},${cy2} H${NATX-28} V${sp.rowY+16} H${sp.inX-6}`;
      const base=mk("path",{d,class:"tun",stroke:col},gt);
      const fl=mk("path",{d,class:"flow",stroke:col},gf);
      tunnels.push({id:e.id,base,fl});
      hot(base,()=>{const st=stats[e.id]||{};return[`${e.iface} ↔ ${tn.label}`,
        `allowed ${e.allowed} · ${hsLabel(st.hs)} · rx ${fmtRate(st.rx)} tx ${fmtRate(st.tx)}`];});
      hy+=66;
    }
  }
  buildLegend(); applyStats();
  // tighten the canvas to what was actually drawn
  try{const bb=svg.getBBox();const H2=Math.min(H,bb.y+bb.height+30);
    svg.setAttribute("viewBox",`0 0 ${W} ${H2}`);
    svg.setAttribute("height",Math.round(drawW*H2/W));}catch(_){}
}

function buildLegend(){
  const ifs=new Set(); (curTopo.edges||[]).forEach(e=>ifs.add(e.iface));
  document.getElementById("legend").innerHTML=[...ifs].sort().map(i=>
    `<span class="i"><span class="dt" style="background:${ifColor(i)}"></span>${esc(i)}</span>`).join("")+
    `<span class="i" style="color:var(--muted)">점=종단/도달 · 꺾쇠=터널 · 이중박스=물리⊃VM · 점선=외부/미상 · 발광=handshake 상태</span>`;
}
function applyStats(){
  for(const t of tunnels){
    const st=stats[t.id];
    if(st&&(st.rx>0||st.tx>0)){
      const r=st.rx+st.tx;
      t.fl.classList.add("on");
      t.fl.style.animationDuration=Math.max(.5,2.6-Math.log10(r+1)*.38)+"s";
      t.base.setAttribute("stroke-width",Math.min(4.6,2+Math.log10(r+1)*.5));
    }else t.fl.classList.remove("on");
  }
  for(const [eid,dot] of statusDots){
    const st=stats[eid]; if(!st)continue;
    const c=cssv("--"+hsState(st.hs));
    dot.setAttribute("stroke",c);
    dot.style.filter=`drop-shadow(0 0 3px ${c})`;
  }
}
function updateMeta(topo,at){
  const zones=new Set(topo.nodes.filter(n=>n.dc).map(n=>zoneKey(n.dc)));
  document.getElementById("meta").textContent=
    `${zones.size} sites · ${topo.nodes.filter(n=>n.kind==="gateway").length} gateways · ${topo.edges.length} tunnels · ${new Date(at*1000).toLocaleTimeString()}`;
}

// ---------- wiring: injected BOOT replay (demo) or live fetch + SSE ----------
if(BOOT){
  render(BOOT.topology);
  const frames=BOOT.frames||[]; let fi=0;
  const ap=()=>{stats=frames.length?frames[fi%frames.length]:{};updateMeta(BOOT.topology,Date.now()/1000);applyStats();fi++;};
  ap(); if(frames.length>1)setInterval(ap,2000);
  document.getElementById("health").textContent="demo replay";
}else{
  fetch("topology").then(r=>r.json()).then(topo=>{
    render(topo);
    const es=new EventSource("events");
    es.onmessage=ev=>{
      const d=JSON.parse(ev.data); stats=d.edges||{};
      updateMeta(topo,d.at); applyStats();
      const errN=Object.keys(d.errors||{}).length, h=document.getElementById("health");
      h.className="health "+(errN?"fail":"ok");
      h.textContent=errN?`${errN} poll failures`:"live polling healthy";
      document.getElementById("errs").textContent=Object.entries(d.errors||{}).map(([k,v])=>`! ${k}: ${v}`).join("\n");
    };
  });
}
</script>
