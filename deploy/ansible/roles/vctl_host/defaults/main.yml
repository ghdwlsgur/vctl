---
# vctl_host role defaults. Override per group in inventory/group_vars or with -e.
vctl_host_state: "{{ state | default('present') }}"

# Distribution service name used by the validated sshd reload handler.
vctl_host_sshd_service: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"

# Release binary (linux/amd64), placed under the playbook's files/ (gitignored).
# Hosts get vctl-agent — the fleet slice (daemons and login hooks) without the
# operator commands. The full CLI never worked on the fleet anyway (the host
# AppRole cannot mint what ssh/list need); shipping only the agent makes that
# a property of the artifact instead of a Vault policy a reviewer has to read.
#   ./stage-release.sh vX.Y.Z   # (playbook dir) downloads, verifies, stages, prints the -e sha
vctl_host_bin_src: "{{ vctl_bin_src | default(playbook_dir + '/files/vctl-agent') }}"
vctl_host_bin_dest: "{{ vctl_bin_dest | default('/usr/local/bin/vctl-agent') }}"
# SHA-256 of the extracted release binary after its archive has been verified
# against checksums.txt. A compromised control-node staging file must not
# silently replace the fleet binary.
vctl_host_bin_sha256: "{{ vctl_bin_sha256 | default('') }}"
vctl_host_require_binary_checksum: "{{ require_binary_checksum | default(true) }}"

# Daemon scope.
#   vctl_host_install_collect=false installs the collector unit but does NOT enable it (it
#   needs Tetragon) — use for a Tetragon-free rollout of node-agent + watch.
vctl_host_install_collect: "{{ install_collect | default(true) }}"
vctl_host_enable_services: "{{ enable_services | default(true) }}"

# Login banner rendered by node-agent from the inventory's farm topology
# (replaces the hand-maintained /etc/motd, which went stale). Opt-in per group;
# hosts that belong to no OpenStack farm are left untouched even when enabled,
# so turning it on for a whole site cannot claim an unrelated banner.
vctl_host_motd: "{{ motd_banner | default(false) }}"
vctl_host_motd_path: "{{ motd_path | default('/etc/motd') }}"

# vctl_host_audit_stack=true (explicit opt-in): full stack — collector/watch-sessions (DB write) +
#   node-agent -> uses the vctl-host AppRole (audit ingest + vctl-status).
# vctl_host_audit_stack=false: node-agent ONLY (status heartbeat, no DB write) → uses the
#   least-privilege vctl-node AppRole (vctl-status only); watch/collect are not
#   enabled. This is the fleet-safe default; opt in to audit per canary/group.
vctl_host_audit_stack: "{{ audit_stack | default(false) }}"
# Derived: which AppRole the host authenticates with (least privilege per scope).
vctl_host_approle: >-
  {{ vctl_approle | default('vctl-host' if vctl_host_audit_stack | bool else 'vctl-node') }}

# Per-host AppRole secret_id is minted from the control node's Vault token.
vctl_host_provision_secret_id: "{{ provision_secret_id | default(true) }}"
# Refuse to onboard the audit stack onto a host whose clock is not NTP-synced.
# Session start times come from the host's clock (see tasks/main.yml), so an
# undisciplined clock silently writes audit records for times that never happened.
# Set false to onboard anyway — the check then only warns.
vctl_host_require_time_sync: "{{ require_time_sync | default(true) }}"

# Rotation, not expiry. The AppRoles carry secret_id_ttl=0 since 2026-07-29, so
# nothing dies on a deadline any more — a 30-day TTL silently stranded the fleet
# twice, because Vault does not announce the expiry and the daemons kept looking
# healthy while logging 403 (vault-iac !59). Rotating on a successful play is now
# hygiene: it bounds how long any one leaked secret_id stays usable, and skipping
# a cycle costs nothing.
vctl_host_secret_rotation_days: 21

# Tetragon (kernel-event source for the collector). Bare VMs: systemd install
# here. k8s nodes: set vctl_host_install_tetragon=false and run a DaemonSet instead.
#
# Defaults to the audit stack rather than to true. Only vctl-collect consumes
# Tetragon, and collect only runs with vctl_host_audit_stack — so the old default
# meant a plain `ansible-playbook site.yml` downloaded and enabled Tetragon on
# every node-only host in the fleet, for a collector that was never going to
# start. Opt in with the audit stack, or set this explicitly.
vctl_host_install_tetragon: "{{ install_tetragon | default(vctl_host_audit_stack) }}"
vctl_host_tetragon_version: "{{ tetragon_version | default('v1.1.2') }}"
vctl_host_tetragon_arch_map:
  x86_64: amd64
  aarch64: arm64
vctl_host_tetragon_arch: "{{ vctl_host_tetragon_arch_map.get(ansible_architecture, '') }}"
vctl_host_tetragon_archive: "tetragon-{{ vctl_host_tetragon_version }}-{{ vctl_host_tetragon_arch }}.tar.gz"
vctl_host_tetragon_url: >-
  {{ tetragon_url | default('https://github.com/cilium/tetragon/releases/download/' +
     vctl_host_tetragon_version + '/' + vctl_host_tetragon_archive) }}
# Pin the release digest per version (e.g. "sha256:…"). Empty = no verification
# (acceptable only for the public HTTPS URL; set before fronting an internal mirror).
vctl_host_tetragon_sha256: "{{ tetragon_sha256 | default('') }}"

# Fleet rollout and post-start health gate.
vctl_host_health_retries: "{{ health_retries | default(6) }}"
vctl_host_health_delay: "{{ health_delay | default(5) }}"

# Verbose SRE tracingpolicy (security_file_open + tcp_connect for a narrow command
# set) is high-volume — opt-in, "canary only". When false, exec/exit still flow
# from Tetragon's base sensor (no policy needed); the verbose policy is removed.
vctl_host_install_verbose_tracingpolicy: "{{ install_verbose_tracingpolicy | default(false) }}"

# REQUIRED (no default — internal IPs are not baked into the repo): the LB that
# fronts *.sre.local for this host's network. Set per group in group_vars or with
# -e vctl_host_sre_lb_ip=<ip>. Asserted non-empty before use.
vctl_host_sre_lb_ip: "{{ sre_lb_ip | default('') }}"

# Vault and Postgres may sit behind different LBs on some networks (e.g. incheon
# reaches Vault via the local ingress but Postgres via a WireGuard-gateway proxy).
# Both default to vctl_host_sre_lb_ip, so single-LB networks (seoul) need only vctl_host_sre_lb_ip.
# Override per group when the two endpoints differ.
vctl_host_vault_lb_ip: "{{ vault_lb_ip | default(vctl_host_sre_lb_ip) }}"
vctl_host_pg_lb_ip: "{{ pg_lb_ip | default(vctl_host_sre_lb_ip) }}"

# Inventory hostname the node-agent reports under. Defaults to the Ansible
# inventory_hostname; override per host when the vctl inventory name can't be an
# Ansible alias (e.g. tenant-prefixed "[admin]-wireguard-gw-incheon").
vctl_host_node_hostname: "{{ vctl_node_hostname | default(inventory_hostname) }}"

# Canonical unit/script sources live in deploy/audit and deploy/node (one source
# of truth — not duplicated into the role).
vctl_host_audit_src: "{{ vctl_audit_src | default(playbook_dir + '/../audit') }}"
vctl_host_node_src: "{{ vctl_node_src | default(playbook_dir + '/../node') }}"

vctl_host_services: >-
  {{ ['vctl-node-agent'] +
     ((['vctl-watch-sessions'] +
       (['vctl-collect'] if vctl_host_install_collect | bool else []))
      if vctl_host_audit_stack | bool else []) }}

# OpenStack 팜 membership reconciler. 팜당 컨트롤러 한 대에만 opt-in 으로 깐다.
#
# 플래그의 정본은 인벤토리다: hosts.ini 의 해당 호스트 줄에
# openstack_reconciler=true 를 박는다. -e 로 주는 것은 일회성 실험에만 —
# -e 에만 의존하면 플래그 없는 함대 런이 reconciler 를 스킵해서 stale 상태로
# 남긴다 (2026-08-25 에 그렇게 두 번 깨졌다). 플래그가 꺼진 호스트에서 잔재가
# 발견되면 present.yml 이 걷어낸다 (reconciler_absent.yml).
#
# 중앙에서 돌리는 것이 먼저였고 성립하지 않았다 — 각 팜의 Keystone VIP 는 그 팜
# 안에서만 도달한다. node-agent 와 자격증명을 나누는 이유는 vctl-node AppRole 이
# 함대 43대의 공유 자격이기 때문이다: 거기에 OpenStack admin 읽기를 얹으면 모든
# 호스트가 그 능력을 갖는다.
vctl_host_openstack_reconciler: "{{ openstack_reconciler | default(false) }}"
vctl_host_reconciler_approle: "{{ reconciler_approle | default('vctl-reconciler') }}"
