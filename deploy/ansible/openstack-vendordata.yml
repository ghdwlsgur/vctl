---
# Install the vctl SSH CA into an OpenStack farm's Nova vendordata, so a VM
# trusts vctl-signed certificates from its first boot.
#
# This is the VM-side half of onboarding. The other half is already elsewhere:
#   - registering the VM in the vctl inventory is the Nova sync's job
#   - trusting the CA on an *existing* server is trust-vault-ssh-ca.yml
# and this play is the same trust, delivered by cloud-init instead of by SSH.
#
# What is the source of truth for what
# -----------------------------------
#   CA public key value        Vault, `<mount>/config/ca`. Read at run time, the
#                              same key `vctl trust-ca` installs. Never in git.
#   The vendordata document    This repo (templates/vendordata-cloud-config.yml.j2).
#   /etc/kolla/config/...      Kolla's node_custom_config — written by this play,
#                              on the *deploy* host, from the two above.
#   /etc/kolla/nova-*/...      Deployment artifacts. Kolla owns them. This play
#                              touches them only to work around the gap below.
#
# Why this is not just "drop a file in node_custom_config"
# --------------------------------------------------------
# A VM asking 169.254.169.254 for vendor_data.json is proxied by the neutron
# metadata agent to port 8775. WHICH service holds that port is not the same on
# every farm, and putting the config on the other one looks like it worked:
# measured on a farm where the file had been in place for a month,
# vendor_data.json returned {} while meta_data.json returned real data for the
# same signed request, and nothing reported it.
#
# So the play derives the answering service instead of assuming it, and where the
# file has to land depends on the kolla-ansible version doing the deploy. All of
# the below is measured on the deploy hosts here, not read from release notes:
#
#   17.3.1, 18.1.0,   No nova-metadata in nova_services at all. nova-api serves
#   18.8.0            both APIs — one apache vhost on 8774, another on 8775 — and
#                     kolla copies the vendordata file to nova-api. Copy target
#                     and answering service agree, so nothing special is needed.
#                     Restarting it takes the compute API with it, though.
#   20.2.0            nova-metadata is its own service and answers 8775, but the
#                     copy destination is still hardcoded to nova-api, while
#                     nova-metadata.json.j2 declares a mount for the file that is
#                     NOT marked optional. kolla_set_configs raises
#                     MissingRequiredSource on a non-optional missing source, so
#                     once the file exists in node_custom_config a plain
#                     reconfigure leaves nova_metadata unable to start.
#   20.4.0            fixed upstream: the copy loops over nova-metadata and
#                     nova-api. Nothing here is needed for the copy itself.
#
# One farm also had a 2024.1 venv sitting next to a 2025.1 one and reconfigured
# from the older: 18.8.0 does not know nova-metadata exists, so that directory
# sat a month behind nova-api's with nobody noticing. Check which venv the last
# run used before assuming a farm's config is current.
#
# So this play places the file in every Nova service directory whose config.json
# declares it, and refuses to remove it while a config.json still does. On 20.4.0
# that is a no-op the second time; on 20.2.0 it is the difference between a
# working metadata service and one that will not start.
#
# Usage
# -----
#   # one farm, deploy host and control hosts (often the same machine)
#   ansible-playbook -i inventory.ini openstack-vendordata.yml -l lab_a
#
#   # control node without Vault access
#   ansible-playbook -i inventory.ini openstack-vendordata.yml \
#       -e vendordata_ca_pub_file=files/vault-ca.pub
#
#   # rollback (removes the source of truth; see the note the play prints)
#   ansible-playbook -i inventory.ini openstack-vendordata.yml -e state=absent
#
# Inventory groups:
#   openstack_deploy   the host kolla-ansible runs from, per farm (node_custom_config)
#   openstack_control  hosts running the nova-metadata / nova-api containers
# On an all-in-one farm the same host is in both.

- name: Write the Nova vendordata source of truth
  hosts: openstack_deploy
  become: true
  gather_facts: false
  vars:
    state: present
    vendordata_ca_pub_file: ""
    vendordata_vault_ssh_mount: ssh
    vendordata_node_custom_config: /etc/kolla/config
  pre_tasks:
    - name: Render the vendordata document
      when: state == 'present'
      ansible.builtin.include_tasks: tasks/vendordata-render.yml
  tasks:
    - name: Ensure the Nova custom-config directory exists
      when: state == 'present'
      ansible.builtin.file:
        path: "{{ vendordata_node_custom_config }}/nova"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the vendordata source of truth
      # 0644, not 0600: kolla's merge_configs and copy steps run as a non-root
      # user, and a file they cannot read is skipped without failing the run.
      when: state == 'present'
      ansible.builtin.copy:
        dest: "{{ vendordata_node_custom_config }}/nova/vendordata.json"
        content: "{{ vendordata_json }}\n"
        owner: root
        group: root
        mode: "0644"
      register: vendordata_sot

    - name: Say what has to happen next
      when:
        - state == 'present'
        - vendordata_sot.changed
      ansible.builtin.debug:
        msg: >-
          Source of truth updated. Nova will not pick it up until its config is
          regenerated. Review first, then apply:
          `kolla-ansible genconfig -t nova --limit {{ inventory_hostname }}`
          (diff the result against a backup before deploying), then re-run this
          play so the deployed copies land, then restart the service that answers
          metadata — the second play names it for this farm.

    # --- rollback ---
    - name: Remove the vendordata source of truth (rollback)
      when: state == 'absent'
      ansible.builtin.file:
        path: "{{ vendordata_node_custom_config }}/nova/vendordata.json"
        state: absent
      register: vendordata_sot_removed

    - name: Say what rollback still needs
      when:
        - state == 'absent'
        - vendordata_sot_removed.changed
      ansible.builtin.debug:
        msg: >-
          Source of truth removed. The deployed config.json files still declare
          the mount, so the metadata service will fail to start if restarted now.
          Run `kolla-ansible genconfig -t nova` to drop the mount, then re-run
          this play with state=absent to clear the deployed copies.

- name: Place the vendordata where Kolla declares it but does not copy it
  hosts: openstack_control
  become: true
  gather_facts: false
  vars:
    state: present
    vendordata_ca_pub_file: ""
    vendordata_vault_ssh_mount: ssh
    # Service directories to write even though their config.json does not name
    # the file yet. This is how a farm is onboarded without a window: genconfig
    # is what makes the service declare the mount, and between that moment and
    # the next run of this play the deployed config names a file that is not
    # there — a restart in that gap leaves the container unable to start. Pre-
    # placing closes the gap, and genconfig never touches the file itself. The
    # play prints the right directory for this farm.
    #   -e '{"vendordata_extra_dirs":["/etc/kolla/nova-metadata"]}'
    vendordata_extra_dirs: []
    # Restarting the metadata service is what makes a new file take effect. How
    # expensive that is depends on the farm: where nova-metadata is its own
    # service it is a brief metadata blip, but on releases that serve metadata
    # from nova-api it takes the compute API with it. Set false to stage now and
    # restart in a window — the common shape of this work on a live farm.
    vendordata_restart: true
  pre_tasks:
    - name: Render the vendordata document
      when: state == 'present'
      ansible.builtin.include_tasks: tasks/vendordata-render.yml
  tasks:
    - name: Find Nova service directories that declare a vendordata mount
      # The declaration is the authority, not a list of service names: which Nova
      # services exist differs by farm and by release, and a hardcoded list is
      # exactly how the original change ended up on the wrong one.
      ansible.builtin.shell: |
        set -o pipefail
        grep -l 'vendordata\.json' /etc/kolla/nova-*/config.json 2>/dev/null |
          xargs -r -n1 dirname
      args:
        executable: /bin/bash
      register: vendordata_declared
      changed_when: false
      failed_when: false
      # Discovery, not a change. --check needs the answer to say anything useful.
      check_mode: false

    - name: Find which Nova services this host actually deploys
      ansible.builtin.find:
        paths: /etc/kolla
        patterns: "nova-*"
        file_type: directory
      register: vendordata_nova_dirs
      changed_when: false
      check_mode: false

    - name: Name the service that answers instance metadata here
      # Not always nova-metadata. Releases before the api/metadata split serve
      # both from nova-api — one apache config with a vhost on 8774 and another
      # on 8775 — and on those farms nova-metadata does not exist at all.
      # Measured: 17.3.1, 18.1.0 and 18.8.0 have no nova-metadata in
      # nova_services; 20.2.0 and 20.4.0 do. Guessing wrong here is the whole
      # bug this play exists to fix, so it is derived, never assumed.
      ansible.builtin.set_fact:
        vendordata_metadata_dir: >-
          {{ '/etc/kolla/nova-metadata'
             if '/etc/kolla/nova-metadata' in (vendordata_nova_dirs.files | map(attribute='path') | list)
             else '/etc/kolla/nova-api' }}

    - name: Name the container that serves it
      ansible.builtin.set_fact:
        # Kolla names containers with underscores where the config directory uses
        # hyphens: nova-metadata -> nova_metadata.
        vendordata_metadata_container: "{{ vendordata_metadata_dir | basename | replace('-', '_') }}"

    - name: Report that metadata is still served without vendordata
      when:
        - state == 'present'
        - vendordata_metadata_dir not in (vendordata_declared.stdout_lines | default([]))
      ansible.builtin.debug:
        msg: >-
          {{ vendordata_metadata_container }} on {{ inventory_hostname }} is what
          answers instance metadata here, and it does not declare the vendordata
          mount yet — so vendor_data.json is still {}. Place the file first with
          -e '{"vendordata_extra_dirs":["{{ vendordata_metadata_dir }}"]}', then
          `kolla-ansible genconfig -t nova --limit {{ inventory_hostname }}` on the
          deploy host, then restart {{ vendordata_metadata_container }}. In that
          order there is no moment when the deployed config names a file that is
          not there.
          {{ 'Note: this container also serves the compute API, so restarting it
          is more than a metadata blip.' if vendordata_metadata_container == 'nova_api' else '' }}

    - name: Install the vendordata into each declaring service directory
      # Matching Kolla's own mode and owner for this file (0660 root:root) so a
      # later reconfigure sees no difference and this play stays idempotent.
      when: state == 'present'
      ansible.builtin.copy:
        dest: "{{ item }}/vendordata.json"
        content: "{{ vendordata_json }}\n"
        owner: root
        group: root
        mode: "0660"
      loop: "{{ (vendordata_declared.stdout_lines | default([])) | union(vendordata_extra_dirs) }}"
      notify: Restart the metadata service

    - name: Remove deployed copies that are no longer declared (rollback)
      # Only where the declaration is already gone. Removing a file a config.json
      # still names is what breaks the container, so rollback cannot run ahead of
      # the genconfig that drops the mount.
      when: state == 'absent'
      ansible.builtin.file:
        path: "{{ item }}/vendordata.json"
        state: absent
      loop: >-
        {{ ['/etc/kolla/nova-api', '/etc/kolla/nova-metadata', '/etc/kolla/nova-compute']
           | difference(vendordata_declared.stdout_lines | default([])) }}
      notify: Restart the metadata service

  post_tasks:
    - name: Detect the container engine
      ansible.builtin.shell: |
        command -v podman >/dev/null 2>&1 && echo podman && exit 0
        command -v docker >/dev/null 2>&1 && echo docker && exit 0
        echo none
      args:
        executable: /bin/bash
      register: vendordata_cli
      changed_when: false
      check_mode: false

    - name: Verify the metadata service can actually read the vendordata
      # The check that the original change lacked. A non-empty file at the path
      # nova was told to read is the difference between this working and looking
      # like it works.
      when:
        - state == 'present'
        - vendordata_cli.stdout != 'none'
        - vendordata_metadata_dir in (vendordata_declared.stdout_lines | default([]))
      ansible.builtin.command:
        argv:
          - "{{ vendordata_cli.stdout }}"
          - exec
          - "{{ vendordata_metadata_container }}"
          - test
          - "-s"
          - /etc/nova/vendordata.json"
      register: vendordata_readable
      changed_when: false
      failed_when: false

    - name: Report a metadata service that still cannot read it
      when:
        - state == 'present'
        - vendordata_readable is defined
        - vendordata_readable.rc is defined
        - vendordata_readable.rc != 0
      ansible.builtin.debug:
        msg: >-
          {{ vendordata_metadata_container }} on {{ inventory_hostname }} cannot read
          /etc/nova/vendordata.json. The container has not picked up the new
          config yet — restart it (stop then start, not restart) and re-run.

  handlers:
    - name: Restart the metadata service
      # stop then start, never restart: repeated podman restart degrades the
      # engine's responsiveness badly enough to look like a host fault.
      when: vendordata_restart | bool
      ansible.builtin.shell: |
        set -e -o pipefail
        CLI=$(command -v podman || command -v docker || true)
        [ -n "$CLI" ] || { echo "no container engine"; exit 0; }
        C={{ vendordata_metadata_container }}
        "$CLI" ps -a --format '{{ "{{.Names}}" }}' | grep -qx "$C" || exit 0
        "$CLI" stop "$C"
        "$CLI" start "$C"
      args:
        executable: /bin/bash
      changed_when: true
