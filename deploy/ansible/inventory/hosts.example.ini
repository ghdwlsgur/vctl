# Example inventory. Copy to hosts.ini (gitignored) and fill with real hosts.
# ansible inventory_hostname MUST equal the vctl inventory hostname (node-agent
# reports under it). IPs below are documentation-only (RFC 5737) — not real.

[seoul_onprem]
sre-srv-0001 ansible_host=192.0.2.11
sre-srv-0002 ansible_host=192.0.2.12

[incheon_onprem]
incheon-gpu01 ansible_host=198.51.100.14

# OpenStack farms, for openstack-vendordata.yml only. One deploy host per farm
# (it owns /etc/kolla/config), plus every host running nova-metadata/nova-api.
# On an all-in-one farm the same machine belongs to both groups.
[openstack_deploy]
sre-srv-0001

[openstack_control]
sre-srv-0001

# Example for VM agent DynamicJSON enrollment. Use exactly one Kolla config
# source host per active farm. Replace the documentation IP with that farm's
# real Kolla deploy host; the endpoint below is the Keystone deployment ID from
# `vctl openstack farm list`, not the Horizon URL.
#[openstack_deploy]
#ai_native ansible_host=192.0.2.21 openstack_deployment_id=172.16.0.150:5000
#hybrid_0026 ansible_host=192.0.2.22 openstack_deployment_id=172.16.0.111:5000
#hybrid_epoxy ansible_host=192.0.2.23 openstack_deployment_id=172.17.0.115:5000
#incheon_main ansible_host=192.0.2.24 openstack_deployment_id=172.16.0.10:5000
#infra_epoxy ansible_host=192.0.2.25 openstack_deployment_id=172.16.0.245:5000
#infra_gazpacho ansible_host=192.0.2.26 openstack_deployment_id=172.17.0.87:5000
#posco_infra_dev ansible_host=192.0.2.27 openstack_deployment_id=172.16.0.21:5000
#sre_0047 ansible_host=192.0.2.28 openstack_deployment_id=192.168.201.130:5000
#sre_0048 ansible_host=192.0.2.29 openstack_deployment_id=192.168.201.90:5000
# The play reads nova_keystone_password from /etc/kolla/passwords.yml on this
# deploy host. Add one entry per active farm; omit farms whose inventory state
# is retired. Keep the actual host mapping in ignored hosts.ini.

[seoul_onprem:vars]
ansible_user=root
# LB fronting *.sre.local for this network (kept out of the repo — set the real IP here).
vctl_host_sre_lb_ip=192.0.2.1

[incheon_onprem:vars]
ansible_user=root
vctl_host_sre_lb_ip=198.51.100.1
# bare-metal GPU nodes: systemd Tetragon ok; k8s nodes -> vctl_host_install_tetragon=false + DaemonSet

[all:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
