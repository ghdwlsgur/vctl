---
# Onboard hosts to node-agent by default; the audit stack is explicit opt-in.
# See README.md. Needs a control-node Vault token (mints the per-host secret_id).
#
#   ansible-playbook site.yml -l <canary>
#   ansible-playbook site.yml -l seoul_onprem -e vctl_host_sre_lb_ip=<lb>
#   ansible-playbook site.yml -l <canary> -e vctl_host_audit_stack=true   # + collector/watch (pulls in Tetragon)
#   ansible-playbook site.yml -l <host> -e vctl_host_state=absent         # rollback
#
# The default run installs node-agent only and does not touch Tetragon. Nothing
# needs to be turned off to get that — vctl_host_install_tetragon follows
# vctl_host_audit_stack.
- name: Onboard vctl node status stack (audit is explicit opt-in)
  hosts: all
  # A bad binary or credential rotation must stop in a small batch instead of
  # restarting the entire SRE fleet simultaneously.
  serial: "{{ vctl_rollout_serial | default('20%') }}"
  max_fail_percentage: 0
  become: true
  gather_facts: true
  roles:
    - vctl_host
