---
# Make existing fleet hosts trust certificates signed by the Vault SSH CA
# (TrustedUserCAKeys). This is the already-running-server counterpart to the
# cloud-init a new VM gets from Nova vendordata (openstack-vendordata.yml). The
# two install the same CA at the same paths on purpose, so a hand-onboarded host
# and a freshly built VM end up in the same state.
#
# Idempotent, and safe to re-run:
#   - Only the CA *public* key is distributed; it is not a secret.
#   - Existing authorized_keys access is left in place as the recovery path. Do
#     not remove it here — losing CA trust would otherwise lock the host out.
#   - The drop-in is installed system-wide, and sshd is reloaded only after
#     'sshd -t' validates the resulting config.
#
# Usage:
#   ansible-playbook -i inventory.ini trust-vault-ssh-ca.yml            # whole fleet
#   ansible-playbook -i inventory.ini trust-vault-ssh-ca.yml -l <host>  # one host first
#   Roll back with: --extra-vars "state=absent"
- name: Trust Vault SSH CA on existing fleet
  hosts: all
  become: true
  gather_facts: true
  vars:
    ca_pub_src: files/vault-ca.pub
    ca_pub_dest: /etc/ssh/vault-ca.pub
    ca_dropin_dest: /etc/ssh/sshd_config.d/10-vault-ca.conf
    state: present # set to absent to roll back
  tasks:
    - name: Install Vault SSH CA public key
      when: state == 'present'
      ansible.builtin.copy:
        src: "{{ ca_pub_src }}"
        dest: "{{ ca_pub_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sshd

    - name: Ensure sshd drop-in directory exists
      when: state == 'present'
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install system-wide TrustedUserCAKeys drop-in
      when: state == 'present'
      ansible.builtin.copy:
        dest: "{{ ca_dropin_dest }}"
        content: "TrustedUserCAKeys {{ ca_pub_dest }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sshd

    - name: Validate merged sshd configuration
      when: state == 'present'
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Remove legacy TrustedUserCAKeys directives from main config
      when: state == 'present'
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^\s*TrustedUserCAKeys\s+'
        state: absent
        validate: "sshd -t -f %s"
      notify: Reload sshd

    # --- rollback ---
    - name: Remove TrustedUserCAKeys drop-in (rollback)
      when: state == 'absent'
      ansible.builtin.file:
        path: "{{ ca_dropin_dest }}"
        state: absent
      notify: Reload sshd

    - name: Remove Vault SSH CA public key (rollback)
      when: state == 'absent'
      ansible.builtin.file:
        path: "{{ ca_pub_dest }}"
        state: absent

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_os_family == 'RedHat' else 'ssh' }}"
        state: reloaded
