---
# Stop kolla's nova mounts from doubling on every nova container start,
# without hiding any NFS from nova.
#
# Why they double
# ---------------
# systemd puts / in one shared peer group. kolla starts nova_compute,
# nova_libvirt and nova_ssh with
#     -v nova_compute:/var/lib/nova  -v /var/lib/nova/mnt:/var/lib/nova/mnt:shared
# The second mount lands inside the first, which is a peer of the host's copy
# of the volume, so it propagates back to <volume>/_data/mnt on the host, and
# the next container start copies it again: /var/lib/nova/mnt doubles per
# start until a reboot (1023 layers on sre-srv-0035 after 94 days, 2026-10-19).
#
# The fix, and why it is boot-only
# --------------------------------
# Make only <volume>/_data/mnt a private self-bind, before docker starts. The
# :shared bind then has a private parent and stops propagating back, while
#   - the instances NFS under <volume>/_data/instances (fstab) and
#   - the cinder shares under /var/lib/nova/mnt (os-brick)
# keep reaching the host and every nova container. Verified by path walk in a
# docker:dind reproduction: layers stay at 2 through compute/ssh/libvirt
# restarts, a share mounted by nova_compute reaches libvirt and ssh, and the
# instances NFS and a cinder share remounted on the host reach running
# containers.
#
# Applied while nova containers run, the same bind propagates over
# /var/lib/nova/mnt inside them and hides the cinder shares — reproduced, and
# the same class of failure as the 2026-10-20 incident, when a non-recursive
# private bind of the whole volume hid the instances NFS. So this play only
# installs and enables nova-mnt-private.service (ordered before docker.service);
# it never starts it, and the script refuses while any container runs. It takes
# effect at the host's next reboot.
#
# Layers that already stacked can be collapsed now, with every VM left running
# (kolla/nova-mnt-collapse.sh, opt-in):
#
#   ansible-playbook kolla-nova-mount-propagation.yml -l <host> --check --diff
#   ansible-playbook kolla-nova-mount-propagation.yml -l <host>
#   ansible-playbook kolla-nova-mount-propagation.yml -l <host> -e nova_mnt_collapse=true
#
# Hosts without a docker nova_compute volume (podman, no nova) are skipped.

- name: Keep kolla's nova /var/lib/nova/mnt bind from stacking
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars:
    nova_mnt_collapse: false
  tasks:
    - name: Find docker's data root
      ansible.builtin.command:
        argv: [docker, info, -f, "{{ '{{' }}.DockerRootDir{{ '}}' }}"]
      register: nova_docker_root
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Look for the nova_compute volume
      when: nova_docker_root.rc == 0
      ansible.builtin.stat:
        path: "{{ nova_docker_root.stdout }}/volumes/nova_compute/_data"
      register: nova_volume

    - name: Skip hosts without a docker nova_compute volume
      when: nova_docker_root.rc != 0 or not (nova_volume.stat.isdir | default(false))
      ansible.builtin.meta: end_host

    - name: Find the 2026-10-19 private bind unit, which must not come back
      ansible.builtin.command:
        argv: [systemd-escape, -p, --suffix=mount, "{{ nova_volume.stat.path }}"]
      register: nova_old_unit
      changed_when: false
      check_mode: false

    - name: Remove that unit if it is still installed
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ nova_old_unit.stdout }}"
        state: absent
      register: nova_old_unit_removed

    - name: Count /var/lib/nova/mnt layers in the host namespace
      ansible.builtin.shell: |
        set -o pipefail
        awk '$5=="/var/lib/nova/mnt"' /proc/self/mountinfo | wc -l
      args:
        executable: /bin/bash
      register: nova_layers
      changed_when: false
      check_mode: false

    - name: Collapse the stacked layers (opt-in)
      when:
        - nova_layers.stdout | int > 1
        - nova_mnt_collapse | bool
      ansible.builtin.script: kolla/nova-mnt-collapse.sh
      register: nova_collapse

    - name: Show what the collapse did
      when: nova_collapse.stdout_lines is defined
      ansible.builtin.debug:
        var: nova_collapse.stdout_lines

    - name: Install the boot-time script
      ansible.builtin.copy:
        src: kolla/nova-mnt-private.sh
        dest: /usr/local/sbin/nova-mnt-private
        owner: root
        group: root
        mode: "0755"

    - name: Install the boot-time unit
      ansible.builtin.copy:
        src: kolla/nova-mnt-private.service
        dest: /etc/systemd/system/nova-mnt-private.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable it for the next boot (never started here)
      when: not ansible_check_mode
      ansible.builtin.systemd:
        name: nova-mnt-private.service
        enabled: true
        daemon_reload: true

    - name: Say when it takes effect
      ansible.builtin.debug:
        msg: >-
          nova-mnt-private.service is enabled on {{ inventory_hostname }} and
          applies at the next reboot, before docker starts. Until then
          /var/lib/nova/mnt still grows by one doubling per nova container
          start ({{ nova_layers.stdout }} layer(s) on the host now).
