---
# Stop kolla's nova mounts from doubling on every nova container start,
# without hiding any NFS from nova.
#
# Why they double
# ---------------
# systemd puts / in one shared peer group. kolla starts nova_compute,
# nova_libvirt and nova_ssh with
#     -v nova_compute:/var/lib/nova  -v /var/lib/nova/mnt:/var/lib/nova/mnt:shared
# The second mount lands inside the first, which is a peer of the host's copy
# of the volume, so it propagates back to <volume>/_data/mnt on the host, and
# the next container start copies it again: /var/lib/nova/mnt doubles per
# start until a reboot (1023 layers on sre-srv-0035 after 94 days, 2026-10-19).
#
# The fix
# -------
# Make only <volume>/_data/mnt a private mount. The :shared bind then has a
# private parent and stops propagating back, while
#   - the instances NFS under <volume>/_data/instances (fstab) and
#   - the cinder shares under /var/lib/nova/mnt (os-brick)
# keep reaching the host and every nova container. Verified by path walk in a
# docker:dind reproduction: layers stay at 2 through compute/ssh/libvirt
# restarts, a share mounted by nova_compute reaches libvirt and ssh, and the
# instances NFS and a cinder share remounted on the host reach running
# containers.
#
# A NEW mount there while nova containers run propagates over /var/lib/nova/mnt
# inside them and hides the cinder shares — reproduced, and the same class of
# failure as the 2026-10-20 incident, when a non-recursive private bind of the
# whole volume hid the instances NFS. nova-mnt-private.service (ordered before
# docker.service) therefore makes the new bind only at boot. On a running host
# it does one thing: when the collapse has left exactly one mount at
# <volume>/_data/mnt, it changes that mount's propagation to private, which
# creates no mount and moves nothing in the running containers. With more than
# one layer it refuses.
#
# So, with every VM left running:
#
#   ansible-playbook kolla-nova-mount-propagation.yml -l <host> --check --diff
#   ansible-playbook kolla-nova-mount-propagation.yml -l <host>    # install, boot-only
#   ansible-playbook kolla-nova-mount-propagation.yml -l <host> -e nova_mnt_collapse=true
#
# The last one collapses the stacked layers (kolla/nova-mnt-collapse.sh) and
# then runs nova-mnt-private.service once, which makes the fix take effect now.
# Reproduced from the ten SRE VM hosts' state of 2026-10-20 (host 1 layer,
# <volume>/_data/mnt 2, every container 2) with the real scripts.
#
# Hosts without a docker nova_compute volume (podman, no nova) are skipped.

- name: Keep kolla's nova /var/lib/nova/mnt bind from stacking
  hosts: "{{ target | default('all') }}"
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars:
    nova_mnt_collapse: false
  tasks:
    - name: Find docker's data root
      ansible.builtin.command:
        argv: [docker, info, -f, "{{ '{{' }}.DockerRootDir{{ '}}' }}"]
      register: nova_docker_root
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Look for the nova_compute volume
      when: nova_docker_root.rc == 0
      ansible.builtin.stat:
        path: "{{ nova_docker_root.stdout }}/volumes/nova_compute/_data"
      register: nova_volume

    - name: Skip hosts without a docker nova_compute volume
      when: nova_docker_root.rc != 0 or not (nova_volume.stat.isdir | default(false))
      ansible.builtin.meta: end_host

    - name: Find the 2026-10-19 private bind unit, which must not come back
      ansible.builtin.command:
        argv: [systemd-escape, -p, --suffix=mount, "{{ nova_volume.stat.path }}"]
      register: nova_old_unit
      changed_when: false
      check_mode: false

    - name: Remove that unit if it is still installed
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ nova_old_unit.stdout }}"
        state: absent
      register: nova_old_unit_removed

    - name: Count /var/lib/nova/mnt layers in nova_libvirt and at <volume>/_data/mnt
      ansible.builtin.shell: |
        set -o pipefail
        pid=$(docker inspect -f '{{ '{{' }}.State.Pid{{ '}}' }}' nova_libvirt 2>/dev/null || echo self)
        echo "$(awk '$5=="/var/lib/nova/mnt"' /proc/$pid/mountinfo | wc -l)" \
             "$(awk -v p='{{ nova_volume.stat.path }}/mnt' '$5==p' /proc/self/mountinfo | wc -l)"
      args:
        executable: /bin/bash
      register: nova_layers
      changed_when: false
      check_mode: false

    - name: Collapse the stacked layers (opt-in)
      when:
        - nova_layers.stdout.split()[0] | int > 1
        - nova_mnt_collapse | bool
      ansible.builtin.script: kolla/nova-mnt-collapse.sh
      register: nova_collapse

    - name: Show what the collapse did
      when: nova_collapse.stdout_lines is defined
      ansible.builtin.debug:
        var: nova_collapse.stdout_lines

    - name: Install the boot-time script
      ansible.builtin.copy:
        src: kolla/nova-mnt-private.sh
        dest: /usr/local/sbin/nova-mnt-private
        owner: root
        group: root
        mode: "0755"

    - name: Install the boot-time unit
      ansible.builtin.copy:
        src: kolla/nova-mnt-private.service
        dest: /etc/systemd/system/nova-mnt-private.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable it for the next boot
      when: not ansible_check_mode
      ansible.builtin.systemd:
        name: nova-mnt-private.service
        enabled: true
        daemon_reload: true

    - name: Apply it now, on the one mount the collapse left (opt-in)
      when:
        - nova_mnt_collapse | bool
        - not ansible_check_mode
      ansible.builtin.systemd:
        name: nova-mnt-private.service
        state: restarted
      register: nova_applied

    - name: Say when it takes effect
      ansible.builtin.debug:
        msg: >-
          {{ 'nova-mnt-private.service ran on ' ~ inventory_hostname ~ '; check its journal'
             if nova_applied is changed else
             'nova-mnt-private.service is enabled on ' ~ inventory_hostname ~
             ' and applies at the next reboot, before docker starts, or now with'
             ' -e nova_mnt_collapse=true. Until then /var/lib/nova/mnt doubles per nova'
             ' container start (libvirt/_data layers now: ' ~ nova_layers.stdout ~ ').' }}
