# Vault's foothold in a cluster for the Kubernetes secrets engine.
#
# vctl k8s token asks Vault for a short-lived ServiceAccount token; Vault, in
# turn, needs an identity in the cluster that may create service accounts,
# bind them to a ClusterRole, and mint tokens for them. This is that identity.
# Apply it once per cluster (scripts/k8s-issuer-bootstrap.sh does, and stores
# the resulting token where vault-iac reads it), then declare the cluster:
#
#   vctl k8s cluster set <name> --from-context <ctx> --source vault:kubernetes/<name>
#
# The issuer can bind only the roles it is allowed to bind (vctl-view,
# vctl-edit, cluster-admin), and every account it creates lands in vctl-access,
# named after the person who asked — so the cluster's audit log reads like
# vctl's.
#
# vctl-view and vctl-edit are the builtin view and edit plus read on the
# cluster-scoped objects a person looking at a cluster expects to see — nodes,
# namespaces, PersistentVolumes, StorageClasses, CRDs. The builtins alone never
# cover those, so a viewer bound to plain `view` cannot even `kubectl get
# nodes`. Aggregation keeps them in step with the builtins as the cluster
# upgrades.
apiVersion: v1
kind: Namespace
metadata:
  name: vctl-access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-issuer
  namespace: vctl-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vctl-vault-issuer
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts", "serviceaccounts/token"]
    verbs: ["create", "update", "delete", "get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["create", "update", "delete", "get", "list"]
  # bind lets the issuer grant these roles without holding their permissions;
  # the list is the whole set vctl hands out.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["vctl-view", "vctl-edit", "cluster-admin"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "roles"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vctl-vault-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vctl-vault-issuer
subjects:
  - kind: ServiceAccount
    name: vault-issuer
    namespace: vctl-access
---
# Read-only on the cluster-scoped objects the builtin view/edit leave out.
# Aggregated into vctl-view and vctl-edit below through its label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vctl-cluster-view
  labels:
    vctl/aggregate-cluster-view: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
# viewer tier: everything the builtin view aggregates, plus the cluster view.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vctl-view
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    - matchLabels:
        vctl/aggregate-cluster-view: "true"
rules: []
---
# editor tier: everything the builtin edit aggregates (which includes view),
# plus the cluster view.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vctl-edit
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-edit: "true"
    - matchLabels:
        vctl/aggregate-cluster-view: "true"
rules: []
---
# A long-lived token for the issuer. The engine is configured with it once;
# every token it mints for a person is short-lived and separate.
apiVersion: v1
kind: Secret
metadata:
  name: vault-issuer-token
  namespace: vctl-access
  annotations:
    kubernetes.io/service-account.name: vault-issuer
type: kubernetes.io/service-account-token
