# Daily kernel-audit retention. The hidden `vctl prune` automation command uses
# a Vault-issued delete-only credential and deletes in bounded transactions.
#
# Needs: Vault kubernetes auth role `vctl-prune` bound to this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vctl-prune
  namespace: vctl
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vctl-audit-prune
  namespace: vctl
spec:
  schedule: "17 3 * * *" # daily 03:17
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: vctl-prune
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              # Pin to a release tag; pull from the internal trusted registry.
              image: harbor.sre.local/sre/vctl:v0.2.52
              args: ["prune", "--batch-size=5000"]
              env:
                - name: VCTL_AUTH_METHOD
                  value: kubernetes
                - name: VCTL_KUBERNETES_ROLE
                  value: vctl-prune
                - name: VAULT_ADDR
                  value: https://vault.sre.local
                - name: VCTL_DB_HOST
                  value: vctl-postgres.vctl.svc.cluster.local
                - name: VCTL_KERNEL_RETENTION_DAYS
                  value: "14"
                - name: VCTL_SESSION_RETENTION_DAYS
                  value: "365"
                - name: VCTL_ACCESS_RETENTION_DAYS
                  value: "1095"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: state
                  mountPath: /home/nonroot/.vctl
          volumes:
            - name: state
              emptyDir: {}
