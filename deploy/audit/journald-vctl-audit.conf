# /etc/systemd/journald.conf.d/vctl-audit.conf
#
# Bound journald growth from the audit daemons (collector + session registrar),
# which can be chatty under load. journald is the default sink for the systemd
# units also set per-unit LogRateLimit* values. This file caps total persistent
# journal use and retention so a busy host can't fill the disk. (The audit data
# of record lives in central Postgres.)
[Journal]
# SystemMaxUse applies to the *persistent* journal in /var/log/journal, and
# RuntimeMaxUse to the volatile one in /run/log/journal. Setting only the first
# leaves hosts without a persistent journal completely uncapped: journald falls
# back to /run, which is tmpfs, so the growth lands in RAM rather than on disk.
#
# Measured on sre-srv-0090 (2026-07-31): /var/log/journal absent, and
# /run/log/journal at 1.3G against a 100M SystemMaxUse that never applied to it.
# The volume was not this agent's — 94% of it was another service — but the cap
# is this file's job either way, and a cap that silently covers only half the
# cases is worse than a missing one, because it reads as handled.
SystemMaxUse=100M
RuntimeMaxUse=100M
SystemKeepFree=1G
RuntimeKeepFree=1G
MaxRetentionSec=7day
MaxFileSec=1day
RateLimitIntervalSec=30s
RateLimitBurst=2000
