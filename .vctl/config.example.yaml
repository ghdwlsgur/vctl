# vctl optional overrides.
#
# vctl ships with compiled defaults for this environment and WORKS WITHOUT THIS
# FILE. Copy to .vctl/config.yaml only to change something below; omit the rest
# and the defaults apply. No secrets here — Vault issues tokens and DB
# credentials at runtime; nothing is stored in this file, and it is not
# auto-generated at login.
#
# Full key list + their defaults: see the README "Configuration" section.

# Auth method. The compiled default is already `oidc` (GitLab SSO, per-person),
# so `vctl login` needs nothing here. Uncomment only to override (e.g. bootstrap).
# auth_method: userpass

# Default SSH login user when an inventory host doesn't specify one.
# ssh_default_user: ubuntu

# Override ONLY if your workstation can't resolve/reach the default DB endpoint
# (e.g. dialing through a port-forward where the dial host != the cert name).
# Endpoints below are placeholders; the compiled default already points at your
# environment's Postgres. db_server_name is the TLS name to verify against, so it
# stays the certificate's dnsName even when db_host is a port-forward address.
# db_host: 127.0.0.1
# db_server_name: postgres.example.internal
# db_role_status: vctl-status
# db_role_identity: vctl-identity
# db_role_audit_ro: vctl-audit-ro
# db_role_audit_write: vctl-audit-writer
# db_role_audit_ingest: vctl-audit-ingest
# db_role_prune: vctl-pruner

# Workstation auto-auth (skip repeated logins): point at approle credential
# files. Usually `vctl login --method oidc` is simpler.
# role_id_file: /home/you/.vctl/role-id
# secret_id_file: /home/you/.vctl/secret-id

# Local inventory snapshot (~/.vctl/cache) — keeps `vctl ssh` and `vctl list`
# working while Postgres is unreachable. Writes always go to Postgres; nothing is
# ever authored locally. See the README "Surviving a Postgres Outage" section.
#
# Turn the whole mechanism off (reads fail hard when the database is down):
# cache_disabled: true
#
# How stale the snapshot may get before an online command refreshes it.
# cache_refresh: 5m
#
# How long grants confirmed by Postgres may authorize `vctl ssh` during an
# outage. Past this, offline mutate commands fail closed.
# cache_offline_ttl: 24h
#
# Oldest snapshot vctl will serve during an outage. Past this, host lookup fails
# rather than routing by topology old enough to have been reassigned. "0" lifts
# the limit.
# cache_max_age: 720h
